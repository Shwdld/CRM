<title>Atelier CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout : rail à gauche ; accueil en 3 couches (jeu, quêtes du jour, vision du pipe) ; deux kanbans ; comptes ↔ contacts liés.
   Cartes anthracite à coin découpé (encoche concave + congés arrondis), titres en Instrument Serif, texte en Inter. */
:root{
  --bg:#E4E3E0; --block:#F6F5F3; --raised:#FFFFFF; --line:#D9D6D1; --line-soft:#E9E7E3;
  --fg:#1C1917; --muted:#77716B; --faint:#A8A29C;
  --brand:#3B2317; --brand-ink:#F6F1EA; --beige:#D6C6AE;
  --c-todo:#CFCCC7; --c-contact:#8FB0D3; --c-relance:#E8995A; --c-sommeil:#6F6A65; --c-react:#A58FD0; --c-conv:#86AE7F;
  --c-rep:#8FB0D3; --c-qualif:#E2C64F; --c-call:#E8995A; --c-attente:#E7A3B5; --c-nego:#D97A6C; --c-signe:#86AE7F; --c-perdu:#AAA49E;
  --late:#D0583A; --flame:#E8823A;
  --card:#3A3836; --card-hover:#42403D; --card-fg:#F3F1EE; --card-muted:#ADA79F; --card-pill:#4B4946; --card-off:#56534F; --card-line:#5E5B57;
  --i1:#EE9AA0; --i2:#F1A96B; --i3:#F3D56C; --i4:#C9DD7E; --i5:#9CCB8A;
  --shadow:0 18px 40px -24px rgba(28,25,23,.4);
  --f-title:"Instrument Serif",ui-serif,Georgia,"Times New Roman",serif;
  --f-ui:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-block:28px; --r-card:26px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121110; --block:#1C1A19; --raised:#252220; --line:#33302D; --line-soft:#2A2725;
  --fg:#EEEAE5; --muted:#9A938C; --faint:#6B655F;
  --brand:#D9BC9A; --brand-ink:#1E140E; --beige:#7E6B55;
  --c-todo:#5E5A56; --c-contact:#7FA2C6; --c-relance:#E0925A; --c-sommeil:#8A847E; --c-react:#A893D6; --c-conv:#8BB083;
  --c-rep:#7FA2C6; --c-qualif:#D9BE4E; --c-call:#E0925A; --c-attente:#DE9AAD; --c-nego:#D9786A; --c-signe:#8BB083; --c-perdu:#77716B;
  --late:#E57858; --flame:#F0954D;
  --card:#2C2A28; --card-hover:#33312E; --card-fg:#F1EEEA; --card-muted:#A39D96; --card-pill:#3B3936; --card-off:#4A4744; --card-line:#4E4B48;
  --shadow:0 18px 40px -20px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121110; --block:#1C1A19; --raised:#252220; --line:#33302D; --line-soft:#2A2725;
  --fg:#EEEAE5; --muted:#9A938C; --faint:#6B655F;
  --brand:#D9BC9A; --brand-ink:#1E140E; --beige:#7E6B55;
  --c-todo:#5E5A56; --c-contact:#7FA2C6; --c-relance:#E0925A; --c-sommeil:#8A847E; --c-react:#A893D6; --c-conv:#8BB083;
  --c-rep:#7FA2C6; --c-qualif:#D9BE4E; --c-call:#E0925A; --c-attente:#DE9AAD; --c-nego:#D9786A; --c-signe:#8BB083; --c-perdu:#77716B;
  --late:#E57858; --flame:#F0954D;
  --card:#2C2A28; --card-hover:#33312E; --card-fg:#F1EEEA; --card-muted:#A39D96; --card-pill:#3B3936; --card-off:#4A4744; --card-line:#4E4B48;
  --shadow:0 18px 40px -20px rgba(0,0,0,.7);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
a{color:inherit}
.serif{font-family:var(--f-title);font-weight:400}
.label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.late{color:var(--late)}
.muted{color:var(--muted)}

.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--faint));flex:none;display:inline-block}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 24%,var(--raised));font-size:12px;white-space:nowrap;color:var(--fg)}
.tag .dot{width:7px;height:7px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);font-size:11.5px;color:var(--muted);white-space:nowrap}
.temp{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}
.temp span{display:inline-flex;gap:3px;padding:3px 5px;border:1px solid var(--line);border-radius:999px}
.temp i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.temp i.on{background:var(--brand)}

/* ── Structure ── */
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:30px;padding:28px 14px 22px max(18px,env(safe-area-inset-left,0px))}
.brand{display:flex;flex-direction:column;gap:2px;padding-left:8px}
.brand b{font-family:var(--f-title);font-weight:400;font-size:30px;line-height:1}
.brand span{font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:none;text-align:left;padding:9px 14px;border-radius:999px;color:var(--muted);font-size:13.5px}
.nav button:hover{color:var(--fg);background:var(--block)}
.nav button[aria-current="page"]{color:var(--brand-ink);background:var(--brand)}
.nav .count{font-size:11px;min-width:20px;text-align:center;padding:1px 7px;border-radius:10px;background:var(--late);color:#fff}
.nav .count:empty{display:none}
.rail-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-left:8px}
.jn{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.jn button{border:0;background:none;width:22px;height:22px;border-radius:50%;font-size:10.5px;font-weight:600;color:var(--faint);padding:0}
.jn button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.sync{font-size:10.5px;color:var(--faint);display:flex;align-items:center;gap:5px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.sync.on i{background:var(--c-signe)}

main{min-width:0;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px),clamp(16px,2.4vw,32px));padding-right:max(16px,env(safe-area-inset-right,0px),clamp(16px,3vw,40px))}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{margin:0;font-family:var(--f-title);font-weight:400;font-size:clamp(40px,5vw,62px);letter-spacing:-.015em;line-height:.95}
.head h1 em,.b-h h2 em{font-style:italic}
.head p{margin:10px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raised);padding:9px 16px;border-radius:999px;font-size:13px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:none}
.btn.sm{padding:5px 11px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:default}
.round{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--raised);font-size:16px;text-decoration:none;flex:none}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.block{background:var(--block);border-radius:var(--r-block);padding:22px 24px;min-width:0;display:flex;flex-direction:column;gap:16px;position:relative}
.b-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.b-h h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:32px;letter-spacing:-.01em;line-height:1}
.b-h p{margin:6px 0 0;color:var(--muted);font-size:12.5px}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}

/* ── Encoche (d'après la carte de référence) : coin concave autour du bouton, congés arrondis ── */
.notched{position:relative}
.notched>.nt,.notched>.fa,.notched>.fb{position:absolute;pointer-events:none;z-index:1}
.notched>.nt{top:0;right:0;width:66px;height:66px;background:var(--nbg);border-bottom-left-radius:33px}
.notched>.fa{top:0;right:66px;width:20px;height:20px;background:radial-gradient(circle at 0 100%,transparent 19.5px,var(--nbg) 20px)}
.notched>.fb{top:66px;right:0;width:20px;height:20px;background:radial-gradient(circle at 0 100%,transparent 19.5px,var(--nbg) 20px)}
.notched>.go{position:absolute;top:9px;right:9px;width:48px;height:48px;border-radius:50%;border:1px solid color-mix(in srgb,var(--fg) 22%,transparent);background:transparent;color:var(--fg);display:grid;place-items:center;font-size:17px;text-decoration:none;z-index:2}
.notched>.go:hover{background:var(--raised)}

/* ── Accueil : couche 1, le jeu ── */
.game{display:grid;grid-template-columns:auto minmax(0,1fr) 250px;gap:28px;align-items:center;background:var(--brand);color:var(--brand-ink);border-radius:var(--r-block);padding:24px 28px;margin-bottom:14px}
.game .label{color:var(--brand-ink);opacity:.7}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .in b{font-family:var(--f-title);font-weight:400;font-size:44px;line-height:.9}
.ring .in small{display:block;font-size:11px;opacity:.75}
.goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 26px}
.goal{display:flex;flex-direction:column;gap:7px;min-width:0}
.goal .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.goal .top span{font-size:12.5px;opacity:.85}
.goal .top b{font-family:var(--f-title);font-weight:400;font-size:26px;line-height:1}
.goal .top b small{font-family:var(--f-ui);font-size:12px;opacity:.6}
.chunk{height:14px;border-radius:999px;background:color-mix(in srgb,var(--brand-ink) 16%,transparent);overflow:hidden;position:relative}
.chunk i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),inset 0 3px 0 rgba(255,255,255,.28)}
.goal.done .top b::after{content:" ✓";font-family:var(--f-ui);font-size:14px;color:var(--c-conv)}
.goal input{width:56px;background:transparent;border:1px solid color-mix(in srgb,var(--brand-ink) 40%,transparent);border-radius:999px;padding:2px 8px;color:var(--brand-ink);font-size:12px;text-align:center}
.streak{display:flex;flex-direction:column;gap:12px;padding-left:24px;border-left:1px solid color-mix(in srgb,var(--brand-ink) 18%,transparent)}
.streak .row1{display:flex;align-items:center;gap:10px}
.streak .row1 svg{width:34px;height:34px;flex:none}
.streak .row1 b{font-family:var(--f-title);font-weight:400;font-size:40px;line-height:.9}
.streak .row1 small{display:block;font-size:12px;opacity:.75}
.week{display:flex;gap:6px}
.week span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;background:color-mix(in srgb,var(--brand-ink) 12%,transparent)}
.week span.on{background:var(--flame);color:#fff}
.week span.today{box-shadow:0 0 0 2px var(--brand),0 0 0 3.5px var(--brand-ink)}
.xp{display:flex;align-items:baseline;gap:8px;font-size:12.5px}
.xp b{font-family:var(--f-title);font-weight:400;font-size:24px}
.gbtn{background:none;border:1px solid color-mix(in srgb,var(--brand-ink) 30%,transparent);color:var(--brand-ink);border-radius:999px;padding:4px 11px;font-size:11.5px}

/* ── Accueil : couche 2, quêtes du jour ── */
.quests{display:flex;flex-direction:column;gap:8px}
.q{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--raised);border-radius:22px;padding:12px 12px 12px 12px;transition:opacity .3s,transform .3s}
.q.gone{opacity:0;transform:translateX(16px)}
.q .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#1C1917;font-size:13px;font-weight:600}
.q .ic.is-late{box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--late)}
.q .who{min-width:0;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.q .who b{font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q .who small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q .ops{display:flex;gap:6px;align-items:center}
.xpb{font-size:11px;font-weight:600;color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent);padding:3px 8px;border-radius:999px;white-space:nowrap}
.done-btn{border:0;background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:500;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.done-btn:active{transform:translateY(1px);box-shadow:none}
.qsum{display:flex;gap:8px;flex-wrap:wrap}
.qsum span{display:inline-flex;align-items:center;gap:6px;background:var(--raised);border-radius:999px;padding:5px 12px;font-size:12.5px}
.qsum b{font-weight:600;font-size:13px;line-height:1}
.qprog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.qprog .chunk{flex:1;height:10px;background:var(--line-soft)}
.cheer{display:flex;align-items:center;gap:14px;padding:18px;background:var(--raised);border-radius:22px}
.cheer b{font-family:var(--f-title);font-weight:400;font-size:24px}
.empty{padding:18px 4px;color:var(--muted);font-size:13px}
.empty b{color:var(--fg);font-weight:500}

/* ── Accueil : couche 3, vision du pipe ── */
.stack{display:flex;height:16px;border-radius:999px;overflow:hidden;gap:2px;background:var(--line-soft)}
.stack i{background:var(--c);min-width:4px}
.stack-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.stack-leg span{display:inline-flex;align-items:center;gap:6px}
.stack-leg b{color:var(--fg);font-weight:500}
.boards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bcard{background:var(--raised);border-radius:22px;padding:16px 18px 18px;text-decoration:none;display:flex;flex-direction:column;gap:6px;--nbg:var(--block)}
.bcard:hover{box-shadow:var(--shadow)}
.bcard b{font-family:var(--f-title);font-weight:400;font-size:26px;line-height:1;padding-right:60px}
.bcard small{color:var(--muted);font-size:12.5px}
.bcard .dots{display:flex;gap:4px;margin-top:6px}
.bcard .dots i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.tl-wrap{overflow-x:auto}
.tl{display:grid;gap:3px;min-width:720px;font-size:11.5px}
.tl .hd{color:var(--muted);text-align:center;font-size:10.5px;padding-bottom:4px;line-height:1.2}
.tl .hd b{display:block;font-family:var(--f-title);font-weight:400;font-size:16px;color:var(--fg)}
.tl .hd.we{opacity:.5}.tl .hd.today b{color:var(--brand);text-decoration:underline;text-underline-offset:4px}
.tl .lb{display:flex;align-items:center;gap:7px;font-size:12.5px;padding-right:8px;white-space:nowrap}
.tl .cell{min-height:34px;background:var(--raised);border-radius:10px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:3px;padding:4px 2px}
.tl .cell.we{background:color-mix(in srgb,var(--raised) 45%,transparent)}
.tl .cell.lt{background:color-mix(in srgb,var(--late) 14%,var(--raised))}
.tl .cell button{width:11px;height:11px;border-radius:50%;border:0;padding:0;background:var(--c)}
.tl .cell button.is-late{box-shadow:0 0 0 2px var(--late)}
.tl .cell em{font-style:normal;font-size:10px;color:var(--muted)}
.warn{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.warn .chipw{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--late);color:var(--fg);background:none;border-radius:999px;padding:5px 12px;font-size:12px}
.seg-f{display:inline-flex;background:var(--raised);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg-f button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:12.5px;color:var(--muted)}
.seg-f button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}

/* ── Tables ── */
.ctl select,.toolbar select,.toolbar input,.field input,.field select,.field textarea{background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12.5px;min-width:0}
.field textarea{border-radius:16px}
.table-wrap{overflow-x:auto;border-radius:20px;background:var(--raised)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-weight:500;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap;user-select:none}
th[data-sort]{cursor:pointer}
td{padding:11px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--block)}
tbody tr:last-child td{border-bottom:0}
td .nm{display:flex;align-items:center;gap:8px;font-weight:500}
.lnk{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);font:inherit;color:inherit}

/* ── Kanban ── */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input[type="search"]{flex:1 1 200px;max-width:320px}
.board-wrap{overflow-x:auto;margin-inline:-4px;padding:0 4px 12px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:300px;gap:12px;min-height:460px;align-items:start}
.col{display:flex;flex-direction:column;gap:10px;background:var(--block);border-radius:var(--r-block);padding:14px 10px 12px;min-width:0;min-height:300px}
.col.over{box-shadow:inset 0 0 0 2px var(--brand)}
.col.archive{background:transparent;border:1.5px dashed var(--line)}
.col-h{display:flex;flex-direction:column;gap:4px;padding:2px 8px 6px}
.col-h .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.col-h span{font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:8px}
.col-h em{font-style:normal;font-size:11.5px;color:var(--muted);background:var(--raised);padding:1px 9px;border-radius:999px}
.col-h small{color:var(--muted);font-size:11.5px;line-height:1.35;min-height:2.7em}
.col-bar{height:3px;border-radius:2px;background:var(--c);margin:2px 8px 4px}

.pc{--nbg:var(--block);cursor:grab}
.pc.dragging{opacity:.4}
.pc-body{background:var(--card);color:var(--card-fg);border-radius:var(--r-card);padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px;transition:background .15s}
.pc:hover .pc-body{background:var(--card-hover)}
.pc .av{width:54px;height:54px;font-size:15px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--c,var(--c-todo));color:#1C1917;font-size:12.5px;font-weight:600;letter-spacing:.02em;flex:none}
.av.is-late{box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--late)}
.pc .av.is-late{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--late)}
.av.sm{width:30px;height:30px;font-size:10.5px}
.pc-name{font-family:var(--f-title);font-size:30px;line-height:1;margin-top:8px;overflow-wrap:anywhere}
.pc-sub{font-size:13px;color:var(--card-muted);line-height:1.35;margin-top:-6px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.pc-sib{border:1px solid var(--card-line);background:none;color:var(--card-fg);border-radius:999px;padding:1px 8px;font-size:11px}

<script>
/* ───────── Référentiels ───────── */
const UNIVERS={da:"Direction artistique",graphisme:"Design graphique",hospitalite:"Expérientiel & hospitalité",b2c:"Clients directs"};
const CIBLES={studio:"Studio / agence",client_final:"Client final",apporteur:"Apporteur / partenaire",ancien_client:"Ancien client",tiede:"Prospect tiède"};
const ZONES={fr:"France",eu:"Europe",intl:"US / international"};
const ANGLES={renfort:"Renfort DA / design graphique",p360:"Projet 360",courte:"Mission courte",long:"Mission long terme"};
const CANAUX={email:"Email",instagram:"Instagram",linkedin:"LinkedIn",telephone:"Téléphone",whatsapp:"WhatsApp",rencontre:"Rencontre"};
const ROLES={decideur:"Décideur",influenceur:"Influenceur",prescripteur:"Prescripteur",utilisateur:"Utilisateur",gatekeeper:"Gatekeeper"};
const INFL={forte:"Forte",moyenne:"Moyenne",faible:"Faible"};
const ROLE_INFL={decideur:"forte",prescripteur:"moyenne",influenceur:"moyenne",utilisateur:"faible",gatekeeper:"faible"};
const RAISONS={budget:"Budget",timing:"Timing · pas maintenant",besoin:"Pas de besoin réel",concurrent:"A choisi quelqu'un d'autre",silence:"Plus de nouvelles",interne:"Fait en interne",autre:"Autre"};
const SERVICES=["Strategy & Concepts","Art Direction","Brand Identity","Graphic Design","Editorial & Publication","Digital & Web Design","Campaigns & Content","Art Buying"];
const PROSPECT=[
  {k:"a_contacter",l:"À contacter",c:"--c-todo",d:"Pas encore écrit"},
  {k:"contacte",l:"Contacté",c:"--c-contact",d:"1er message envoyé"},
  {k:"relance",l:"Relance prévue",c:"--c-relance",d:"Relance 1, 2 ou 3 programmée"},
  {k:"sommeil",l:"Sommeil",c:"--c-sommeil",d:"Relances finies sans réponse · pause volontaire"},
  {k:"reactiver",l:"À réactiver",c:"--c-react",d:"À reprendre avec un nouvel angle ou à une date choisie"},
];
const PIPE=[
  {k:"repondu",l:"Répondu",c:"--c-rep",d:"A répondu au message"},
  {k:"qualification",l:"Qualification",c:"--c-qualif",d:"Besoin, timing, type de projet, autonomie, décideurs, sérieux"},
  {k:"r1",l:"R1 · call",c:"--c-call",d:"Call planifié ou tenu"},
  {k:"proposition",l:"Proposition envoyée",c:"--c-call",d:"Devis ou proposition commerciale"},
  {k:"attente",l:"Attente · négociation",c:"--c-attente",d:"Attente de décision ou discussion en cours"},
  {k:"signe",l:"Signé",c:"--c-signe",d:"Devis accepté"},
  {k:"perdu",l:"Perdu · plus tard",c:"--c-perdu",d:"Avec la raison documentée"},
];
const ALL=[...PROSPECT,...PIPE];
const STAGE=Object.fromEntries(ALL.map(s=>[s.k,s]));
const PIPE_KEYS=PIPE.map(s=>s.k);
const ACTIVE_PIPE=["repondu","qualification","r1","proposition","attente"];
const DORMANT=["sommeil","reactiver","perdu"];
const RANK={perdu:.4,sommeil:.5,reactiver:.6,a_contacter:1,contacte:2,relance:3,repondu:4,qualification:5,r1:6,proposition:7,attente:8,signe:9};
const PSTAGES=[{k:"production",l:"En production",c:"--c-qualif"},{k:"livre",l:"Livré",c:"--c-call"},{k:"facture",l:"Facture envoyée",c:"--c-attente"},{k:"paye",l:"Payé",c:"--c-signe"}];
const TIPS={
  froid:"Message court et personnalisé, 2–3 visuels choisis dans leur univers. Une idée par message.",
  tiede:"Bien qualifier : besoin, timing, type de projet, niveau d'autonomie attendu, décideurs, sérieux.",
  chaud:"Suivre la prochaine étape convenue. Récapituler par écrit après chaque échange.",
  dormant:"Revenir avec une vraie raison : une actu, une disponibilité, un projet proche de leur univers, un nouvel angle.",
  ancien_client:"Prendre des nouvelles, annoncer une disponibilité, montrer un projet récent.",
  apporteur:"Toucher léger : une actu utile, une dispo mise à jour, le portfolio, une intro ou une reco de votre réseau. Créer de la réciprocité."
};
/* Objectifs du mois et points d'activité */
const GOALS=[
  {k:"contactes",l:"studios contactés",c:"--c-contact",re:/^Premier message envoyé/,def:20},
  {k:"reponses",l:"réponses",c:"--c-conv",re:/A répondu/,def:6},
  {k:"calls",l:"calls",c:"--c-call",re:/^Call R1/,def:4},
  {k:"propositions",l:"propositions",c:"--c-attente",re:/^Proposition envoyée/,def:2},
];
const XP_RULES=[[/^Premier message/,1],[/^Relance \d+ envoyée/,1],[/^Message de réactivation/,2],[/A répondu/,3],[/^Qualification/,3],[/^Call R1/,5],[/^Proposition envoyée/,8],[/^Suivi/,2],[/^Négociation|^En attente/,2],[/^Signé/,20]];
const xpOf=t=>{for(const[r,n]of XP_RULES)if(r.test(t))return n;return 0};

/* ───────── Dates ───────── */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=s?new Date(s+"T12:00"):new Date();d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((new Date(a+"T12:00")-new Date(b+"T12:00"))/864e5);
const MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const MOIS_L=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const JOURS=["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
const fmtD=s=>{if(!s)return"—";const d=new Date(s+"T12:00");return d.getDate()+" "+MOIS[d.getMonth()]};
const rel=s=>{if(!s)return"—";const n=diff(s,today());if(n===0)return"Aujourd'hui";if(n===1)return"Demain";if(n===-1)return"Hier";if(n<0)return"Il y a "+(-n)+" j";if(n<7)return"Dans "+n+" j";return fmtD(s)};
const ago=s=>{if(!s)return"—";const n=diff(today(),s);return n===0?"Aujourd'hui":n===1?"Hier":"Il y a "+n+" j"};
const eur=n=>new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n||0);
const monday=()=>{const d=new Date();d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)};
const isWE=s=>{const g=new Date(s+"T12:00").getDay();return g===0||g===6};

/* ───────── Logique contacts ───────── */
function migrate(c){
  const s=c.stage||"a_contacter";
  const map={prospection:(c.relances||1)<=1?"contacte":"relance",reponse:"repondu",decouverte:"qualification",devis:"proposition",timing:"perdu",veille:"sommeil"};
  if(map[s]){c.stage=map[s];if(s==="timing"&&!c.raison)c.raison="timing"}
  if(!STAGE[c.stage])c.stage="a_contacter";
  if(!c.poste&&c.nom&&c.nom.includes(",")){const i=c.nom.indexOf(",");c.poste=c.nom.slice(i+1).trim();c.nom=c.nom.slice(0,i).trim()}
  return c;
}
const stage=c=>c.stage||"a_contacter";
const board=c=>PIPE_KEYS.includes(stage(c))?"pipe":"prospect";
const relanceNum=c=>Math.max(1,(c.relances||1));
const colorOf=c=>{const s=stage(c);if(s==="attente"&&c.nego)return"--c-nego";return(STAGE[s]||STAGE.a_contacter).c};
const stageLabel=c=>{const s=stage(c);if(s==="attente")return c.nego?"Négociation":"Attente décision";if(s==="relance")return"Relance "+relanceNum(c)+" prévue";return STAGE[s].l};
function temperature(c){
  const s=stage(c);
  if(s==="signe")return"client";
  if(DORMANT.includes(s))return"dormant";
  if(["r1","proposition","attente"].includes(s))return"chaud";
  if(["repondu","qualification"].includes(s)||c.cible==="tiede"||c.cible==="ancien_client")return"tiede";
  return"froid";
}
const TEMP_L={froid:"Froid",tiede:"Tiède",chaud:"Chaud",dormant:"Dormant",client:"Client"};
const isLate=c=>!!(c.next&&c.next.date&&c.next.date<today()&&stage(c)!=="signe");
const isOpp=c=>ACTIVE_PIPE.includes(stage(c));
const inConversation=c=>["contacte","relance",...ACTIVE_PIPE].includes(stage(c));
function lastContact(c){const h=(c.hist||[]).find(x=>!/^Fiche créée/.test(x.t));return h?h.d:""}
function lastContactText(c){const h=(c.hist||[]).find(x=>!/^Fiche créée/.test(x.t));return h?h.t:""}
function priorite(c){
  const m={froid:1,tiede:2,chaud:3,dormant:.5,client:0}[temperature(c)];
  let s=m*2+(c.potentiel||0)*1.5;
  if(isLate(c))s+=Math.min(3,-diff(c.next.date,today())/3)+1;
  return s;
}
function tipFor(c){
  if(c.cible==="apporteur")return TIPS.apporteur;
  if(c.cible==="ancien_client")return TIPS.ancien_client;
  const t=temperature(c);return TIPS[t==="client"?"chaud":t];
}
function zoneHint(c){
  if(c.zone==="intl")return"Fuseau US : envoyer entre 15h et 18h, heure de Paris.";
  if(c.zone==="eu")return"Europe : même créneau qu'en France, éviter le lundi matin.";
  return"";
}
function rythme(c,n,from){
  const t=c.cible;
  if(t==="apporteur")return{stage:"relance",next:{date:addDays(from,35),label:"Toucher léger (4–6 semaines)"}};
  if(t==="ancien_client")return{stage:"relance",next:{date:addDays(from,45),label:"Prendre des nouvelles (1×/mois à 1×/2 mois)"}};

const SUIVI={repondu:3,qualification:5,r1:5,proposition:7,attente:5};
function appliquer(c,ev,opts={}){
  const t=today(),h=(c.hist||[]).slice();
  const p={};const log=txt=>h.unshift({d:t,t:txt});
  switch(ev){
    case"envoye":{
      const fresh=DORMANT.includes(stage(c));
      const n=fresh?1:(c.relances||0)+1;p.relances=n;
      log(fresh?"Message de réactivation envoyé":n===1?"Premier message envoyé":"Relance "+(n-1)+" envoyée");
      const r=rythme(c,n,t);p.stage=r.stage;p.next=r.next;
      if(r.stage==="sommeil")log("Pas de réponse après 3 relances · mise en sommeil");
      break}
    case"suivi":p.next={date:addDays(t,SUIVI[stage(c)]||5),label:(c.next&&c.next.label)||"Suivi"};log("Suivi · "+((c.next&&c.next.label)||stageLabel(c)));break;
    case"sommeil":p.stage="sommeil";p.next={date:opts.date||addDays(t,75),label:"Fin de la pause : réactiver ?"};log("Mis en sommeil");break;
    case"reactiver":p.stage="reactiver";p.next={date:opts.date||addDays(t,30),label:"Réactiver"+(c.angleReact?" · "+c.angleReact:" avec un nouvel angle")};log("À réactiver");break;
    case"a_contacter":p.stage="a_contacter";p.next={date:t,label:"Envoyer le premier message"};break;
    case"repondu":p.stage="repondu";p.next={date:addDays(t,3),label:"Qualifier : besoin, timing, décideurs"};p.converti=t;log("A répondu · converti en opportunité");break;
    case"qualification":p.stage="qualification";p.next={date:addDays(t,5),label:"Planifier le call R1"};log("Qualification");break;
    case"r1":p.stage="r1";p.next={date:addDays(t,5),label:"Envoyer la proposition"};log("Call R1");break;
    case"proposition":p.stage="proposition";p.next={date:addDays(t,7),label:"Relancer la proposition"};log("Proposition envoyée"+(c.montant?" · "+eur(c.montant):""));break;
    case"attente":p.stage="attente";p.nego=false;p.next={date:addDays(t,7),label:"Point sur la décision"};log("En attente de décision");break;
    case"nego":p.stage="attente";p.nego=true;p.next={date:addDays(t,4),label:"Avancer la négociation"};log("Négociation en cours");break;
    case"signe":p.stage="signe";p.next=null;log("Signé");break;
    case"perdu":p.stage="perdu";p.next={date:addDays(t,90),label:"Reprendre contact ?"};log("Perdu · plus tard");break;
  }
  p.hist=h.slice(0,60);p.maj=t;

}

const TL=[{k:"relances",l:"Relances",st:["a_contacter","contacte","relance"],c:"--c-relance"},{k:"calls",l:"Calls",st:["repondu","qualification"],c:"--c-qualif"},
  {k:"props",l:"Propositions",st:["r1","proposition","attente"],c:"--c-attente"},{k:"react",l:"Réactivations",st:["sommeil","reactiver","perdu"],c:"--c-react"}];
function blocTimeline(){
  const t=today(),N=S.home.weeks*7;const days=[];for(let i=0;i<N;i++)days.push(addDays(t,i));
  const end=days[days.length-1];
  const noNext=S.contacts.filter(c=>isOpp(c)&&!(c.next&&c.next.date));
  const lateAll=S.contacts.filter(isLate);
  const cell=(list,cls)=>`<div class="cell ${cls}">${list.slice(0,4).map(c=>`<button data-open="${c.id}" class="${isLate(c)?"is-late":""}" style="--c:var(${colorOf(c)})" title="${esc((c.studio||c.nom)+" · "+(c.next.label||""))}" aria-label="${esc(c.studio||c.nom)}"></button>`).join("")}${list.length>4?`<em>+${list.length-4}</em>`:""}</div>`;
  const cols=`130px 52px repeat(${N},minmax(22px,1fr))`;

  TL.forEach(r=>{const pool=S.contacts.filter(c=>r.st.includes(stage(c))&&c.next&&c.next.date&&c.next.date<=end);
    html+=`<div class="lb"><i class="dot" style="--c:var(${r.c})"></i>${r.l}</div>`+cell(pool.filter(c=>c.next.date<t),"lt")+days.map(d=>cell(pool.filter(c=>c.next.date===d),isWE(d)?"we":"")).join("")});
  html+="</div>";
  return`<section class="block span-12"><div class="b-h"><div><h2>Rythme <em>commercial</em></h2><p>Relances, calls, propositions et réactivations des ${S.home.weeks} prochaines semaines</p></div>
    <div class="seg-f" role="group" aria-label="Période">${[2,4].map(n=>`<button data-weeks="${n}" aria-pressed="${S.home.weeks===n}">${n} semaines</button>`).join("")}</div></div>
    <div class="tl-wrap">${html}</div>
    ${lateAll.length||noNext.length?`<div class="warn">${lateAll.length?`<span class="late">${lateAll.length} action(s) en retard</span>`:""}
      ${noNext.map(c=>`<button class="chipw" data-open="${c.id}"><i class="dot" style="--c:var(${colorOf(c)})"></i>${esc(c.studio||c.nom)} · sans prochaine étape</button>`).join("")}</div>`:""}
  </section>`;
}

function pcard(c){

  const right=board(c)==="pipe"&&c.montant?`<div class="k">Budget</div><span class="pc-pill">${eur(c.montant)}</span>`:`<div class="k">${lvl}</div><span class="pc-dots">${[1,2,3,4,5].map(i=>`<i class="${i<=on?"on":""}"></i>`).join("")}</span>`;

/* ───────── CHIFFRES ───────── */
function vDash(){
  const t=today(),y=t.slice(0,4),m=t.slice(0,7);
  const paid=S.projets.filter(p=>p.stage==="paye");
  const sum=a=>a.reduce((s,p)=>s+(+p.montant||0),0);
  const yr=sum(paid.filter(p=>(p.paye||"").startsWith(y))),mo=sum(paid.filter(p=>(p.paye||"").startsWith(m)));
  const pend=sum(S.projets.filter(p=>p.stage==="facture")),prod=sum(S.projets.filter(p=>p.stage==="production"||p.stage==="livre"));
  const opp=S.contacts.filter(isOpp).reduce((s,c)=>s+(+c.montant||0),0);
  const months=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);months.push(iso(d).slice(0,7))}
  const mv=months.map(k=>sum(paid.filter(p=>(p.paye||"").startsWith(k))));const mx=Math.max(1,...mv);
  const contacted=c=>(c.relances||0)>0||stage(c)!=="a_contacter";
  const rates=Object.entries(UNIVERS).map(([k,l])=>{const cs=S.contacts.filter(c=>c.univers===k&&contacted(c));const a=cs.filter(c=>board(c)==="pipe").length;return{l,n:cs.length,p:cs.length?a/cs.length:0}});
  const lost=Object.entries(RAISONS).map(([k,l])=>({l,n:S.contacts.filter(c=>stage(c)==="perdu"&&c.raison===k).length})).filter(r=>r.n);const lmx=Math.max(1,...lost.map(r=>r.n));
  const grp=c=>{const s=stage(c);if(s==="a_contacter")return"todo";if(s==="contacte"||s==="relance")return"contacte";if(s==="signe")return"won";if(DORMANT.includes(s))return"dorm";return"discussion"};
  const groups=[["todo","À contacter","var(--c-todo)"],["contacte","Contacté","var(--c-contact)"],["discussion","En discussion","var(--c-qualif)"],["won","Signé","var(--c-signe)"],["dorm","Dormant","var(--c-sommeil)"]];
  const gc=Object.fromEntries(groups.map(g=>[g[0],0]));S.contacts.forEach(c=>gc[grp(c)]++);
  const total=S.contacts.length||1,R=70,C=2*Math.PI*R;let off=0;
  const arcs=groups.map(([k,,col])=>{const len=gc[k]/total*C;const a=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${col}" stroke-width="26" stroke-dasharray="${Math.max(0,len-(gc[k]?2:0))} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;off+=len;return a}).join("");
  const nm=months.map(mm=>S.contacts.filter(c=>(c.cree||"").startsWith(mm)).length);const nmx=Math.max(1,...nm);
  return head("Chiffres","Calculés à partir de vos projets et de vos fiches.")
  +`<div class="kpis">
    <div class="kpi hero"><span class="label">Encaissé ${y}</span><span class="v">${eur(yr)}</span><span class="s">dont ${eur(mo)} ce mois</span></div>
    <div class="kpi"><span class="label">Factures en attente</span><span class="v">${eur(pend)}</span><span class="s">Envoyées, pas encore payées</span></div>
    <div class="kpi"><span class="label">En production</span><span class="v">${eur(prod)}</span><span class="s">Signés, en cours ou livrés</span></div>
    <div class="kpi"><span class="label">Pipeline actif</span><span class="v">${eur(opp)}</span><span class="s">Budget potentiel des opportunités</span></div>
  </div>
  <div class="grid">
    <section class="block span-6"><div class="b-h"><h2>Encaissé · 6 mois</h2></div>
      <div class="cols">${mv.map(v=>`<div class="c"><span>${v?Math.round(v/100)/10+"k":""}</span><div style="height:${(v/mx)*100}%"></div></div>`).join("")}</div>
      <div class="cols-x">${months.map(k=>`<span>${MOIS[+k.slice(5)-1]}</span>`).join("")}</div></section>
    <section class="block span-6"><div class="b-h"><div><h2>Répartition</h2><p>Où en sont vos ${S.contacts.length} contacts</p></div></div>
      <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><svg class="donut" viewBox="0 0 200 200" role="img" aria-label="Répartition des contacts"><circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--line-soft)" stroke-width="26"/>${arcs}
        <text x="100" y="112" text-anchor="middle" font-size="50" style="fill:var(--fg);font-family:var(--f-title)">${S.contacts.length}</text></svg>
      <div class="donut-leg" style="flex:1;min-width:200px">${groups.map(([k,l,col])=>`<div><i class="dot" style="background:${col}"></i>${l}<b>${gc[k]}</b></div>`).join("")}</div></div></section>
    <section class="block span-6"><div class="b-h"><div><h2>Taux de réponse</h2><p>Contacts passés dans le Pipeline ÷ contacts sollicités</p></div></div><div class="bars">
      ${rates.map(r=>`<div class="bar"><span>${r.l}</span><div class="track"><div class="fill" style="width:${r.p*100}%;--c:var(--c-conv)"></div></div><span class="n">${r.n?Math.round(r.p*100)+" %":"—"}</span></div>`).join("")}</div></section>
    <section class="block span-6"><div class="b-h"><div><h2>Nouveaux contacts</h2><p>Pour vérifier que vous alimentez bien le pipe</p></div></div>
      <div class="cols">${nm.map(v=>`<div class="c"><span>${v||""}</span><div style="height:${(v/nmx)*100}%;background:var(--c-contact)"></div></div>`).join("")}</div>
      <div class="cols-x">${months.map(k=>`<span>${MOIS[+k.slice(5)-1]}</span>`).join("")}</div></section>
    <section class="block span-12"><div class="b-h"><div><h2>Pourquoi on perd</h2><p>Raisons documentées dans la colonne « Perdu · plus tard »</p></div></div>
      ${lost.length?`<div class="bars">${lost.map(r=>`<div class="bar"><span>${r.l}</span><div class="track"><div class="fill" style="width:${r.n/lmx*100}%;--c:var(--c-perdu)"></div></div><span class="n">${r.n}</span></div>`).join("")}</div>`:`<div class="empty">Aucune opportunité perdue pour l'instant.</div>`}</section>
  </div>`;
}

function parseTable(txt){
  txt=txt.replace(/^﻿/,"");const first=txt.split(/\r?\n/)[0]||"";

  const rows=[];let cur=[""],q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur[cur.length-1]+='"';i++}else q=false}else cur[cur.length-1]+=ch}
    else if(ch==='"')q=true;else if(ch===sep)cur.push("");else if(ch==="\n"){rows.push(cur);cur=[""]}else if(ch!=="\r")cur[cur.length-1]+=ch}
  rows.push(cur);return rows.filter(r=>r.some(c=>c.trim()));
}

  if(m){let y=+m[3];if(y<100)y+=2000;return y+"-"+pad(+m[2])+"-"+pad(+m[1])}m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:""}
const EU=["royaume","uk","london","londres","allemagne","germany","berlin","italie","italy","milan","espagne","spain","madrid","barcelon","belgique","belgium","bruxelles","suisse","switzerland","geneve","zurich","pays-bas","netherlands","amsterdam","portugal","lisbonne","danemark","copenhag","suede","stockholm","autriche","vienne","irlande","dublin","europe"];
const FR=["france","paris","lyon","marseille","bordeaux","lille","nantes","toulouse","nice","rennes","strasbourg","montpellier"];
function guessZone(loc){const l=nrm(loc);if(!l)return"";if(FR.some(w=>l.includes(w)))return"fr";if(EU.some(w=>l.includes(w)))return"eu";return"intl"}
function guessUnivers(s,def){const l=nrm(s);if(/graph/.test(l))return"graphisme";if(/hosp|hotel|restau|experien|event/.test(l))return"hospitalite";if(/\bda\b|direction|artist|campagn/.test(l))return"da";if(/b2c|particulier|direct/.test(l))return"b2c";return def}
function buildImport(txt){
  const rows=parseTable(txt);if(rows.length<2)return null;
  const h=rows[0].map(nrm);
  const find=(...keys)=>h.findIndex(x=>keys.some(k=>x.includes(k)));
  const ix={loc:find("locali","ville","pays","lieu"),studio:find("studio","client","nom","agence","entreprise"),dom:find("domaine","activite","secteur"),stat:find("statut","status","etat"),mail:find("mail"),note:find("note","info","reco")};
  const dateCols=h.map((x,i)=>/date|mail \d|relance/.test(x)&&i!==ix.mail?i:-1).filter(i=>i>=0);
  const contactIx=h.findIndex((x,i)=>i!==ix.studio&&/(contact|prenom|personne|interlocut)/.test(x));
  const posteIx=h.findIndex(x=>/(poste|fonction|role|titre)/.test(x));
  const defU=document.getElementById("i-univers").value,defC=document.getElementById("i-cible").value,defZ=document.getElementById("i-zone").value,defK=document.getElementById("i-canal").value;
  const out=rows.slice(1).map(r=>{
    const g=i=>i>=0?(r[i]||"").trim():"";
    const dates=dateCols.map(i=>parseDate(r[i])).filter(Boolean).sort();
    const st=nrm(g(ix.stat));
    const c={id:uid(),studio:g(ix.studio),nom:contactIx>=0?g(contactIx):"",poste:posteIx>=0?g(posteIx):"",email:g(ix.mail),localisation:g(ix.loc),notes:g(ix.note),canal:defK,
      univers:guessUnivers(g(ix.dom),defU),cible:defC,zone:defZ==="auto"?(guessZone(g(ix.loc))||"fr"):defZ,potentiel:0,angle:"",relances:dates.length,hist:[],cree:today()};
    if(/reco/.test(nrm(c.notes)))c.potentiel=2;
    dates.forEach((d,i)=>c.hist.unshift({d,t:i===0?"Premier message envoyé":"Relance "+i+" envoyée"}));
    const last=dates[dates.length-1];
    if(/repon|repondu/.test(st)){c.stage="repondu";c.converti=today();c.next={date:today(),label:"Qualifier : besoin, timing, décideurs"}}

async function ensureCompte(name,extra={},cache){

    <label class="field"><span class="label">Facture envoyée le</span><input id="p-facture" type="date" value="${p.facture||""}"></label>
    <label class="field"><span class="label">Payée le</span><input id="p-paye" type="date" value="${p.paye||""}"></label>
    <div class="field full"><span class="label">Prestations</span><div class="steps" id="p-services">${SERVICES.map(s=>`<button type="button" class="btn sm ${(p.services||[]).includes(s)?"primary":""}" data-svc="${esc(s)}">${s}</button>`).join("")}</div></div>
    <label class="field full"><span class="label">Notes</span><textarea id="p-notes">${esc(p.notes)}</textarea></label>
  </div>
  <div class="actions" style="justify-content:space-between"><button class="btn primary" data-act="save-p">${isNew?"Créer le projet":"Enregistrer"}</button>${isNew?"":`<button class="btn ghost" data-act="del-p" style="color:var(--late)">Supprimer</button>`}</div>
  </div></aside>`;
}

/* ───────── Rendu ───────── */
function render(){
  buildIndex();renderNav();
  const V={today:vToday,prospect:vProspect,pipeline:vPipeline,comptes:vComptes,contacts:vContacts,projets:vProjets,dash:vDash,import:vImport}[S.view]||vToday;
  const keep=S.view==="import"&&document.getElementById("i-paste");
  if(!keep)document.getElementById("main").innerHTML=V();
  renderLayer();
}
function renderLayer(){
  const L=document.getElementById("layer");
  if(S.open){const c=S.open==="new"?S.draft:S.contacts.find(x=>x.id===S.open);
    if(!c){S.open=null;L.innerHTML="";L.dataset.k="";return}
    const k=S.open+":"+(c.maj||"")+":"+(c.hist||[]).length+":"+c.stage+":"+(c.nego?1:0)+":"+(c.compteId||"");
    if(L.dataset.k!==k){L.innerHTML=drawerContact(c,S.open==="new");L.dataset.k=k}
    return}
  if(S.openC){const a=S.openC==="new"?{nom:"",contacts:[],conv:[],secteur:"",pays:"",univers:"",timing:"",notes:"",valeur:0}:accounts().find(x=>x.id===S.openC);
    if(!a){S.openC=null;L.innerHTML="";L.dataset.k="";return}
    const k="a"+S.openC+":"+(a.doc?JSON.stringify(a.doc).length:0)+":"+a.contacts.map(c=>c.id+c.stage+(c.maj||"")).join("");
    if(L.dataset.k!==k){L.innerHTML=drawerCompte(a,S.openC==="new");L.dataset.k=k}return}
  if(S.openP){const p=S.openP==="new"?S.draftP:S.projets.find(x=>x.id===S.openP);if(!p){S.openP=null;L.innerHTML="";L.dataset.k="";return}
    if(L.dataset.k!=="p"+S.openP){L.innerHTML=drawerProjet(p,S.openP==="new");L.dataset.k="p"+S.openP}return}
  L.innerHTML="";L.dataset.k="";
}
const closeLayer=()=>{S.open=null;S.openP=null;S.openC=null;renderLayer()};
const openContact=id=>{S.open=id;S.openP=null;S.openC=null;document.getElementById("layer").dataset.k="";renderLayer()};
const openCompte=id=>{S.openC=id;S.open=null;S.openP=null;document.getElementById("layer").dataset.k="";renderLayer()};

/* ───────── Interactions ───────── */
document.addEventListener("click",async e=>{
  const t=e.target;
  if(t.closest("[data-close]")){closeLayer();return}
  const star=t.closest("[data-star]");if(star){const n=+star.dataset.star,cur=document.querySelectorAll("#c-pot .on").length;const v=cur===n?n-1:n;document.querySelectorAll("#c-pot button").forEach((b,i)=>b.classList.toggle("on",i<v));return}
  const svc=t.closest("[data-svc]");if(svc){svc.classList.toggle("primary");return}
  const pk=t.closest("[data-pick]");if(pk){const i=document.getElementById("c-studio");i.value=pk.dataset.pick;document.getElementById("c-studio-hint").innerHTML=studioHint(i.value,S.open);return}
  const wk=t.closest("[data-weeks]");if(wk){S.home.weeks=+wk.dataset.weeks;render();return}
  const qd=t.closest("[data-quest]");if(qd){const c=S.contacts.find(x=>x.id===qd.dataset.quest);if(!c)return;const q=quest(c);const row=qd.closest(".q");if(row)row.classList.add("gone");
    setTimeout(async()=>{if(await runEvent(c,q.ev,true))toast("+"+q.xp+" pt"+(q.xp>1?"s":"")+" · "+q.t,"xp")},220);return}
  const pr=t.closest("[data-principal]");if(pr){await setPrincipal(S.openC,pr.dataset.principal);return}
  const oc=t.closest("[data-openc]");if(oc){e.preventDefault();openCompte(oc.dataset.openc);return}
  const ev=t.closest("[data-ev]");if(ev){const c=S.contacts.find(x=>x.id===ev.dataset.id);if(c)await runEvent(c,ev.dataset.ev);return}
  const sn=t.closest("[data-snooze]");if(sn){const c=S.contacts.find(x=>x.id===sn.dataset.snooze);if(c&&c.next){await save("contacts",c.id,{next:{...c.next,date:addDays(c.next.date<today()?today():c.next.date,3)}});toast("Reporté de 3 jours")}return}
  const op=t.closest("[data-open]");if(op&&!t.closest("a,button:not([data-open])")){openContact(op.dataset.open);return}
  const opp=t.closest("[data-openp]");if(opp){S.openP=opp.dataset.openp;S.open=null;S.openC=null;renderLayer();return}
  const so=t.closest("[data-sort]");if(so){const k=so.dataset.sort;S.sort=S.sort.k===k?{k,dir:-S.sort.dir}:{k,dir:["studio","next","nom"].includes(k)?1:-1};render();return}
  const a=t.closest("[data-act]");if(!a)return;
  switch(a.dataset.act){
    case"new":S.draft={univers:"da",cible:"studio",zone:"fr",canal:"email",potentiel:0,stage:"a_contacter"};S.open="new";S.openC=null;renderLayer();break;
    case"new-pipe":S.draft={univers:"da",cible:"studio",zone:"fr",canal:"email",potentiel:2,stage:"repondu"};S.open="new";S.openC=null;renderLayer();break;
    case"add-to-compte":{const ac=accounts().find(x=>x.id===S.openC);S.draft={univers:(ac&&ac.univers)||"da",cible:"studio",zone:"fr",canal:"email",potentiel:0,stage:"a_contacter",studio:ac?ac.nom:""};S.open="new";S.openC=null;document.getElementById("layer").dataset.k="";renderLayer();break}
    case"new-compte":openCompte("new");break;
    case"newp":S.draftP={stage:"production",univers:"da",services:[]};S.openP="new";S.open=null;S.openC=null;renderLayer();break;
    case"save-c":await saveContact();break;
    case"del-c":if(a.dataset.sure){await del("contacts",S.open);closeLayer();toast("Fiche supprimée")}else{a.dataset.sure=1;a.textContent="Confirmer la suppression"}break;
    case"save-a":await saveCompte();break;
    case"del-a":if(a.dataset.sure){const ac=accounts().find(x=>x.id===S.openC);if(ac&&ac.doc)await del("comptes",ac.doc.id);closeLayer();toast("Compte supprimé · les contacts restent")}else{a.dataset.sure=1;a.textContent="Confirmer la suppression"}break;
    case"save-p":await saveProjet();break;
    case"del-p":if(a.dataset.sure){await del("projets",S.openP);closeLayer();toast("Projet supprimé")}else{a.dataset.sure=1;a.textContent="Confirmer la suppression"}break;
    case"edit-goals":S.home.editGoals=true;render();break;
    case"save-goals":{const o={};GOALS.forEach(g=>{const v=+(document.getElementById("goal-"+g.k)||{}).value;o[g.k]=v>0?v:g.def});S.home.editGoals=false;S.obj=o;render();if(S.db){try{await S.db.doc("reglages/objectifs").set(o);toast("Objectifs enregistrés")}catch(_){toast("Objectifs non enregistrés. Réessayez.")}}break}
    case"toggle-all":S.home.showAll=!S.home.showAll;render();break;
    case"do-import":a.disabled=true;await doImport();break;
    case"cancel-import":IMP=null;document.getElementById("i-preview").innerHTML="";document.getElementById("i-paste").value="";break;
    case"clear-ex":if(a.dataset.sure){a.disabled=true;for(const c of S.contacts.filter(x=>x.exemple))await del("contacts",c.id);for(const p of S.projets.filter(x=>x.exemple))await del("projets",p.id);for(const p of S.comptes.filter(x=>x.exemple))await del("comptes",p.id);toast("Exemples supprimés")}else{a.dataset.sure=1;a.textContent="Confirmer : supprimer les exemples"}break;
  }
});
async function runEvent(c,ev,quiet){
  const opts={};const nd=document.getElementById("c-nextdate");
  if((ev==="reactiver"||ev==="sommeil")&&nd&&nd.value&&nd.value>today())opts.date=nd.value;
  const p=appliquer(c,ev,opts);
  if(ev==="reactiver"){const ar=document.getElementById("c-angleReact");if(ar&&ar.value.trim()){p.angleReact=ar.value.trim();p.next.label="Réactiver · "+p.angleReact}}
  if(!(await save("contacts",c.id,p)))return false;
  if(ev==="signe"){const id=uid();await save("projets",id,{titre:"Projet "+(c.studio||c.nom||""),client:c.studio||c.nom||"",contactId:c.id,univers:c.univers||"da",montant:+c.montant||0,stage:"production",services:[],cree:today(),exemple:!!c.exemple},true);toast("Bravo ! Le projet est créé dans « Projets ».","xp")}
  else if(ev==="perdu"){openContact(c.id);toast("Notez la raison dans la fiche");setTimeout(()=>{const r=document.getElementById("c-raison");if(r)r.focus()},80)}
  else if(quiet){}
  else if(ev==="repondu")toast("Converti : la carte passe dans le Pipeline","xp");
  else toast(p.next?"Prochaine action : "+rel(p.next.date).toLowerCase():"Enregistré");
  return true;
}
function readContactForm(){
  const v=id=>(document.getElementById(id)||{}).value??"";
  const f={studio:v("c-studio").trim(),nom:v("c-nom").trim(),poste:v("c-poste").trim(),role:v("c-role"),influence:v("c-influence"),email:v("c-email").trim(),localisation:v("c-localisation").trim(),univers:v("c-univers"),cible:v("c-cible"),zone:v("c-zone"),angle:v("c-angle"),
    canal:v("c-canal"),besoin:v("c-besoin").trim(),angleReact:v("c-angleReact").trim(),potentiel:document.querySelectorAll("#c-pot .on").length,montant:+v("c-montant")||0,notes:v("c-notes")};
  if(document.getElementById("c-raison")){f.raison=v("c-raison");f.raisonNote=v("c-raisonNote").trim()}
  return f;
}
async function saveContact(){
  const f=readContactForm();
  if(!f.studio&&!f.nom){toast("Indiquez au moins un nom ou une entreprise.");return}
  if(f.email&&S.contacts.some(x=>x.id!==S.open&&x.email&&x.email.toLowerCase()===f.email.toLowerCase())){toast("Un contact avec ce mail existe déjà.");return}
  f.compteId=f.studio?await ensureCompte(f.studio,{univers:f.univers}):"";
  if(S.open==="new"){const id=uid(),st=S.draft.stage||"a_contacter";
    const body={...f,stage:st,relances:st==="repondu"?1:0,next:st==="repondu"?{date:addDays(today(),3),label:"Qualifier : besoin, timing, décideurs"}:{date:today(),label:"Envoyer le premier message"},hist:[{d:today(),t:"Fiche créée"}],cree:today(),maj:today()};
    if(st==="repondu")body.converti=today();
    if(await save("contacts",id,body,true)){toast("Contact créé");openContact(id)}}
  else{const c=S.contacts.find(x=>x.id===S.open);
    const nd=(document.getElementById("c-reprise")||{}).value||(document.getElementById("c-nextdate")||{}).value;
    const patch={...f,maj:today()};if(nd&&c&&(!c.next||c.next.date!==nd))patch.next={label:(c.next&&c.next.label)||"Relance",date:nd};
    if(await save("contacts",S.open,patch)){toast("Enregistré");closeLayer()}}
}
/* Un compte « virtuel » (déduit du nom d'entreprise) devient une vraie fiche au premier enregistrement */
async function materialize(a){
  if(a.doc)return a.doc.id;
  const id=await ensureCompte(a.nom,{univers:a.univers});
  for(const c of a.contacts)if(c.compteId!==id)await save("contacts",c.id,{compteId:id});
  return id;
}
async function saveCompte(){
  const v=id=>(document.getElementById(id)||{}).value??"";
  const body={nom:v("a-nom").trim(),secteur:v("a-secteur").trim(),pays:v("a-pays").trim(),univers:v("a-univers"),valeur:+v("a-valeur")||0,timing:v("a-timing").trim(),notes:v("a-notes")};
  if(!body.nom){toast("Donnez un nom à l'entreprise.");return}
  if(S.openC==="new"){const id=uid();if(await save("comptes",id,{...body,cree:today()},true)){toast("Compte créé");openCompte(id)}return}
  const a=accounts().find(x=>x.id===S.openC);if(!a)return;
  const id=await materialize(a);if(!id)return;
  if(await save("comptes",id,body)){
    if(norm(body.nom)!==norm(a.nom))for(const c of a.contacts)await save("contacts",c.id,{studio:body.nom,compteId:id});
    toast("Compte enregistré");closeLayer()}
}
async function setPrincipal(key,cid){
  const a=accounts().find(x=>x.id===key);if(!a)return;
  const id=await materialize(a);if(!id)return;
  const cur=a.doc&&a.doc.principal;
  if(await save("comptes",id,{principal:cur===cid?"":cid})){toast(cur===cid?"Contact principal retiré":"Contact principal défini");if(key!==id)openCompte(id)}
}
async function saveProjet(){
  const v=id=>(document.getElementById(id)||{}).value??"";
  const body={titre:v("p-titre").trim(),client:v("p-client").trim(),univers:v("p-univers"),montant:+v("p-montant")||0,stage:v("p-stage"),facture:v("p-facture"),paye:v("p-paye"),notes:v("p-notes"),
    services:[...document.querySelectorAll("#p-services .primary")].map(b=>b.dataset.svc)};
  if(body.stage==="facture"&&!body.facture)body.facture=today();
  if(body.stage==="paye"&&!body.paye)body.paye=today();
  if(!body.titre){toast("Donnez un nom au projet.");return}
  const isNew=S.openP==="new",id=isNew?uid():S.openP;
  if(await save("projets",id,isNew?{...body,cree:today()}:body,isNew)){toast(isNew?"Projet créé":"Enregistré");closeLayer()}
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(S.open||S.openP||S.openC))closeLayer()});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id&&id.startsWith("f-")){S.filters[id.slice(2)]=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById(id);if(el){el.focus();if(id==="f-q"&&pos!=null)el.setSelectionRange(pos,pos)}}
  if(id==="c-studio"){const h=document.getElementById("c-studio-hint");if(h)h.innerHTML=studioHint(e.target.value,S.open)}
  if(id==="c-role"){const inf=document.getElementById("c-influence");if(inf&&!inf.value)inf.value=ROLE_INFL[e.target.value]||""}
  if(id==="i-paste"){clearTimeout(window._pt);window._pt=setTimeout(()=>{if(e.target.value.trim())showPreview(e.target.value)},400)}
});
document.addEventListener("change",e=>{
  if(e.target.id==="i-file"&&e.target.files[0])readFile(e.target.files[0]);
  if(e.target.id==="c-role"){const inf=document.getElementById("c-influence");if(inf&&!inf.value)inf.value=ROLE_INFL[e.target.value]||""}
  if(["i-univers","i-cible","i-zone","i-canal"].includes(e.target.id)){const p=document.getElementById("i-paste");if(window._lastTxt||p.value)showPreview(window._lastTxt||p.value)}
});
function readFile(f){const r=new FileReader();r.onload=()=>{window._lastTxt=r.result;showPreview(r.result)};r.readAsText(f)}

let dragId=null,dragP=false;
document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest("[data-card],[data-pcard]");if(!c)return;dragP=!!c.dataset.pcard;dragId=c.dataset.card||c.dataset.pcard;c.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId)}catch(_){}});
document.addEventListener("dragend",()=>{document.querySelectorAll(".dragging,.over").forEach(x=>x.classList.remove("dragging","over"))});
document.addEventListener("dragover",e=>{
  const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.add("over");return}
  const col=e.target.closest&&e.target.closest(dragP?"[data-pdrop]":"[data-drop]");if(!col||!dragId)return;e.preventDefault();document.querySelectorAll(".over").forEach(x=>x!==col&&x.classList.remove("over"));col.classList.add("over")});
document.addEventListener("drop",async e=>{
  const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.remove("over");const f=e.dataTransfer.files[0];if(f)readFile(f);return}
  const col=e.target.closest&&e.target.closest(dragP?"[data-pdrop]":"[data-drop]");if(!col||!dragId)return;e.preventDefault();col.classList.remove("over");
  const id=dragId;dragId=null;
  if(dragP){const p=S.projets.find(x=>x.id===id),k=col.dataset.pdrop;if(!p||p.stage===k)return;const patch={stage:k};if(k==="facture"&&!p.facture)patch.facture=today();if(k==="paye"&&!p.paye)patch.paye=today();await save("projets",p.id,patch);toast((PSTAGES.find(s=>s.k===k)||{}).l)}
  else{const c=S.contacts.find(x=>x.id===id),k=col.dataset.drop;if(!c)return;if(k==="converti"&&board(c)==="pipe")return;if(stage(c)===k&&k!=="relance")return;await runEvent(c,DROP_EVENT[k])}
});

boot();
</script>
