<title>Atelier CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout : rail de navigation à gauche, tableau de bord en blocs arrondis sur une grille de 12 colonnes.
   Couleurs de statut : gris = à contacter, jaune = en cours, vert = signé, rouge = en retard, bleu-gris = dormant. */
:root{
  --bg:#E4E3E0; --block:#F6F5F3; --raised:#FFFFFF; --line:#D9D6D1; --line-soft:#E9E7E3;
  --fg:#1C1917; --muted:#77716B; --faint:#A8A29C;
  --brand:#3B2317; --brand-ink:#F6F1EA; --brand-soft:#5A3B2C; --beige:#D6C6AE;
  --st-todo:#C9C6C1; --st-todo-bg:#EDECEA;
  --st-run:#E2C64F;  --st-run-bg:#F3E8B6; --st-run-pale:#EFE3A6;
  --st-won:#86AE7F;  --st-won-bg:#DAE7D4;
  --st-late:#D45E3D; --st-late-bg:#F4D5CA;
  --st-dorm:#97AEC2; --st-dorm-bg:#DCE4EC;
  --shadow:0 18px 40px -24px rgba(28,25,23,.35);
  --f-display:"Urbanist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ui:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-block:28px; --r-card:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121110; --block:#1C1A19; --raised:#252220; --line:#33302D; --line-soft:#2A2725;
  --fg:#EEEAE5; --muted:#9A938C; --faint:#6B655F;
  --brand:#D9BC9A; --brand-ink:#1E140E; --brand-soft:#2E241D; --beige:#7E6B55;
  --st-todo:#5A5652; --st-todo-bg:#2A2826;
  --st-run:#D9BE4E;  --st-run-bg:#3A3320; --st-run-pale:#5C5230;
  --st-won:#8BB083;  --st-won-bg:#243124;
  --st-late:#E57858; --st-late-bg:#40241B;
  --st-dorm:#93AABD; --st-dorm-bg:#222C35;
  --shadow:0 18px 40px -20px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121110; --block:#1C1A19; --raised:#252220; --line:#33302D; --line-soft:#2A2725;
  --fg:#EEEAE5; --muted:#9A938C; --faint:#6B655F;
  --brand:#D9BC9A; --brand-ink:#1E140E; --brand-soft:#2E241D; --beige:#7E6B55;
  --st-todo:#5A5652; --st-todo-bg:#2A2826;
  --st-run:#D9BE4E;  --st-run-bg:#3A3320; --st-run-pale:#5C5230;
  --st-won:#8BB083;  --st-won-bg:#243124;
  --st-late:#E57858; --st-late-bg:#40241B;
  --st-dorm:#93AABD; --st-dorm-bg:#222C35;
  --shadow:0 18px 40px -20px rgba(0,0,0,.7);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
a{color:inherit}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* ── Statuts (une couleur = une signification) ── */
.s-todo{--st:var(--st-todo);--stbg:var(--st-todo-bg)}
.s-run{--st:var(--st-run);--stbg:var(--st-run-bg)}
.s-won{--st:var(--st-won);--stbg:var(--st-won-bg)}
.s-late{--st:var(--st-late);--stbg:var(--st-late-bg)}
.s-dorm{--st:var(--st-dorm);--stbg:var(--st-dorm-bg)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--st);flex:none;display:inline-block}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;background:var(--stbg);font-size:12px;white-space:nowrap}
.tag .dot{width:7px;height:7px}
.temp{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}
.temp span{display:inline-flex;gap:3px;padding:3px 5px;border:1px solid var(--line);border-radius:999px}
.temp i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.temp i.on{background:var(--brand)}
.temp.dorm i{background:transparent;border:1px solid var(--st-dorm)}
.stars{letter-spacing:.04em;color:var(--brand);font-size:12px}
.stars .off{color:var(--line)}
.late{color:var(--st-late)}

/* ── Structure ── */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:30px;padding:28px 16px 22px max(18px,env(safe-area-inset-left,0px))}
.brand{display:flex;flex-direction:column;gap:2px;padding-left:8px}
.brand b{font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:-.01em}
.brand span{font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:none;text-align:left;padding:10px 14px;border-radius:999px;color:var(--muted);font-size:13.5px}
.nav button:hover{color:var(--fg);background:var(--block)}
.nav button[aria-current="page"]{color:var(--brand-ink);background:var(--brand)}
.nav .count{font-size:11px;min-width:20px;text-align:center;padding:1px 7px;border-radius:10px;background:var(--st-late);color:#fff}
.nav .count:empty{display:none}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-left:4px}
.seg{display:inline-flex;border-radius:999px;padding:3px;background:var(--block);gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:999px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sync{font-size:11px;color:var(--faint);display:flex;align-items:center;gap:6px;padding-left:6px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.sync.on i{background:var(--st-won)}

main{min-width:0;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px),clamp(16px,2.4vw,32px));padding-right:max(16px,env(safe-area-inset-right,0px),clamp(16px,3vw,40px))}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{margin:0;font-family:var(--f-display);font-weight:500;font-size:clamp(32px,4vw,48px);letter-spacing:-.025em;line-height:1}
.head p{margin:8px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raised);padding:9px 16px;border-radius:999px;font-size:13px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:none}
.btn.sm{padding:5px 11px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:default}
.round{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--raised);font-size:16px;text-decoration:none;flex:none}
.round.dark{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* ── Blocs ── */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.block{background:var(--block);border-radius:var(--r-block);padding:22px 24px;min-width:0;display:flex;flex-direction:column;gap:16px;position:relative}
.block.notch{-webkit-mask:radial-gradient(circle 30px at calc(100% - 26px) 26px,transparent 29px,#000 30px);mask:radial-gradient(circle 30px at calc(100% - 26px) 26px,transparent 29px,#000 30px)}
.nwrap{position:relative;display:flex;min-width:0}.nwrap>.block{flex:1}
.notch-btn{position:absolute;top:6px;right:6px;width:42px;height:42px}
.b-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.b-h h2{margin:0;font-family:var(--f-display);font-weight:500;font-size:26px;letter-spacing:-.02em;line-height:1.05}
.b-h p{margin:4px 0 0;color:var(--muted);font-size:12.5px}
.notch .b-h{padding-right:56px}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi{background:var(--block);border-radius:var(--r-block);padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.kpi .v{font-family:var(--f-display);font-weight:400;font-size:44px;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hero{background:var(--brand);color:var(--brand-ink)}
.kpi.hero .label,.kpi.hero .s{color:var(--brand-ink);opacity:.72}
.kpi .top{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* To do */
.todo-list{display:flex;flex-direction:column;gap:8px}
.todo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--raised);border-radius:var(--r-card);padding:12px 14px 12px 12px}
.todo .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--stbg)}
.todo .ic .dot{width:10px;height:10px}
.todo .who{min-width:0;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.todo .who b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo .who small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo .ops{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:18px 4px;color:var(--muted);font-size:13px}
.empty b{color:var(--fg);font-weight:500}

/* Donut */
.donut-wrap{display:flex;flex-direction:column;align-items:center;gap:18px}
.donut{width:min(210px,100%);aspect-ratio:1;max-width:100%}
.donut text{fill:var(--fg);font-family:var(--f-display)}
.donut-leg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;width:100%}
.donut-leg div{display:flex;align-items:center;gap:8px;font-size:12.5px}
.donut-leg b{margin-left:auto;font-family:var(--f-display);font-weight:500;font-size:15px}

/* Température */
.seg-f{display:inline-flex;background:var(--raised);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg-f button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:12.5px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.seg-f button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.seg-f em{font-style:normal;font-size:11px;opacity:.75}
.mini{display:flex;flex-direction:column;gap:6px}
.mini .it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--raised);cursor:pointer;min-width:0}
.mini .it b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.mini .it small{color:var(--muted);font-size:12px;white-space:nowrap}

/* Opportunités */
.opps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.opp{background:var(--raised);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;min-width:0}
.opp:hover{box-shadow:var(--shadow)}
.opp .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.opp .t b{font-family:var(--f-display);font-weight:500;font-size:19px;line-height:1.1;letter-spacing:-.01em}
.opp .budget{font-family:var(--f-display);font-size:24px;letter-spacing:-.02em}
.opp dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;margin:0;font-size:12px}
.opp dt{color:var(--muted)}
.opp dd{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .track{height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.prog .fill{height:100%;background:var(--st-run);border-radius:3px}
.prog .steps{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint)}
.prog .steps .on{color:var(--fg)}

/* Roadmap des prochains contacts */
.days{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(52px,1fr);gap:8px;overflow-x:auto;padding:2px 2px 6px}
.day{border:0;background:var(--raised);border-radius:999px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:96px}
.day b{font-family:var(--f-display);font-weight:500;font-size:22px;line-height:1}
.day small{font-size:11px;color:var(--muted)}
.day .pips{display:flex;gap:3px;margin-top:auto;min-height:8px;flex-wrap:wrap;justify-content:center;max-width:36px}
.day .pips i{width:6px;height:6px;border-radius:50%;background:var(--st)}
.day.today{outline:1.5px solid var(--brand)}
.day[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.day[aria-pressed="true"] small{color:var(--brand-ink);opacity:.75}
.day.we{opacity:.6}
.rail-line{height:1px;background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 9px)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctl select,.toolbar select,.toolbar input,.field input,.field select,.field textarea{background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12.5px;min-width:0}
.field textarea{border-radius:16px}

/* Tables */
.table-wrap{overflow-x:auto;border-radius:var(--r-card);background:var(--raised)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-weight:500;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap;cursor:default;user-select:none}
th[data-sort]{cursor:pointer}
td{padding:11px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
td.wrap{white-space:normal;min-width:180px}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--block)}
tbody tr:last-child td{border-bottom:0}
td .nm{display:flex;align-items:center;gap:8px;font-weight:500}

/* Nouveaux contacts */
.newc{display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap}
.newc .big{font-family:var(--f-display);font-size:72px;line-height:.85;letter-spacing:-.04em}
.minibars{display:flex;gap:8px;align-items:flex-end;height:80px}
.minibars div{display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%}
.minibars i{width:22px;background:var(--st-todo);border-radius:6px 6px 2px 2px;min-height:2px}
.minibars div:last-child i{background:var(--brand)}
.minibars small{font-size:10.5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:200px}
.chips button{border:0;background:var(--raised);border-radius:999px;padding:6px 12px;font-size:12px;display:inline-flex;align-items:center;gap:6px}

/* Pipeline */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input[type="search"]{flex:1 1 200px;max-width:320px}
.board-wrap{overflow-x:auto;margin-inline:-4px;padding:0 4px 12px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:250px;gap:12px;min-height:420px}
.col{display:flex;flex-direction:column;gap:8px;background:var(--block);border-radius:24px;padding:14px 10px;min-width:0}
.col.over{box-shadow:inset 0 0 0 2px var(--brand)}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:0 6px 6px;gap:8px}
.col-h span{font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
.col-h em{font-style:normal;font-size:11.5px;color:var(--muted);background:var(--raised);padding:1px 8px;border-radius:999px}
.card{background:var(--stbg);border-radius:var(--r-card);padding:12px 13px;display:flex;flex-direction:column;gap:7px;cursor:grab}
.card.s-todo{background:var(--raised)}
.card:hover{box-shadow:var(--shadow)}
.card b{font-weight:500;font-size:13.5px;line-height:1.3}
.card small{font-size:11.5px;color:var(--muted)}
.card .line{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.card.dragging{opacity:.4}

/* Dashboard */
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 54px;gap:12px;align-items:center;font-size:12.5px}
.bar .track{height:10px;background:var(--raised);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--st,var(--brand));border-radius:5px}
.bar .n{font-family:var(--f-display);font-size:14px;text-align:right}
.cols{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;height:170px;padding-top:18px}
.cols .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.cols .c div{width:min(40px,70%);background:var(--brand);border-radius:10px 10px 3px 3px;min-height:2px}
.cols .c span{font-size:11px;color:var(--muted)}
.cols-x{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:8px}
.cols-x span{text-align:center;font-size:11px;color:var(--muted)}

/* Tiroir */
.scrim{position:fixed;inset:0;background:rgba(18,16,14,.3);backdrop-filter:blur(3px);z-index:40}
.drawer{position:fixed;top:8px;right:8px;bottom:8px;width:min(580px,calc(100% - 16px));background:var(--block);border-radius:var(--r-block);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);margin-top:env(safe-area-inset-top,0px);margin-bottom:env(safe-area-inset-bottom,0px);margin-right:env(safe-area-inset-right,0px);overflow:hidden}
.drawer-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:24px 24px 14px}
.drawer-h h2{margin:0;font-family:var(--f-display);font-weight:500;font-size:30px;letter-spacing:-.02em;line-height:1.05}
.drawer-h .sub{margin:8px 0 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12.5px}
.drawer-b{flex:1;overflow-y:auto;padding:8px 24px 32px;display:flex;flex-direction:column;gap:20px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field textarea{min-height:72px;resize:vertical}
.starpick{display:flex;gap:2px}
.starpick button{border:0;background:none;font-size:18px;color:var(--line);padding:0 2px}
.starpick button.on{color:var(--brand)}
.next{background:var(--raised);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.next .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.next .top b{font-weight:500}
.tip{font-size:12.5px;color:var(--muted);border-left:2px solid var(--beige);padding-left:10px}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.facts div{background:var(--raised);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.facts b{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist{display:flex;flex-direction:column;border-left:1px solid var(--line);margin-left:4px}
.hist div{position:relative;padding:0 0 12px 16px;font-size:12.5px}
.hist div::before{content:"";position:absolute;left:-4px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--block);border:1px solid var(--muted)}
.hist time{font-size:11px;color:var(--muted);margin-right:8px}

/* Import */

.notice{background:var(--block);border-radius:999px;padding:8px 8px 8px 18px;font-size:12.5px;color:var(--muted);margin-bottom:14px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}

  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

}

  @keyframes slide{from{transform:translateX(30px);opacity:.5}}
}

    </div>

<div id="layer"></div>

<script>
/* ───────── Référentiels ───────── */
const UNIVERS={da:"Direction artistique",graphisme:"Design graphique",hospitalite:"Expérientiel & hospitalité",b2c:"Clients directs"};
const CIBLES={studio:"Studio / agence",client_final:"Client final",apporteur:"Apporteur / partenaire",ancien_client:"Ancien client",tiede:"Prospect tiède"};
const ZONES={fr:"France",eu:"Europe",intl:"US / international"};
const ANGLES={renfort:"Renfort DA / design graphique",p360:"Projet 360",courte:"Mission courte",long:"Mission long terme"};
const CANAUX={email:"Email",instagram:"Instagram",linkedin:"LinkedIn",telephone:"Téléphone",whatsapp:"WhatsApp",rencontre:"Rencontre"};
const OPPS={call:"Call fait",proposition:"Proposition envoyée",timing:"Timing en discussion",validation:"Attente validation interne",dispo:"Dispo à reconfirmer"};
const OPP_STEP={call:1,proposition:2,timing:2,validation:3,dispo:3};
const SERVICES=["Strategy & Concepts","Art Direction","Brand Identity","Graphic Design","Editorial & Publication","Digital & Web Design","Campaigns & Content","Art Buying"];
const STAGES=[
  {k:"a_contacter",l:"À contacter"},{k:"prospection",l:"Prospection · sans réponse"},{k:"reponse",l:"Réponse reçue"},
  {k:"decouverte",l:"Appel découverte"},{k:"r1",l:"Appel R1 · proposition"},{k:"devis",l:"Devis envoyé"},{k:"signe",l:"Signé"},
  {k:"timing",l:"Pas maintenant · timing"},{k:"veille",l:"En pause · sans réponse"},{k:"perdu",l:"Perdu · à réactiver"}
];
const STAGE=Object.fromEntries(STAGES.map(s=>[s.k,s]));
const DORMANT=["timing","veille","perdu"];
const PSTAGES=[{k:"production",l:"En production"},{k:"livre",l:"Livré"},{k:"facture",l:"Facture envoyée"},{k:"paye",l:"Payé"}];
const TIPS={
  froid:"Message court et personnalisé, 2–3 visuels choisis dans leur univers. Une idée par message.",
  tiede:"Partager un projet récent qui leur parle, proposer un café ou un appel de 20 min.",
  chaud:"Suivre la prochaine étape convenue. Récapituler par écrit après chaque appel.",
  dormant:"Revenir avec une vraie raison : une actu, une disponibilité, un projet proche de leur univers.",
  ancien_client:"Prendre des nouvelles, annoncer une disponibilité, montrer un projet récent.",
  apporteur:"Toucher léger : une actu utile, une dispo mise à jour, le portfolio, une intro ou une reco de votre réseau. Créer de la réciprocité."
};

/* ───────── Dates ───────── */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=s?new Date(s+"T12:00"):new Date();d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((new Date(a+"T12:00")-new Date(b+"T12:00"))/864e5);
const MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const JOURS=["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
const fmtD=s=>{if(!s)return"—";const d=new Date(s+"T12:00");return d.getDate()+" "+MOIS[d.getMonth()]};
const rel=s=>{if(!s)return"—";const n=diff(s,today());if(n===0)return"Aujourd'hui";if(n===1)return"Demain";if(n===-1)return"Hier";if(n<0)return"Il y a "+(-n)+" j";if(n<7)return"Dans "+n+" j";return fmtD(s)};
const ago=s=>{if(!s)return"—";const n=diff(today(),s);return n===0?"Aujourd'hui":n===1?"Hier":"Il y a "+n+" j"};
const eur=n=>new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n||0);
const monday=()=>{const d=new Date();const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return iso(d)};

/* ───────── Logique métier ───────── */
const stage=c=>c.stage||"a_contacter";
function temperature(c){
  const s=stage(c);
  if(s==="signe")return"client";
  if(DORMANT.includes(s))return"dormant";
  if(["decouverte","r1","devis"].includes(s)||c.opp)return"chaud";
  if(s==="reponse"||c.cible==="tiede"||c.cible==="ancien_client")return"tiede";
  return"froid";
}
const TEMP_L={froid:"Froid",tiede:"Tiède",chaud:"Chaud",dormant:"Dormant",client:"Client"};
function isLate(c){return c.next&&c.next.date&&c.next.date<today()&&stage(c)!=="signe"}
/* une couleur = une signification */
function status(c){
  if(isLate(c))return"late";
  const s=stage(c);
  if(s==="signe")return"won";
  if(DORMANT.includes(s))return"dorm";
  if(s==="a_contacter")return"todo";
  return"run";
}
const STATUS_L={todo:"À contacter",run:"En cours",won:"Signé",late:"En retard",dorm:"Dormant"};
function pipeGroup(c){const s=stage(c);if(s==="a_contacter")return"todo";if(s==="prospection")return"contacte";if(s==="signe")return"won";if(DORMANT.includes(s))return"dorm";return"discussion"}
const oppOf=c=>c.opp||({decouverte:"call",r1:"call",devis:"proposition"})[stage(c)]||"";
const isOpp=c=>!!oppOf(c)&&!["signe","perdu"].includes(stage(c));
function lastContact(c){const h=(c.hist||[]).find(x=>!/^Fiche créée/.test(x.t));return h?h.d:""}
function lastContactText(c){const h=(c.hist||[]).find(x=>!/^Fiche créée/.test(x.t));return h?h.t:""}
function priorite(c){
  const m={froid:1,tiede:2,chaud:3,dormant:.5,client:0}[temperature(c)];
  let s=m*2+(c.potentiel||0)*1.5;
  if(isLate(c))s+=Math.min(3,-diff(c.next.date,today())/3)+1;
  return s;
}
function tipFor(c){
  if(c.cible==="apporteur")return TIPS.apporteur;
  if(c.cible==="ancien_client")return TIPS.ancien_client;
  const t=temperature(c);return TIPS[t==="client"?"chaud":t];
}
function zoneHint(c){
  if(c.zone==="intl")return"Fuseau US : envoyer entre 15h et 18h, heure de Paris.";
  if(c.zone==="eu")return"Europe : même créneau qu'en France, éviter le lundi matin.";
  return"";
}
function todoKind(c){
  const s=stage(c);
  if(s==="a_contacter")return"Message à envoyer";
  if(s==="prospection")return"Relance";
  if(s==="reponse")return"Suivi de réponse";
  if(s==="decouverte"||s==="r1")return"Suivi post-call";
  if(s==="devis")return"Proposition en attente";
  if(DORMANT.includes(s))return"Réactivation";
  return"Suivi";
}
function prochaineRelance(c,n,from){
  const t=c.cible;
  if(t==="apporteur")return{date:addDays(from,35),label:"Toucher léger (4–6 semaines)"};
  if(t==="ancien_client")return{date:addDays(from,45),label:"Prendre des nouvelles (1×/mois à 1×/2 mois)"};
  if(t==="tiede")return{date:addDays(from,30),label:"Relance tiède (3–6 semaines)"};
  if(n===1)return{date:addDays(from,8),label:"Relance 2 (J+7/10)"};
  if(n===2)return{date:addDays(from,16),label:"Relance 3 (J+21/30)"};
  return null;
}
function appliquer(c,ev,opts={}){
  const t=today(),h=(c.hist||[]).slice();
  const p={};const log=txt=>h.unshift({d:t,t:txt});
  switch(ev){
    case"envoye":{
      const n=(c.relances||0)+1;p.relances=n;log(n===1?"Premier message envoyé":"Relance "+n+" envoyée");
      const nx=prochaineRelance(c,n,t);
      if(nx){p.stage=["reponse","decouverte","r1","devis"].includes(stage(c))?stage(c):"prospection";p.next=nx;}
      else{p.stage="veille";p.next={date:addDays(t,75),label:"Réactiver après la pause (2–3 mois)"};log("Pas de réponse après 3 messages · mise en pause");}
      break}
    case"reponse":p.stage="reponse";p.next={date:addDays(t,5),label:"Proposer un appel découverte"};log("Réponse reçue");break;
    case"decouverte":p.stage="decouverte";p.opp="call";p.next={date:opts.date||addDays(t,7),label:"Caler l'appel R1 · proposition"};log("Appel découverte");break;
    case"r1":p.stage="r1";p.opp="call";p.next={date:opts.date||addDays(t,5),label:"Envoyer la proposition / le devis"};log("Appel R1 · proposition commerciale");break;
    case"devis":p.stage="devis";p.opp="proposition";p.next={date:addDays(t,7),label:"Relancer la proposition"};log("Devis envoyé"+(c.montant?" · "+eur(c.montant):""));break;
    case"signe":p.stage="signe";p.opp="";p.next=null;log("Devis accepté · projet signé");break;
    case"timing":p.stage="timing";p.opp="";p.next={date:addDays(t,42),label:"Reprendre contact (timing annoncé)"};log("Pas maintenant · timing à revoir");break;
    case"perdu":p.stage="perdu";p.opp="";p.next={date:addDays(t,90),label:"Réactiver ?"};log("Perdu · à réactiver plus tard");break;
    case"veille":p.stage="veille";p.next={date:addDays(t,75),label:"Réactiver après la pause"};log("Mis en pause");break;
    case"a_contacter":p.stage="a_contacter";p.next={date:t,label:"Envoyer le premier message"};break;
  }
  p.hist=h.slice(0,60);p.maj=t;
  return p;
}
const STAGE_EVENT={a_contacter:"a_contacter",prospection:"envoye",reponse:"reponse",decouverte:"decouverte",r1:"r1",devis:"devis",signe:"signe",timing:"timing",veille:"veille",perdu:"perdu"};
function actionPrincipale(c){
  const s=stage(c);
  if(s==="a_contacter")return{ev:"envoye",l:"Message envoyé"};
  if(s==="prospection"||DORMANT.includes(s)||c.cible==="apporteur"||c.cible==="ancien_client")return{ev:"envoye",l:"Relance faite"};
  return null;
}
function gcal(c){
  if(!c.next||!c.next.date)return"";
  const d=c.next.date.replace(/-/g,""),e=addDays(c.next.date,1).replace(/-/g,"");
  const txt=(c.next.label||"Relance")+" · "+(c.studio||c.nom||"");
  const det=[c.nom,c.email,CANAUX[c.canal]?"Canal : "+CANAUX[c.canal]:"",tipFor(c),zoneHint(c)].filter(Boolean).join("\n");
  return"https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(txt)+"&dates="+d+"/"+e+"&details="+encodeURIComponent(det);
}

/* ───────── État & stockage ───────── */
const S={contacts:[],projets:[],view:"today",filters:{q:"",univers:"",cible:"",zone:"",temp:""},sort:{k:"prio",dir:-1},
  home:{temp:"chaud",horizon:14,day:"",since:0},ready:false,db:null,open:null,openP:null};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
function setSync(on,txt){const s=document.getElementById("sync");s.classList.toggle("on",on);s.querySelector("span").textContent=txt}
async function save(col,id,patch,full){
  if(!S.db){toast("Enregistrement impossible : la base n'est pas joignable.");return false}
  const go=()=>{const ref=S.db.collection(col).doc(id);return full?ref.set(patch):ref.update(patch)};
  try{await go();return true}
  catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*600));try{await go();return true}catch(_){}}
    toast(e&&e.code==="quota_exceeded"?"La base est pleine : supprimez d'anciennes fiches.":"Échec de l'enregistrement. Réessayez dans un instant.");return false}
}
async function del(col,id){if(!S.db)return;try{await S.db.collection(col).doc(id).delete()}catch(e){toast("Suppression impossible pour le moment.")}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

async function boot(){
  render();
  const db=await claude.use("db").catch(()=>null);
  if(!db){setSync(false,"Hors ligne");S.ready=true;render();return}
  S.db=db;
  let got=0;const timer=setTimeout(()=>{if(got<3)setSync(false,"Lent à répondre…")},10000);
  const sub=name=>db.collection(name).onSnapshot(snap=>{
    S[name]=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!snap.metadata.fromCache){got|=name==="contacts"?1:2;if(got===3){clearTimeout(timer);setSync(true,"Synchronisé")}}
    S.ready=true;render();
  },()=>{clearTimeout(timer);setSync(false,"Connexion perdue");S.ready=true;render()});
  sub("contacts");sub("projets");
}

/* ───────── Navigation & thème ───────── */
const VIEWS=[["today","Accueil"],["pipeline","Prospection"],["contacts","Contacts"],["projets","Projets"],["dash","Chiffres"],["import","Importer"]];
function renderNav(){
  const due=S.contacts.filter(c=>c.next&&c.next.date&&c.next.date<=today()&&stage(c)!=="signe").length;
  document.getElementById("nav").innerHTML=VIEWS.map(([k,l])=>`<button data-v="${k}" ${S.view===k?'aria-current="page"':""}>${l}<span class="count">${k==="today"&&due?due:""}</span></button>`).join("");
}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-v]");if(!b)return;S.view=b.dataset.v;location.hash=S.view;render();window.scrollTo(0,0)});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h)&&h!==S.view){S.view=h;render()}});
{const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h))S.view=h;}
function applyTheme(t){const r=document.documentElement;if(t==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t);document.querySelectorAll("#theme button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===t))}
document.getElementById("theme").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;store.set("crm-theme",b.dataset.t);applyTheme(b.dataset.t)});
applyTheme(store.get("crm-theme")||"auto");

/* ───────── Petits composants ───────── */
const tag=c=>{const s=status(c);return`<span class="tag s-${s}"><span class="dot"></span>${STATUS_L[s]}</span>`};
const tagK=k=>`<span class="tag s-${k}"><span class="dot"></span>${STATUS_L[k]}</span>`;
function temp(c){const t=temperature(c);const n={froid:1,tiede:2,chaud:3,client:3,dormant:0}[t];
  return`<span class="temp ${t==="dormant"?"dorm":""}"><span>${[1,2,3].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>${TEMP_L[t]}</span>`}
const stars=n=>`<span class="stars" aria-label="${n||0} sur 3">${"✦".repeat(n||0)}<span class="off">${"✦".repeat(3-(n||0))}</span></span>`;
const opt=(obj,v,empty)=>(empty!==undefined?`<option value="">${empty}</option>`:"")+Object.entries(obj).map(([k,l])=>`<option value="${k}" ${v===k?"selected":""}>${esc(l)}</option>`).join("");
const head=(t,sub,acts="")=>`<div class="head"><div><h1>${t}</h1>${sub?`<p>${sub}</p>`:""}</div><div class="actions">${acts}</div></div>`;
const legend=()=>`<div class="legend">${["todo","run","won","late","dorm"].map(k=>`<span class="s-${k}"><i class="dot"></i>${STATUS_L[k]}</span>`).join("")}</div>`;
function examplesNotice(){
  const n=S.contacts.filter(c=>c.exemple).length+S.projets.filter(p=>p.exemple).length;
  return n?`<div class="notice"><span>Les fiches « exemple » sont fictives et servent de démonstration.</span><button class="btn sm" data-act="clear-ex">Supprimer les ${n} exemples</button></div>`:"";
}

/* ───────── ACCUEIL ───────── */
function vToday(){
  const t=today(),wkEnd=addDays(t,6),mon=monday();
  const active=S.contacts.filter(c=>stage(c)!=="signe");
  const relancesSemaine=active.filter(c=>c.next&&c.next.date&&c.next.date<=wkEnd);
  const lateN=relancesSemaine.filter(isLate).length;
  const opps=S.contacts.filter(isOpp).sort((a,b)=>(+b.montant||0)-(+a.montant||0)||priorite(b)-priorite(a));
  const oppSum=opps.reduce((s,c)=>s+(+c.montant||0),0);
  const clients=S.projets.filter(p=>p.stage!=="paye");
  const dorm=S.contacts.filter(c=>DORMANT.includes(stage(c)));
  const dormSoon=dorm.filter(c=>c.next&&c.next.date&&c.next.date<=addDays(t,14)).length;
  let sent=0;S.contacts.forEach(c=>(c.hist||[]).forEach(h=>{if(h.d>=mon&&/envoy/i.test(h.t)&&!/devis/i.test(h.t))sent++}));
  const d=new Date();const jour=d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});

  const kpis=`<div class="kpis">
    <div class="kpi hero"><div class="top"><span class="label">Relances de la semaine</span></div><span class="v">${relancesSemaine.length}</span><span class="s">${lateN?lateN+" en retard":"Rien en retard"}</span></div>
    <div class="kpi"><span class="label">Opportunités actives</span><span class="v">${opps.length}</span><span class="s">${oppSum?eur(oppSum)+" potentiels":"Budget à préciser"}</span></div>
    <div class="kpi"><span class="label">Clients en cours</span><span class="v">${clients.length}</span><span class="s">Projets signés non soldés</span></div>
    <div class="kpi"><span class="label">Dormants à réactiver</span><span class="v">${dorm.length}</span><span class="s">${dormSoon} à réactiver sous 15 j</span></div>
    <div class="kpi"><span class="label">Messages envoyés</span><span class="v">${sent}</span><span class="s">Depuis lundi</span></div>
  </div>`;

  if(!S.ready)return head("Bonjour",cap(jour))+kpis+`<div class="block"><div class="empty">Chargement de vos contacts…</div></div>`;
  if(!S.contacts.length)return head("Bonjour",cap(jour),`<button class="btn primary" data-act="new">Nouveau contact</button>`)+kpis+`<div class="block"><div class="empty"><b>Votre CRM est vide.</b> Importez votre Google Sheet depuis l'onglet « Importer », ou créez votre premier contact.</div></div>`;

  return head("Bonjour",cap(jour),`<button class="btn primary" data-act="new">+ Nouveau contact</button>`)
   +examplesNotice()+kpis
   +`<div class="grid">${blocTodo()}${blocDonut()}${blocOpps(opps,oppSum)}${blocTemp()}${blocPlan()}${blocNew()}</div>`;
}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* Bloc 1 : To do aujourd'hui */
function blocTodo(){
  const t=today();
  const list=S.contacts.filter(c=>stage(c)!=="signe"&&c.next&&c.next.date&&c.next.date<=t).sort((a,b)=>priorite(b)-priorite(a));
  const late=list.filter(isLate).length;
  return`<div class="span-8 nwrap"><section class="block notch">
    <div class="b-h"><div><h2>To do, aujourd'hui</h2><p>${list.length} action(s)${late?` · <span class="late">${late} en retard</span>`:""} · triées par priorité</p></div></div>
    <div class="todo-list">${list.length?list.slice(0,8).map(todoRow).join(""):`<div class="empty">Tout est à jour pour aujourd'hui.</div>`}
    ${list.length>8?`<button class="btn sm ghost" data-goto="contacts">Voir les ${list.length-8} autres</button>`:""}</div>

/* Donut du pipe */
function blocDonut(){
  const groups=[["todo","À contacter","var(--st-todo)"],["contacte","Contacté","var(--st-run-pale)"],["discussion","En discussion","var(--st-run)"],["won","Signé","var(--st-won)"],["dorm","Dormant","var(--st-dorm)"]];
  const counts=Object.fromEntries(groups.map(g=>[g[0],0]));S.contacts.forEach(c=>counts[pipeGroup(c)]++);
  const total=S.contacts.length||1;const R=70,C=2*Math.PI*R;let off=0;
  const arcs=groups.map(([k,,col])=>{const len=counts[k]/total*C;const gap=counts[k]&&len>4?2:0;
    const a=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${col}" stroke-width="26" stroke-dasharray="${Math.max(0,len-gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;off+=len;return a}).join("");
  return`<section class="block span-4"><div class="b-h"><div><h2>Le pipe</h2><p>Où en sont vos ${S.contacts.length} contacts</p></div></div>
    <div class="donut-wrap"><svg class="donut" viewBox="0 0 200 200" role="img" aria-label="Répartition du pipe">
      <circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--line-soft)" stroke-width="26"/>${arcs}
      <text x="100" y="104" text-anchor="middle" font-size="40" font-weight="500">${S.contacts.length}</text>
      <text x="100" y="126" text-anchor="middle" font-size="11" fill="var(--muted)" style="fill:var(--muted)">contacts</text></svg>
    <div class="donut-leg">${groups.map(([k,l,col])=>`<div><i class="dot" style="background:${col}"></i>${l}<b>${counts[k]}</b></div>`).join("")}</div></div>

}

function parseTable(txt){
  txt=txt.replace(/^﻿/,"");const first=txt.split(/\r?\n/)[0]||"";
  const sep=first.includes("\t")?"\t":(first.split(";").length>first.split(",").length?";":",");
  const rows=[];let cur=[""],q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur[cur.length-1]+='"';i++}else q=false}else cur[cur.length-1]+=ch}
    else if(ch==='"')q=true;else if(ch===sep)cur.push("");else if(ch==="\n"){rows.push(cur);cur=[""]}else if(ch!=="\r")cur[cur.length-1]+=ch}
  rows.push(cur);return rows.filter(r=>r.some(c=>c.trim()));
}
const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
function parseDate(s){s=(s||"").trim();if(!s)return"";let m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if(m){let y=+m[3];if(y<100)y+=2000;return y+"-"+pad(+m[2])+"-"+pad(+m[1])}m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:""}
const EU=["royaume","uk","london","londres","allemagne","germany","berlin","italie","italy","milan","espagne","spain","madrid","barcelon","belgique","belgium","bruxelles","suisse","switzerland","geneve","zurich","pays-bas","netherlands","amsterdam","portugal","lisbonne","danemark","copenhag","suede","stockholm","autriche","vienne","irlande","dublin","europe"];
const FR=["france","paris","lyon","marseille","bordeaux","lille","nantes","toulouse","nice","rennes","strasbourg","montpellier"];
function guessZone(loc){const l=norm(loc);if(!l)return"";if(FR.some(w=>l.includes(w)))return"fr";if(EU.some(w=>l.includes(w)))return"eu";return"intl"}
function guessUnivers(s,def){const l=norm(s);if(/graph/.test(l))return"graphisme";if(/hosp|hotel|restau|experien|event/.test(l))return"hospitalite";if(/\bda\b|direction|artist|campagn/.test(l))return"da";if(/b2c|particulier|direct/.test(l))return"b2c";return def}
function buildImport(txt){
  const rows=parseTable(txt);if(rows.length<2)return null;
  const h=rows[0].map(norm);
  const find=(...keys)=>h.findIndex(x=>keys.some(k=>x.includes(k)));
  const ix={loc:find("locali","ville","pays","lieu"),studio:find("studio","client","nom","agence","entreprise"),dom:find("domaine","activite","secteur"),stat:find("statut","status","etat"),mail:find("mail"),note:find("note","info","reco")};
  const dateCols=h.map((x,i)=>/date|mail \d|relance/.test(x)&&i!==ix.mail?i:-1).filter(i=>i>=0);
  const contactIx=h.findIndex((x,i)=>i!==ix.studio&&/(contact|prenom|personne|interlocut)/.test(x));
  const defU=document.getElementById("i-univers").value,defC=document.getElementById("i-cible").value,defZ=document.getElementById("i-zone").value,defK=document.getElementById("i-canal").value;
  const out=rows.slice(1).map(r=>{
    const g=i=>i>=0?(r[i]||"").trim():"";
    const dates=dateCols.map(i=>parseDate(r[i])).filter(Boolean).sort();
    const st=norm(g(ix.stat));
    const c={id:uid(),studio:g(ix.studio),nom:contactIx>=0?g(contactIx):"",email:g(ix.mail),localisation:g(ix.loc),notes:g(ix.note),canal:defK,
      univers:guessUnivers(g(ix.dom),defU),cible:defC,zone:defZ==="auto"?(guessZone(g(ix.loc))||"fr"):defZ,potentiel:0,angle:"",relances:dates.length,hist:[],cree:today()};
    if(/reco/.test(norm(c.notes)))c.potentiel=2;
    dates.forEach((d,i)=>c.hist.unshift({d,t:i===0?"Premier message envoyé":"Relance "+(i+1)+" envoyée"}));
    const last=dates[dates.length-1];
    if(/repon|repondu/.test(st)){c.stage="reponse";c.next={date:today(),label:"Proposer un appel découverte"}}
    else if(!dates.length&&!/envoy|relanc/.test(st)){c.stage="a_contacter";c.next={date:today(),label:"Envoyer le premier message"};c.relances=0}
    else{const n=Math.max(1,dates.length);c.relances=n;const nx=prochaineRelance(c,n,last||today());
      if(/a relancer/.test(st)){c.stage="prospection";c.next={date:today(),label:"Relance "+(n+1)}}
      else if(nx){c.stage="prospection";c.next=nx}else{c.stage="veille";c.next={date:addDays(last||today(),75),label:"Réactiver après la pause (2–3 mois)"}}}
    return c;
  }).filter(c=>c.studio||c.email);
  return{cols:ix,dateCols:dateCols.length,list:out};
}
const isDupe=c=>S.contacts.some(x=>(c.email&&x.email&&x.email.toLowerCase()===c.email.toLowerCase())||(x.studio&&c.studio&&norm(x.studio)===norm(c.studio)));
function showPreview(txt){
  const box=document.getElementById("i-preview");IMP=buildImport(txt);
  if(!IMP||!IMP.list.length){box.innerHTML=`<div class="notice">Aucune ligne exploitable. Vérifiez que la première ligne contient les titres (Nom du studio, Mail…).</div>`;return}
  const known=Object.entries({studio:"Nom du studio",loc:"Localisation",dom:"Domaine",stat:"Statut",mail:"Mail",note:"Notes"}).map(([k,l])=>`<span class="tag ${IMP.cols[k]>=0?"s-won":"s-late"}"><span class="dot"></span>${l}</span>`).join(" ");
  const dupes=IMP.list.filter(isDupe).length;
  box.innerHTML=`<div class="block"><div class="b-h"><div><h2>${IMP.list.length} contacts prêts</h2><p>${IMP.dateCols} colonne(s) de dates reconnue(s)${dupes?` · ${dupes} déjà présents, ignorés`:""}</p></div></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap">${known}</div>
   <div class="table-wrap" style="max-height:340px;overflow:auto"><table><thead><tr><th>Studio</th><th>Univers</th><th>Zone</th><th>Statut</th><th>Prochaine action</th></tr></thead><tbody>
   ${IMP.list.slice(0,40).map(c=>`<tr><td><span class="nm"><i class="dot s-${status(c)}"></i>${esc(c.studio)}</span></td><td>${UNIVERS[c.univers]}</td><td>${ZONES[c.zone]||""}</td><td>${STAGE[c.stage].l}${c.relances?" · P"+c.relances:""}</td><td>${rel(c.next.date)} · ${esc(c.next.label)}</td></tr>`).join("")}
   </tbody></table></div>
   <div class="actions"><button class="btn primary" data-act="do-import" ${S.db?"":"disabled"}>Importer ${IMP.list.length-dupes} contacts</button><button class="btn ghost" data-act="cancel-import">Annuler</button></div></div>`;
}
async function doImport(){
  if(!IMP)return;const btn=document.querySelector('[data-act="do-import"]');
  const todo=IMP.list.filter(c=>!isDupe(c));
  let n=0;for(const c of todo){const{id,...body}=c;if(await save("contacts",id,body,true))n++;if(btn)btn.textContent="Import… "+n+"/"+todo.length}
  IMP=null;toast(n+" contacts importés");S.view="pipeline";render();
}

/* ───────── Rendu ───────── */
function render(){
  renderNav();
  const V={today:vToday,pipeline:vPipeline,contacts:vContacts,projets:vProjets,dash:vDash,import:vImport}[S.view]||vToday;
  const keep=S.view==="import"&&document.getElementById("i-paste");
  if(!keep)document.getElementById("main").innerHTML=V();
  renderLayer();
}
function renderLayer(){
  const L=document.getElementById("layer");
  if(S.open){const c=S.open==="new"?S.draft:S.contacts.find(x=>x.id===S.open);
    if(!c){S.open=null;L.innerHTML="";L.dataset.k="";return}
    const k=S.open+":"+(c.maj||"")+":"+(c.hist||[]).length+":"+c.stage+":"+(c.opp||"");
    if(L.dataset.k!==k){L.innerHTML=drawerContact(c,S.open==="new");L.dataset.k=k}
    return}
  if(S.openP){const p=S.openP==="new"?S.draftP:S.projets.find(x=>x.id===S.openP);if(!p){S.openP=null;L.innerHTML="";L.dataset.k="";return}
    if(L.dataset.k!=="p"+S.openP){L.innerHTML=drawerProjet(p,S.openP==="new");L.dataset.k="p"+S.openP}return}
  L.innerHTML="";L.dataset.k="";
}
const closeLayer=()=>{S.open=null;S.openP=null;renderLayer()};

/* ───────── Interactions ───────── */
document.addEventListener("click",async e=>{
  const t=e.target;
  if(t.closest("[data-close]")){closeLayer();return}
  const star=t.closest("[data-star]");if(star){const n=+star.dataset.star,cur=document.querySelectorAll("#c-pot .on").length;const v=cur===n?n-1:n;document.querySelectorAll("#c-pot button").forEach((b,i)=>b.classList.toggle("on",i<v));return}
  const svc=t.closest("[data-svc]");if(svc){svc.classList.toggle("primary");return}
  const tp=t.closest("[data-temp]");if(tp){S.home.temp=tp.dataset.temp;render();return}
  const hz=t.closest("[data-horizon]");if(hz){S.home.horizon=+hz.dataset.horizon;S.home.day="";render();return}
  const dy=t.closest("[data-day]");if(dy){S.home.day=S.home.day===dy.dataset.day?"":dy.dataset.day;render();return}
  const gt=t.closest("[data-goto]");if(gt){S.view=gt.dataset.goto;location.hash=S.view;render();window.scrollTo(0,0);return}
  const gtt=t.closest("[data-goto-temp]");if(gtt){S.filters.temp=gtt.dataset.gotoTemp;S.view="contacts";location.hash=S.view;render();window.scrollTo(0,0);return}
  const ev=t.closest("[data-ev]");if(ev){const c=S.contacts.find(x=>x.id===ev.dataset.id);if(c)await runEvent(c,ev.dataset.ev);return}
  const sn=t.closest("[data-snooze]");if(sn){const c=S.contacts.find(x=>x.id===sn.dataset.snooze);if(c&&c.next){await save("contacts",c.id,{next:{...c.next,date:addDays(c.next.date<today()?today():c.next.date,3)}});toast("Reporté de 3 jours")}return}
  const op=t.closest("[data-open]");if(op&&!t.closest("a,button:not([data-open])")){S.open=op.dataset.open;S.openP=null;renderLayer();return}
  const opp=t.closest("[data-openp]");if(opp){S.openP=opp.dataset.openp;S.open=null;renderLayer();return}
  const so=t.closest("[data-sort]");if(so){const k=so.dataset.sort;S.sort=S.sort.k===k?{k,dir:-S.sort.dir}:{k,dir:k==="studio"||k==="next"?1:-1};render();return}
  const a=t.closest("[data-act]");if(!a)return;
  switch(a.dataset.act){
    case"new":S.draft={univers:"da",cible:"studio",zone:"fr",canal:"email",potentiel:0};S.open="new";renderLayer();break;
    case"newp":S.draftP={stage:"production",univers:"da",services:[]};S.openP="new";renderLayer();break;
    case"save-c":await saveContact();break;
    case"del-c":if(a.dataset.sure){await del("contacts",S.open);closeLayer();toast("Fiche supprimée")}else{a.dataset.sure=1;a.textContent="Confirmer la suppression"}break;
    case"save-p":await saveProjet();break;
    case"del-p":if(a.dataset.sure){await del("projets",S.openP);closeLayer();toast("Projet supprimé")}else{a.dataset.sure=1;a.textContent="Confirmer la suppression"}break;
    case"do-import":a.disabled=true;await doImport();break;
    case"cancel-import":IMP=null;document.getElementById("i-preview").innerHTML="";document.getElementById("i-paste").value="";break;
    case"clear-ex":if(a.dataset.sure){a.disabled=true;for(const c of S.contacts.filter(x=>x.exemple))await del("contacts",c.id);for(const p of S.projets.filter(x=>x.exemple))await del("projets",p.id);toast("Exemples supprimés")}else{a.dataset.sure=1;a.textContent="Confirmer : supprimer les exemples"}break;
  }
});
async function runEvent(c,ev){
  const p=appliquer(c,ev);
  if(await save("contacts",c.id,p)){
    if(ev==="signe"){const id=uid();await save("projets",id,{titre:"Projet "+(c.studio||c.nom||""),client:c.studio||c.nom||"",contactId:c.id,univers:c.univers||"da",montant:+c.montant||0,stage:"production",services:[],cree:today(),exemple:!!c.exemple},true);toast("Bravo ! Le projet est créé dans « Projets ».")}
    else toast(p.next?"Prochain contact : "+rel(p.next.date).toLowerCase():"Enregistré");
  }
}
function readContactForm(){
  const v=id=>(document.getElementById(id)||{}).value??"";
  return{studio:v("c-studio").trim(),nom:v("c-nom").trim(),email:v("c-email").trim(),localisation:v("c-localisation").trim(),univers:v("c-univers"),cible:v("c-cible"),zone:v("c-zone"),angle:v("c-angle"),
    canal:v("c-canal"),opp:v("c-opp"),besoin:v("c-besoin").trim(),potentiel:document.querySelectorAll("#c-pot .on").length,montant:+v("c-montant")||0,notes:v("c-notes")};

async function saveContact(){

    if(await save("contacts",id,body,true)){toast("Contact créé");S.open=id;document.getElementById("layer").dataset.k=""}}

    if(await save("contacts",S.open,patch)){toast("Enregistré");closeLayer()}}
}
async function saveProjet(){
  const v=id=>(document.getElementById(id)||{}).value??"";
  const body={titre:v("p-titre").trim(),client:v("p-client").trim(),univers:v("p-univers"),montant:+v("p-montant")||0,stage:v("p-stage"),facture:v("p-facture"),paye:v("p-paye"),notes:v("p-notes"),
    services:[...document.querySelectorAll("#p-services .primary")].map(b=>b.dataset.svc)};

  if(await save("projets",id,isNew?{...body,cree:today()}:body,isNew)){toast(isNew?"Projet créé":"Enregistré");closeLayer()}
}

});

/* Glisser-déposer */
let dragId=null,dragP=false;
document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest("[data-card],[data-pcard]");if(!c)return;dragP=!!c.dataset.pcard;dragId=c.dataset.card||c.dataset.pcard;c.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId)}catch(_){}});
document.addEventListener("dragend",()=>{document.querySelectorAll(".dragging,.over").forEach(x=>x.classList.remove("dragging","over"))});
document.addEventListener("dragover",e=>{
  const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.add("over");return}
  const col=e.target.closest&&e.target.closest(dragP?"[data-pdrop]":"[data-drop]");if(!col||!dragId)return;e.preventDefault();document.querySelectorAll(".over").forEach(x=>x!==col&&x.classList.remove("over"));col.classList.add("over")});
document.addEventListener("drop",async e=>{
  const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.remove("over");const f=e.dataTransfer.files[0];if(f)readFile(f);return}
  const col=e.target.closest&&e.target.closest(dragP?"[data-pdrop]":"[data-drop]");if(!col||!dragId)return;e.preventDefault();col.classList.remove("over");
  const id=dragId;dragId=null;
  if(dragP){const p=S.projets.find(x=>x.id===id),k=col.dataset.pdrop;if(!p||p.stage===k)return;const patch={stage:k};if(k==="facture"&&!p.facture)patch.facture=today();if(k==="paye"&&!p.paye)patch.paye=today();await save("projets",p.id,patch);toast((PSTAGES.find(s=>s.k===k)||{}).l)}
  else{const c=S.contacts.find(x=>x.id===id),k=col.dataset.drop;if(!c||stage(c)===k)return;await runEvent(c,STAGE_EVENT[k])}
});

boot();
</script>
