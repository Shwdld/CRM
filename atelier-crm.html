<title>Atelier CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout : rail de navigation à gauche, blocs arrondis sur une grille de 12 colonnes, deux kanbans (Prospection, Pipeline).
   Chaque étape a sa couleur ; les cartes prospect sont des cartes anthracite à coin découpé. */
:root{
  --bg:#E4E3E0; --block:#F6F5F3; --raised:#FFFFFF; --line:#D9D6D1; --line-soft:#E9E7E3;
  --fg:#1C1917; --muted:#77716B; --faint:#A8A29C;
  --brand:#3B2317; --brand-ink:#F6F1EA; --beige:#D6C6AE;
  --c-todo:#CFCCC7; --c-contact:#8FB0D3; --c-relance:#E8995A; --c-sommeil:#6F6A65; --c-react:#A58FD0; --c-conv:#86AE7F;
  --c-rep:#8FB0D3; --c-qualif:#E2C64F; --c-call:#E8995A; --c-attente:#E7A3B5; --c-nego:#D97A6C; --c-signe:#86AE7F; --c-perdu:#AAA49E;
  --late:#D0583A;
  --card:#3A3836; --card-fg:#F3F1EE; --card-muted:#ADA79F; --card-pill:#4B4946; --card-off:#56534F; --card-line:#5E5B57;
  --i1:#EE9AA0; --i2:#F1A96B; --i3:#F3D56C; --i4:#C9DD7E; --i5:#9CCB8A;
  --shadow:0 18px 40px -24px rgba(28,25,23,.4);
  --f-title:"Instrument Serif",ui-serif,Georgia,"Times New Roman",serif;
  --f-ui:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-block:28px; --r-card:26px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121110; --block:#1C1A19; --raised:#252220; --line:#33302D; --line-soft:#2A2725;
  --fg:#EEEAE5; --muted:#9A938C; --faint:#6B655F;
  --brand:#D9BC9A; --brand-ink:#1E140E; --beige:#7E6B55;
  --c-todo:#5E5A56; --c-contact:#7FA2C6; --c-relance:#E0925A; --c-sommeil:#8A847E; --c-react:#A893D6; --c-conv:#8BB083;
  --c-rep:#7FA2C6; --c-qualif:#D9BE4E; --c-call:#E0925A; --c-attente:#DE9AAD; --c-nego:#D9786A; --c-signe:#8BB083; --c-perdu:#77716B;
  --late:#E57858;
  --card:#2C2A28; --card-fg:#F1EEEA; --card-muted:#A39D96; --card-pill:#3B3936; --card-off:#4A4744; --card-line:#4E4B48;
  --shadow:0 18px 40px -20px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121110; --block:#1C1A19; --raised:#252220; --line:#33302D; --line-soft:#2A2725;
  --fg:#EEEAE5; --muted:#9A938C; --faint:#6B655F;
  --brand:#D9BC9A; --brand-ink:#1E140E; --beige:#7E6B55;
  --c-todo:#5E5A56; --c-contact:#7FA2C6; --c-relance:#E0925A; --c-sommeil:#8A847E; --c-react:#A893D6; --c-conv:#8BB083;
  --c-rep:#7FA2C6; --c-qualif:#D9BE4E; --c-call:#E0925A; --c-attente:#DE9AAD; --c-nego:#D9786A; --c-signe:#8BB083; --c-perdu:#77716B;
  --late:#E57858;
  --card:#2C2A28; --card-fg:#F1EEEA; --card-muted:#A39D96; --card-pill:#3B3936; --card-off:#4A4744; --card-line:#4E4B48;
  --shadow:0 18px 40px -20px rgba(0,0,0,.7);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
a{color:inherit}
.serif{font-family:var(--f-title);font-weight:400}
.label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.late{color:var(--late)}

.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--faint));flex:none;display:inline-block}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 24%,var(--raised));font-size:12px;white-space:nowrap;color:var(--fg)}
.tag .dot{width:7px;height:7px}
.temp{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}
.temp span{display:inline-flex;gap:3px;padding:3px 5px;border:1px solid var(--line);border-radius:999px}
.temp i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.temp i.on{background:var(--brand)}

.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:30px;padding:28px 16px 22px max(18px,env(safe-area-inset-left,0px))}
.brand{display:flex;flex-direction:column;gap:2px;padding-left:8px}
.brand b{font-family:var(--f-title);font-weight:400;font-size:30px;line-height:1;letter-spacing:-.01em}
.brand span{font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:none;text-align:left;padding:10px 14px;border-radius:999px;color:var(--muted);font-size:13.5px}
.nav button:hover{color:var(--fg);background:var(--block)}
.nav button[aria-current="page"]{color:var(--brand-ink);background:var(--brand)}
.nav .count{font-size:11px;min-width:20px;text-align:center;padding:1px 7px;border-radius:10px;background:var(--late);color:#fff}
.nav .count:empty{display:none}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-left:4px}
.seg{display:inline-flex;border-radius:999px;padding:3px;background:var(--block);gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:999px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sync{font-size:11px;color:var(--faint);display:flex;align-items:center;gap:6px;padding-left:6px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.sync.on i{background:var(--c-signe)}

main{min-width:0;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px),clamp(16px,2.4vw,32px));padding-right:max(16px,env(safe-area-inset-right,0px),clamp(16px,3vw,40px))}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{margin:0;font-family:var(--f-title);font-weight:400;font-size:clamp(40px,5vw,62px);letter-spacing:-.015em;line-height:.95}
.head h1 em,.b-h h2 em{font-style:italic}
.head p{margin:10px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raised);padding:9px 16px;border-radius:999px;font-size:13px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:none}
.btn.sm{padding:5px 11px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:default}
.round{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--raised);font-size:16px;text-decoration:none;flex:none}
.round.dark{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.block{background:var(--block);border-radius:var(--r-block);padding:22px 24px;min-width:0;display:flex;flex-direction:column;gap:16px;position:relative}
.nwrap{position:relative;display:flex;min-width:0}.nwrap>.block{flex:1}
.notch{-webkit-mask:radial-gradient(circle 30px at calc(100% - 26px) 26px,transparent 29px,#000 30px);mask:radial-gradient(circle 30px at calc(100% - 26px) 26px,transparent 29px,#000 30px)}
.notch-btn{position:absolute;top:6px;right:6px;width:42px;height:42px}
.b-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.b-h h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:32px;letter-spacing:-.01em;line-height:1}
.b-h p{margin:6px 0 0;color:var(--muted);font-size:12.5px}
.notch .b-h{padding-right:56px}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-6{grid-column:span 6}.span-4{grid-column:span 4}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi{background:var(--block);border-radius:var(--r-block);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.kpi .v{font-family:var(--f-title);font-size:54px;line-height:.85;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hero{background:var(--brand);color:var(--brand-ink)}
.kpi.hero .label,.kpi.hero .s{color:var(--brand-ink);opacity:.72}

.todo-list{display:flex;flex-direction:column;gap:8px}
.todo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--raised);border-radius:20px;padding:12px 14px 12px 12px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--c,var(--c-todo));color:#1C1917;font-size:12.5px;font-weight:600;letter-spacing:.02em;flex:none}
.av.is-late{box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--late)}
.todo .who{min-width:0;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.todo .who b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo .who small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo .ops{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:18px 4px;color:var(--muted);font-size:13px}
.empty b{color:var(--fg);font-weight:500}

.donut-wrap{display:flex;flex-direction:column;align-items:center;gap:18px}
.donut{width:min(210px,100%);aspect-ratio:1;max-width:100%}
.donut-leg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;width:100%}
.donut-leg div{display:flex;align-items:center;gap:8px;font-size:12.5px}
.donut-leg b{margin-left:auto;font-family:var(--f-title);font-weight:400;font-size:20px}

.seg-f{display:inline-flex;background:var(--raised);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg-f button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:12.5px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.seg-f button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.seg-f em{font-style:normal;font-size:11px;opacity:.75}
.mini{display:flex;flex-direction:column;gap:6px}
.mini .it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--raised);cursor:pointer;min-width:0}
.mini .it b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.mini .it small{color:var(--muted);font-size:12px;white-space:nowrap}

.opps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.opp{background:var(--raised);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;min-width:0}
.opp:hover{box-shadow:var(--shadow)}
.opp .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.opp .t b{font-family:var(--f-title);font-weight:400;font-size:24px;line-height:1}
.opp .budget{font-family:var(--f-title);font-size:30px;line-height:1}
.opp dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;margin:0;font-size:12px}
.opp dt{color:var(--muted)}
.opp dd{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .track{height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.prog .fill{height:100%;background:var(--c);border-radius:3px}
.prog .steps{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint)}
.prog .steps .on{color:var(--fg)}

.days{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(52px,1fr);gap:8px;overflow-x:auto;padding:2px 2px 6px}
.day{border:0;background:var(--raised);border-radius:999px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:96px}
.day b{font-family:var(--f-title);font-weight:400;font-size:26px;line-height:1}
.day small{font-size:11px;color:var(--muted)}
.day .pips{display:flex;gap:3px;margin-top:auto;min-height:8px;flex-wrap:wrap;justify-content:center;max-width:36px}
.day .pips i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.day[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.day[aria-pressed="true"] small{color:var(--brand-ink);opacity:.75}
.day.we{opacity:.6}
.rail-line{height:1px;background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 9px)}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctl select,.toolbar select,.toolbar input,.field input,.field select,.field textarea{background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12.5px;min-width:0}
.field textarea{border-radius:16px}

.table-wrap{overflow-x:auto;border-radius:20px;background:var(--raised)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-weight:500;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap;user-select:none}
th[data-sort]{cursor:pointer}
td{padding:11px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
td.wrap{white-space:normal;min-width:180px}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--block)}
tbody tr:last-child td{border-bottom:0}
td .nm{display:flex;align-items:center;gap:8px;font-weight:500}

.newc{display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap}
.newc .big{font-family:var(--f-title);font-size:96px;line-height:.75}
.minibars{display:flex;gap:8px;align-items:flex-end;height:80px}
.minibars div{display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%}
.minibars i{width:22px;background:var(--c-todo);border-radius:6px 6px 2px 2px;min-height:2px}
.minibars div:last-child i{background:var(--brand)}
.minibars small{font-size:10.5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:200px}
.chips button{border:0;background:var(--raised);border-radius:999px;padding:6px 12px;font-size:12px;display:inline-flex;align-items:center;gap:6px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input[type="search"]{flex:1 1 200px;max-width:320px}
.board-wrap{overflow-x:auto;margin-inline:-4px;padding:0 4px 12px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:296px;gap:12px;min-height:460px;align-items:start}
.col{display:flex;flex-direction:column;gap:10px;background:var(--block);border-radius:var(--r-block);padding:14px 10px 12px;min-width:0;min-height:300px}
.col.over{box-shadow:inset 0 0 0 2px var(--brand)}
.col.archive{background:transparent;border:1.5px dashed var(--line)}
.col-h{display:flex;flex-direction:column;gap:4px;padding:2px 8px 6px}
.col-h .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.col-h span{font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:8px}
.col-h em{font-style:normal;font-size:11.5px;color:var(--muted);background:var(--raised);padding:1px 9px;border-radius:999px}
.col-h small{color:var(--muted);font-size:11.5px;line-height:1.35;min-height:2.7em}
.col-bar{height:3px;border-radius:2px;background:var(--c);margin:2px 8px 4px}

.pc{position:relative;cursor:grab}
.pc.dragging{opacity:.4}
.pc-body{background:var(--card);color:var(--card-fg);border-radius:var(--r-card);padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px;
  -webkit-mask:radial-gradient(circle 27px at calc(100% - 24px) 24px,transparent 26px,#000 27px);mask:radial-gradient(circle 27px at calc(100% - 24px) 24px,transparent 26px,#000 27px)}
.pc:hover .pc-body{filter:brightness(1.07)}
.pc-go{position:absolute;top:3px;right:3px;width:42px;height:42px;border-radius:50%;border:1px solid var(--card-line);background:var(--card);color:var(--card-fg);display:grid;place-items:center;font-size:16px}
.pc-go:hover{background:var(--card-pill)}
.pc .av{width:52px;height:52px;font-size:15px;box-shadow:0 0 0 3px var(--card)}
.pc .av.is-late{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--late)}
.pc-name{font-family:var(--f-title);font-size:29px;line-height:1;letter-spacing:-.005em;margin-top:6px;overflow-wrap:anywhere}
.pc-sub{font-size:13px;color:var(--card-muted);line-height:1.35;margin-top:-6px}
.pc-next{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--card-fg);opacity:.9}
.pc-next.late{color:var(--late);opacity:1}
.pc-next .dot{width:6px;height:6px}
.pc-foot{display:grid;grid-template-columns:auto auto;justify-content:space-between;gap:12px;align-items:end;margin-top:2px}
.pc-foot .k{font-size:11.5px;color:var(--card-muted);margin-bottom:6px}
.pc-foot .r{text-align:right}
.pc-pill{display:inline-flex;align-items:center;background:var(--card-pill);color:var(--card-fg);border-radius:999px;padding:6px 14px;font-size:12px}
.pc-dots{display:inline-flex;gap:4px;padding:5px 7px;border:1px solid var(--card-line);border-radius:999px}
.pc-dots i{width:11px;height:11px;border-radius:50%;background:var(--card-off)}
.pc-dots i.on:nth-child(1){background:var(--i1)}.pc-dots i.on:nth-child(2){background:var(--i2)}.pc-dots i.on:nth-child(3){background:var(--i3)}.pc-dots i.on:nth-child(4){background:var(--i4)}.pc-dots i.on:nth-child(5){background:var(--i5)}
.arch{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;background:var(--block);cursor:pointer;font-size:12.5px;min-width:0}
.arch b{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arch small{color:var(--muted);white-space:nowrap}

.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 54px;gap:12px;align-items:center;font-size:12.5px}
.bar .track{height:10px;background:var(--raised);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--c,var(--brand));border-radius:5px}
.bar .n{font-family:var(--f-title);font-size:18px;text-align:right}
.cols{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;height:170px;padding-top:18px}
.cols .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.cols .c div{width:min(40px,70%);background:var(--brand);border-radius:10px 10px 3px 3px;min-height:2px}
.cols .c span{font-size:11px;color:var(--muted)}
.cols-x{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:8px}
.cols-x span{text-align:center;font-size:11px;color:var(--muted)}
.pcard{background:var(--raised);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:grab;border-left:4px solid var(--c)}
.pcard b{font-family:var(--f-title);font-weight:400;font-size:22px;line-height:1.05}
.pcard small{font-size:11.5px;color:var(--muted)}
.pcard .line{display:flex;justify-content:space-between;align-items:center;gap:6px}

.scrim{position:fixed;inset:0;background:rgba(18,16,14,.3);backdrop-filter:blur(3px);z-index:40}
.drawer{position:fixed;top:8px;right:8px;bottom:8px;width:min(580px,calc(100% - 16px));background:var(--block);border-radius:var(--r-block);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);margin-top:env(safe-area-inset-top,0px);margin-bottom:env(safe-area-inset-bottom,0px);margin-right:env(safe-area-inset-right,0px);overflow:hidden}
.drawer-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:24px 24px 14px}
.drawer-h h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:40px;line-height:.95}
.drawer-h .sub{margin:10px 0 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12.5px}
.drawer-b{flex:1;overflow-y:auto;padding:8px 24px 32px;display:flex;flex-direction:column;gap:20px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field textarea{min-height:72px;resize:vertical}
.starpick{display:flex;gap:2px}
.starpick button{border:0;background:none;font-size:18px;color:var(--line);padding:0 2px}
.starpick button.on{color:var(--brand)}
.next{background:var(--raised);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.next b{font-weight:500}
.tip{font-size:12.5px;color:var(--muted);border-left:2px solid var(--beige);padding-left:10px}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.steps .btn .dot{width:7px;height:7px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.facts div{background:var(--raised);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.facts b{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lost{background:color-mix(in srgb,var(--c-perdu) 18%,var(--raised));border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.hist{display:flex;flex-direction:column;border-left:1px solid var(--line);margin-left:4px}
.hist div{position:relative;padding:0 0 12px 16px;font-size:12.5px}
.hist div::before{content:"";position:absolute;left:-4px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--block);border:1px solid var(--muted)}
.hist time{font-size:11px;color:var(--muted);margin-right:8px}

.drop{border:1.5px dashed var(--line);border-radius:var(--r-block);padding:28px;text-align:center;color:var(--muted);background:var(--block)}
.drop.over{border-color:var(--brand);color:var(--fg)}
.steps-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:20px}

.steps-list b{display:block;color:var(--fg);font-weight:500;margin-bottom:4px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.notice{background:var(--block);border-radius:999px;padding:8px 8px 8px 18px;font-size:12.5px;color:var(--muted);margin-bottom:14px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}

@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.span-8,.span-6,.span-4{grid-column:span 12}}

  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  .brand span,.rail-foot .sync{display:none}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap;padding:8px 12px}

  .todo .ops{grid-column:1/-1;justify-content:flex-start}
  .bar{grid-template-columns:96px minmax(0,1fr) 44px}

}

  .drawer{animation:slide .24s cubic-bezier(.2,.8,.2,1)}

}

<script>
const UNIVERS={da:"Direction artistique",graphisme:"Design graphique",hospitalite:"Expérientiel & hospitalité",b2c:"Clients directs"};
const CIBLES={studio:"Studio / agence",client_final:"Client final",apporteur:"Apporteur / partenaire",ancien_client:"Ancien client",tiede:"Prospect tiède"};
const ZONES={fr:"France",eu:"Europe",intl:"US / international"};
const ANGLES={renfort:"Renfort DA / design graphique",p360:"Projet 360",courte:"Mission courte",long:"Mission long terme"};
const CANAUX={email:"Email",instagram:"Instagram",linkedin:"LinkedIn",telephone:"Téléphone",whatsapp:"WhatsApp",rencontre:"Rencontre"};
const RAISONS={budget:"Budget",timing:"Timing · pas maintenant",besoin:"Pas de besoin réel",concurrent:"A choisi quelqu'un d'autre",silence:"Plus de nouvelles",interne:"Fait en interne",autre:"Autre"};
const SERVICES=["Strategy & Concepts","Art Direction","Brand Identity","Graphic Design","Editorial & Publication","Digital & Web Design","Campaigns & Content","Art Buying"];

/* Board 1 : Prospection & relances */
const PROSPECT=[
  {k:"a_contacter",l:"À contacter",c:"--c-todo",d:"Pas encore écrit"},
  {k:"contacte",l:"Contacté",c:"--c-contact",d:"1er message envoyé"},
  {k:"relance",l:"Relance prévue",c:"--c-relance",d:"Relance 1, 2 ou 3 programmée"},
  {k:"sommeil",l:"Sommeil",c:"--c-sommeil",d:"Relances finies sans réponse · pause volontaire"},
  {k:"reactiver",l:"À réactiver",c:"--c-react",d:"À reprendre avec un nouvel angle ou à une date choisie"},
];
/* Board 2 : Pipeline */
const PIPE=[
  {k:"repondu",l:"Répondu",c:"--c-rep",d:"A répondu au message"},
  {k:"qualification",l:"Qualification",c:"--c-qualif",d:"Besoin, timing, type de projet, autonomie, décideurs, sérieux"},
  {k:"r1",l:"R1 · call",c:"--c-call",d:"Call planifié ou tenu"},
  {k:"proposition",l:"Proposition envoyée",c:"--c-call",d:"Devis ou proposition commerciale"},
  {k:"attente",l:"Attente · négociation",c:"--c-attente",d:"Attente de décision ou discussion en cours"},
  {k:"signe",l:"Signé",c:"--c-signe",d:"Devis accepté"},
  {k:"perdu",l:"Perdu · plus tard",c:"--c-perdu",d:"Avec la raison documentée"},
];
const ALL=[...PROSPECT,...PIPE];
const STAGE=Object.fromEntries(ALL.map(s=>[s.k,s]));
const P_KEYS=PROSPECT.map(s=>s.k), PIPE_KEYS=PIPE.map(s=>s.k);
const ACTIVE_PIPE=["repondu","qualification","r1","proposition","attente"];
const DORMANT=["sommeil","reactiver","perdu"];
const PSTAGES=[{k:"production",l:"En production",c:"--c-qualif"},{k:"livre",l:"Livré",c:"--c-call"},{k:"facture",l:"Facture envoyée",c:"--c-attente"},{k:"paye",l:"Payé",c:"--c-signe"}];
const TIPS={
  froid:"Message court et personnalisé, 2–3 visuels choisis dans leur univers. Une idée par message.",
  tiede:"Bien qualifier : besoin, timing, type de projet, niveau d'autonomie attendu, décideurs, sérieux.",
  chaud:"Suivre la prochaine étape convenue. Récapituler par écrit après chaque échange.",
  dormant:"Revenir avec une vraie raison : une actu, une disponibilité, un projet proche de leur univers, un nouvel angle.",
  ancien_client:"Prendre des nouvelles, annoncer une disponibilité, montrer un projet récent.",
  apporteur:"Toucher léger : une actu utile, une dispo mise à jour, le portfolio, une intro ou une reco de votre réseau. Créer de la réciprocité."
};

const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=s?new Date(s+"T12:00"):new Date();d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((new Date(a+"T12:00")-new Date(b+"T12:00"))/864e5);
const MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const JOURS=["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
const fmtD=s=>{if(!s)return"—";const d=new Date(s+"T12:00");return d.getDate()+" "+MOIS[d.getMonth()]};
const rel=s=>{if(!s)return"—";const n=diff(s,today());if(n===0)return"Aujourd'hui";if(n===1)return"Demain";if(n===-1)return"Hier";if(n<0)return"Il y a "+(-n)+" j";if(n<7)return"Dans "+n+" j";return fmtD(s)};
const ago=s=>{if(!s)return"—";const n=diff(today(),s);return n===0?"Aujourd'hui":n===1?"Hier":"Il y a "+n+" j"};
const eur=n=>new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n||0);
const monday=()=>{const d=new Date();d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)};

/* anciennes étapes → nouvelles (lecture seule) */
function migrate(c){
  const s=c.stage||"a_contacter";
  const map={prospection:(c.relances||1)<=1?"contacte":"relance",reponse:"repondu",decouverte:"qualification",devis:"proposition",timing:"perdu",veille:"sommeil"};
  if(map[s]){c.stage=map[s];if(s==="timing"&&!c.raison)c.raison="timing"}
  if(!STAGE[c.stage])c.stage="a_contacter";
  return c;
}
const stage=c=>c.stage||"a_contacter";
const board=c=>PIPE_KEYS.includes(stage(c))?"pipe":"prospect";
const relanceNum=c=>Math.max(1,(c.relances||1));
const colorOf=c=>{const s=stage(c);if(s==="attente"&&c.nego)return"--c-nego";return(STAGE[s]||STAGE.a_contacter).c};
const stageLabel=c=>{const s=stage(c);if(s==="attente")return c.nego?"Négociation":"Attente décision";if(s==="relance")return"Relance "+relanceNum(c)+" prévue";return STAGE[s].l};
function temperature(c){
  const s=stage(c);
  if(s==="signe")return"client";
  if(DORMANT.includes(s))return"dormant";
  if(["r1","proposition","attente"].includes(s))return"chaud";
  if(["repondu","qualification"].includes(s)||c.cible==="tiede"||c.cible==="ancien_client")return"tiede";
  return"froid";
}
const TEMP_L={froid:"Froid",tiede:"Tiède",chaud:"Chaud",dormant:"Dormant",client:"Client"};
const isLate=c=>!!(c.next&&c.next.date&&c.next.date<today()&&stage(c)!=="signe");
const isOpp=c=>ACTIVE_PIPE.includes(stage(c));
function lastContact(c){const h=(c.hist||[]).find(x=>!/^Fiche créée/.test(x.t));return h?h.d:""}
function lastContactText(c){const h=(c.hist||[]).find(x=>!/^Fiche créée/.test(x.t));return h?h.t:""}
function priorite(c){
  const m={froid:1,tiede:2,chaud:3,dormant:.5,client:0}[temperature(c)];
  let s=m*2+(c.potentiel||0)*1.5;
  if(isLate(c))s+=Math.min(3,-diff(c.next.date,today())/3)+1;
  return s;
}
function tipFor(c){
  if(c.cible==="apporteur")return TIPS.apporteur;
  if(c.cible==="ancien_client")return TIPS.ancien_client;
  const t=temperature(c);return TIPS[t==="client"?"chaud":t];
}
function zoneHint(c){
  if(c.zone==="intl")return"Fuseau US : envoyer entre 15h et 18h, heure de Paris.";
  if(c.zone==="eu")return"Europe : même créneau qu'en France, éviter le lundi matin.";
  return"";
}
function todoKind(c){
  return({a_contacter:"Message à envoyer",contacte:"Relance 1",relance:"Relance "+relanceNum(c),sommeil:"Fin de pause",reactiver:"Réactivation",
    repondu:"Qualification",qualification:"Planifier le call",r1:"Suivi post-call",proposition:"Proposition en attente",attente:c.nego?"Négociation":"Décision attendue",perdu:"Reprise de contact"})[stage(c)]||"Suivi";
}
/* Rythme après un message de prospection (n = messages envoyés, 1er inclus) */
function rythme(c,n,from){
  const t=c.cible;
  if(t==="apporteur")return{stage:"relance",next:{date:addDays(from,35),label:"Toucher léger (4–6 semaines)"}};
  if(t==="ancien_client")return{stage:"relance",next:{date:addDays(from,45),label:"Prendre des nouvelles (1×/mois à 1×/2 mois)"}};
  if(t==="tiede")return{stage:"relance",next:{date:addDays(from,30),label:"Relance tiède (3–6 semaines)"}};
  if(n===1)return{stage:"contacte",next:{date:addDays(from,8),label:"Relance 1 (J+7/10)"}};
  if(n===2)return{stage:"relance",next:{date:addDays(from,14),label:"Relance 2 (≈J+21)"}};
  if(n===3)return{stage:"relance",next:{date:addDays(from,21),label:"Relance 3 (≈J+45)"}};
  return{stage:"sommeil",next:{date:addDays(from,75),label:"Fin de la pause : réactiver ?"}};
}
function appliquer(c,ev,opts={}){
  const t=today(),h=(c.hist||[]).slice();
  const p={};const log=txt=>h.unshift({d:t,t:txt});
  switch(ev){
    case"envoye":{
      const fresh=DORMANT.includes(stage(c));
      const n=fresh?1:(c.relances||0)+1;p.relances=n;
      log(fresh?"Message de réactivation envoyé":n===1?"Premier message envoyé":"Relance "+(n-1)+" envoyée");
      const r=rythme(c,n,t);p.stage=r.stage;p.next=r.next;
      if(r.stage==="sommeil")log("Pas de réponse après 3 relances · mise en sommeil");
      break}
    case"sommeil":p.stage="sommeil";p.next={date:opts.date||addDays(t,75),label:"Fin de la pause : réactiver ?"};log("Mis en sommeil");break;
    case"reactiver":p.stage="reactiver";p.next={date:opts.date||addDays(t,30),label:"Réactiver"+(c.angleReact?" · "+c.angleReact:" avec un nouvel angle")};log("À réactiver");break;
    case"a_contacter":p.stage="a_contacter";p.next={date:t,label:"Envoyer le premier message"};break;
    case"repondu":p.stage="repondu";p.next={date:addDays(t,3),label:"Qualifier : besoin, timing, décideurs"};p.converti=t;log("A répondu · converti en opportunité");break;
    case"qualification":p.stage="qualification";p.next={date:addDays(t,5),label:"Planifier le call R1"};log("Qualification");break;
    case"r1":p.stage="r1";p.next={date:addDays(t,5),label:"Envoyer la proposition"};log("Call R1");break;
    case"proposition":p.stage="proposition";p.next={date:addDays(t,7),label:"Relancer la proposition"};log("Proposition envoyée"+(c.montant?" · "+eur(c.montant):""));break;
    case"attente":p.stage="attente";p.nego=false;p.next={date:addDays(t,7),label:"Point sur la décision"};log("En attente de décision");break;
    case"nego":p.stage="attente";p.nego=true;p.next={date:addDays(t,4),label:"Avancer la négociation"};log("Négociation en cours");break;
    case"signe":p.stage="signe";p.next=null;log("Signé");break;
    case"perdu":p.stage="perdu";p.next={date:addDays(t,90),label:"Reprendre contact ?"};log("Perdu · plus tard");break;
  }
  p.hist=h.slice(0,60);p.maj=t;
  return p;
}
const DROP_EVENT={a_contacter:"a_contacter",contacte:"envoye",relance:"envoye",sommeil:"sommeil",reactiver:"reactiver",converti:"repondu",
  repondu:"repondu",qualification:"qualification",r1:"r1",proposition:"proposition",attente:"attente",signe:"signe",perdu:"perdu"};
function actionPrincipale(c){
  const s=stage(c);
  if(s==="a_contacter")return{ev:"envoye",l:"Message envoyé"};
  if(s==="contacte"||s==="relance")return{ev:"envoye",l:"Relance faite"};
  if(DORMANT.includes(s))return{ev:"envoye",l:"Message envoyé"};
  return null;
}
function gcal(c){
  if(!c.next||!c.next.date)return"";
  const d=c.next.date.replace(/-/g,""),e=addDays(c.next.date,1).replace(/-/g,"");
  const txt=(c.next.label||"Relance")+" · "+(c.studio||c.nom||"");
  const det=[c.nom,c.email,CANAUX[c.canal]?"Canal : "+CANAUX[c.canal]:"",tipFor(c),zoneHint(c)].filter(Boolean).join("\n");
  return"https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(txt)+"&dates="+d+"/"+e+"&details="+encodeURIComponent(det);
}
function splitName(c){
  const raw=(c.nom||"").trim();const i=raw.indexOf(",");
  const person=i>=0?raw.slice(0,i).trim():raw, role=i>=0?raw.slice(i+1).trim():"";
  return{title:person||c.studio||"Sans nom",sub:person?[role,c.studio].filter(Boolean).join(" · "):(CIBLES[c.cible]||"")};
}
const initials=s=>(s||"?").replace(/\(.*?\)/g,"").split(/[\s\-]+/).filter(w=>/\p{L}/u.test(w)).slice(0,2).map(w=>w.match(/\p{L}/u)[0].toUpperCase()).join("")||"?";

const S={contacts:[],projets:[],view:"today",filters:{q:"",univers:"",cible:"",zone:"",temp:""},sort:{k:"prio",dir:-1},
  home:{temp:"chaud",horizon:14,day:"",since:0},ready:false,db:null,open:null,openP:null};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2800)}
function setSync(on,txt){const s=document.getElementById("sync");s.classList.toggle("on",on);s.querySelector("span").textContent=txt}
async function save(col,id,patch,full){
  if(!S.db){toast("Enregistrement impossible : la base n'est pas joignable.");return false}
  const run=()=>{const ref=S.db.collection(col).doc(id);return full?ref.set(patch):ref.update(patch)};
  try{await run();return true}
  catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*600));try{await run();return true}catch(_){}}
    toast(e&&e.code==="quota_exceeded"?"La base est pleine : supprimez d'anciennes fiches.":"Échec de l'enregistrement. Réessayez dans un instant.");return false}
}
async function del(col,id){if(!S.db)return;try{await S.db.collection(col).doc(id).delete()}catch(e){toast("Suppression impossible pour le moment.")}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

async function boot(){
  render();
  const db=await claude.use("db").catch(()=>null);
  if(!db){setSync(false,"Hors ligne");S.ready=true;render();return}
  S.db=db;
  let got=0;const timer=setTimeout(()=>{if(got<3)setSync(false,"Lent à répondre…")},10000);
  const sub=name=>db.collection(name).onSnapshot(snap=>{
    S[name]=snap.docs.map(d=>{const o={id:d.id,...d.data()};return name==="contacts"?migrate(o):o});
    if(!snap.metadata.fromCache){got|=name==="contacts"?1:2;if(got===3){clearTimeout(timer);setSync(true,"Synchronisé")}}
    S.ready=true;render();
  },()=>{clearTimeout(timer);setSync(false,"Connexion perdue");S.ready=true;render()});
  sub("contacts");sub("projets");
}

const VIEWS=[["today","Accueil"],["prospect","Prospection"],["pipeline","Pipeline"],["contacts","Contacts"],["projets","Projets"],["dash","Chiffres"],["import","Importer"]];
function renderNav(){
  const due=S.contacts.filter(c=>c.next&&c.next.date&&c.next.date<=today()&&stage(c)!=="signe").length;
  document.getElementById("nav").innerHTML=VIEWS.map(([k,l])=>`<button data-v="${k}" ${S.view===k?'aria-current="page"':""}>${l}<span class="count">${k==="today"&&due?due:""}</span></button>`).join("");
}
function go(v){S.view=v;location.hash=v;render();window.scrollTo(0,0)}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-v]");if(b)go(b.dataset.v)});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h)&&h!==S.view){S.view=h;render()}});
{const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h))S.view=h;}
function applyTheme(t){const r=document.documentElement;if(t==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t);document.querySelectorAll("#theme button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===t))}
document.getElementById("theme").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;store.set("crm-theme",b.dataset.t);applyTheme(b.dataset.t)});
applyTheme(store.get("crm-theme")||"auto");

const tag=c=>`<span class="tag" style="--c:var(${colorOf(c)})"><span class="dot"></span>${esc(stageLabel(c))}</span>`;
const av=c=>`<span class="av ${isLate(c)?"is-late":""}" style="--c:var(${colorOf(c)})">${esc(initials(splitName(c).title))}</span>`;
function temp(c){const t=temperature(c);const n={froid:1,tiede:2,chaud:3,client:3,dormant:0}[t];
  return`<span class="temp"><span>${[1,2,3].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</span>${TEMP_L[t]}</span>`}
const opt=(obj,v,empty)=>(empty!==undefined?`<option value="">${empty}</option>`:"")+Object.entries(obj).map(([k,l])=>`<option value="${k}" ${v===k?"selected":""}>${esc(l)}</option>`).join("");
const head=(t,sub,acts="")=>`<div class="head"><div><h1>${t}</h1>${sub?`<p>${sub}</p>`:""}</div><div class="actions">${acts}</div></div>`;
function examplesNotice(){
  const n=S.contacts.filter(c=>c.exemple).length+S.projets.filter(p=>p.exemple).length;
  return n?`<div class="notice"><span>Les fiches « exemple » sont fictives et servent de démonstration.</span><button class="btn sm" data-act="clear-ex">Supprimer les ${n} exemples</button></div>`:"";
}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* ───────── ACCUEIL ───────── */
function vToday(){
  const t=today(),wkEnd=addDays(t,6),mon=monday();
  const active=S.contacts.filter(c=>stage(c)!=="signe");
  const relancesSemaine=active.filter(c=>c.next&&c.next.date&&c.next.date<=wkEnd);
  const lateN=relancesSemaine.filter(isLate).length;
  const opps=S.contacts.filter(isOpp).sort((a,b)=>(+b.montant||0)-(+a.montant||0)||priorite(b)-priorite(a));
  const oppSum=opps.reduce((s,c)=>s+(+c.montant||0),0);
  const clients=S.projets.filter(p=>p.stage!=="paye");
  const dorm=S.contacts.filter(c=>["sommeil","reactiver"].includes(stage(c)));
  const dormSoon=dorm.filter(c=>c.next&&c.next.date&&c.next.date<=addDays(t,14)).length;
  let sent=0;S.contacts.forEach(c=>(c.hist||[]).forEach(h=>{if(h.d>=mon&&/envoy/i.test(h.t)&&!/proposition|devis/i.test(h.t))sent++}));
  const jour=cap(new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}));
  const kpis=`<div class="kpis">
    <div class="kpi hero"><span class="label">Relances de la semaine</span><span class="v">${relancesSemaine.length}</span><span class="s">${lateN?lateN+" en retard":"Rien en retard"}</span></div>
    <div class="kpi"><span class="label">Opportunités actives</span><span class="v">${opps.length}</span><span class="s">${oppSum?eur(oppSum)+" potentiels":"Budget à préciser"}</span></div>
    <div class="kpi"><span class="label">Clients en cours</span><span class="v">${clients.length}</span><span class="s">Projets signés non soldés</span></div>
    <div class="kpi"><span class="label">Dormants à réactiver</span><span class="v">${dorm.length}</span><span class="s">${dormSoon} à reprendre sous 15 j</span></div>
    <div class="kpi"><span class="label">Messages envoyés</span><span class="v">${sent}</span><span class="s">Depuis lundi</span></div>
  </div>`;
  const h=head("Bonjour",jour,`<button class="btn primary" data-act="new">+ Nouveau contact</button>`);
  if(!S.ready)return h+kpis+`<div class="block"><div class="empty">Chargement de vos contacts…</div></div>`;
  if(!S.contacts.length)return h+kpis+`<div class="block"><div class="empty"><b>Votre CRM est vide.</b> Importez votre Google Sheet depuis l'onglet « Importer », ou créez votre premier contact.</div></div>`;
  return h+examplesNotice()+kpis+`<div class="grid">${blocTodo()}${blocDonut()}${blocOpps(opps,oppSum)}${blocTemp()}${blocPlan()}${blocNew()}</div>`;
}
function blocTodo(){
  const t=today();
  const list=S.contacts.filter(c=>stage(c)!=="signe"&&c.next&&c.next.date&&c.next.date<=t).sort((a,b)=>priorite(b)-priorite(a));
  const late=list.filter(isLate).length;
  return`<div class="span-8 nwrap"><section class="block notch">
    <div class="b-h"><div><h2>To do, <em>aujourd'hui</em></h2><p>${list.length} action(s)${late?` · <span class="late">${late} en retard</span>`:""} · triées par priorité</p></div></div>
    <div class="todo-list">${list.length?list.slice(0,8).map(todoRow).join(""):`<div class="empty">Tout est à jour pour aujourd'hui.</div>`}
    ${list.length>8?`<button class="btn sm ghost" data-goto="contacts">Voir les ${list.length-8} autres</button>`:""}</div>
  </section><a class="round dark notch-btn" href="#prospect" aria-label="Ouvrir la prospection">↗</a></div>`;
}
function todoRow(c){
  const a=actionPrincipale(c),g=gcal(c);
  return`<div class="todo">${av(c)}
    <div class="who" data-open="${c.id}"><b>${esc(c.studio||c.nom||"Sans nom")} <span style="color:var(--muted);font-weight:400">· ${todoKind(c)}</span></b>
      <small>${isLate(c)?`<span class="late">${rel(c.next.date)}</span> · `:""}${esc(c.next.label||"")}${CANAUX[c.canal]?" · "+CANAUX[c.canal]:""}${c.zone==="intl"?" · fuseau US":""}</small></div>
    <div class="ops">${temp(c)}
      ${a?`<button class="btn sm primary" data-ev="${a.ev}" data-id="${c.id}">${a.l}</button>`:`<button class="btn sm primary" data-open="${c.id}">Ouvrir</button>`}
      <button class="btn sm" data-snooze="${c.id}" title="Reporter de 3 jours">+3 j</button>
      ${g?`<a class="round" style="width:30px;height:30px;font-size:12px" href="${g}" target="_blank" rel="noopener" title="Ajouter à Google Agenda">⧉</a>`:""}</div>
  </div>`;
}
function blocDonut(){
  const grp=c=>{const s=stage(c);if(s==="a_contacter")return"todo";if(s==="contacte"||s==="relance")return"contacte";if(s==="signe")return"won";if(DORMANT.includes(s))return"dorm";return"discussion"};
  const groups=[["todo","À contacter","var(--c-todo)"],["contacte","Contacté","var(--c-contact)"],["discussion","En discussion","var(--c-qualif)"],["won","Signé","var(--c-signe)"],["dorm","Dormant","var(--c-sommeil)"]];
  const counts=Object.fromEntries(groups.map(g=>[g[0],0]));S.contacts.forEach(c=>counts[grp(c)]++);
  const total=S.contacts.length||1;const R=70,C=2*Math.PI*R;let off=0;
  const arcs=groups.map(([k,,col])=>{const len=counts[k]/total*C;const gap=counts[k]&&len>4?2:0;
    const a=`<circle cx="100" cy="100" r="${R}" fill="none" stroke="${col}" stroke-width="26" stroke-dasharray="${Math.max(0,len-gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;off+=len;return a}).join("");
  return`<section class="block span-4"><div class="b-h"><div><h2>Le pipe</h2><p>Où en sont vos ${S.contacts.length} contacts</p></div></div>
    <div class="donut-wrap"><svg class="donut" viewBox="0 0 200 200" role="img" aria-label="Répartition du pipe">
      <circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--line-soft)" stroke-width="26"/>${arcs}
      <text x="100" y="110" text-anchor="middle" font-size="50" style="fill:var(--fg);font-family:var(--f-title)">${S.contacts.length}</text>
      <text x="100" y="130" text-anchor="middle" font-size="11" style="fill:var(--muted);font-family:var(--f-ui)">contacts</text></svg>
    <div class="donut-leg">${groups.map(([k,l,col])=>`<div><i class="dot" style="background:${col}"></i>${l}<b>${counts[k]}</b></div>`).join("")}</div></div>
  </section>`;
}
function blocOpps(opps,sum){
  return`<section class="block span-8"><div class="b-h"><div><h2>Opportunités actives</h2><p>Seulement les vrais potentiels de mission · votre bloc cash</p></div>
    <div style="text-align:right"><span class="label">Total potentiel</span><div class="serif" style="font-size:38px;line-height:1">${eur(sum)}</div></div></div>
    ${opps.length?`<div class="opps">${opps.map(oppCard).join("")}</div>`:`<div class="empty">Aucune opportunité active. Elles apparaissent dès qu'un prospect répond.</div>`}
    <a class="btn sm ghost" href="#pipeline" style="align-self:flex-start">Ouvrir le pipeline</a>
  </section>`;
}
function oppCard(c){
  const step=ACTIVE_PIPE.indexOf(stage(c))+1;
  return`<article class="opp" data-open="${c.id}">
    <div class="t"><b>${esc(c.studio||c.nom)}</b>${tag(c)}</div>
    <div class="budget">${c.montant?eur(c.montant):'<span style="color:var(--faint);font-size:18px">Budget à préciser</span>'}</div>
    <dl><dt>Mission</dt><dd>${esc(ANGLES[c.angle]||c.besoin||"—")}</dd>
      <dt>Contact</dt><dd>${esc(splitName(c).title)}</dd>
      <dt>Prochaine étape</dt><dd class="${isLate(c)?"late":""}">${c.next?esc(c.next.label)+" · "+rel(c.next.date).toLowerCase():"—"}</dd></dl>
    <div class="prog" style="--c:var(${colorOf(c)})"><div class="track"><div class="fill" style="width:${step/6*100}%"></div></div>
      <div class="steps"><span class="on">${esc(stageLabel(c))}</span><span>Signé</span></div></div>
  </article>`;
}
function blocTemp(){
  const ks=["froid","tiede","chaud","dormant"];
  const by=Object.fromEntries(ks.map(k=>[k,S.contacts.filter(c=>temperature(c)===k).sort((a,b)=>priorite(b)-priorite(a))]));
  const cur=S.home.temp,list=by[cur]||[];
  const def={froid:"Jamais répondu · premier contact",tiede:"A répondu · connaît votre nom · intérêt léger",chaud:"Échange en cours · besoin potentiel · call fait",dormant:"Pas maintenant · à réactiver plus tard"};
  return`<section class="block span-4"><div class="b-h"><div><h2>Par température</h2><p>${def[cur]}</p></div></div>
    <div class="seg-f" role="group" aria-label="Température">${ks.map(k=>`<button data-temp="${k}" aria-pressed="${k===cur}">${TEMP_L[k]}<em>${by[k].length}</em></button>`).join("")}</div>
    <div class="mini">${list.slice(0,7).map(c=>`<div class="it" data-open="${c.id}"><i class="dot" style="--c:var(${colorOf(c)})"></i><b>${esc(c.studio||c.nom)}</b><small>${c.next?rel(c.next.date):"—"}</small></div>`).join("")||`<div class="empty">Personne dans cette catégorie.</div>`}
    ${list.length>7?`<button class="btn sm ghost" data-goto-temp="${cur}">Voir les ${list.length}</button>`:""}</div>
  </section>`;
}
function blocPlan(){
  const t=today(),H=S.home.horizon,since=S.home.since;
  const days=[];for(let i=1;i<=H;i++)days.push(addDays(t,i));
  const pool=S.contacts.filter(c=>stage(c)!=="signe"&&c.next&&c.next.date>t&&c.next.date<=days[days.length-1])
    .filter(c=>!since||(!lastContact(c)||diff(t,lastContact(c))>since));
  const list=pool.filter(c=>!S.home.day||c.next.date===S.home.day).sort((a,b)=>a.next.date.localeCompare(b.next.date)||priorite(b)-priorite(a));
  return`<section class="block span-12"><div class="b-h"><div><h2>Prochains contacts planifiés</h2><p>${pool.length} contact(s) sur les ${H} prochains jours${S.home.day?" · filtré sur le "+fmtD(S.home.day):""}</p></div>
    <div class="ctl"><div class="seg-f" role="group" aria-label="Horizon">${[7,14].map(n=>`<button data-horizon="${n}" aria-pressed="${H===n}">${n} jours</button>`).join("")}</div>
      <select id="h-since" aria-label="Dernier contact">${[[0,"Dernier contact : tous"],[7,"Dernier contact > 7 j"],[14,"Dernier contact > 14 j"],[30,"Dernier contact > 30 j"]].map(([v,l])=>`<option value="${v}" ${since==v?"selected":""}>${l}</option>`).join("")}</select></div></div>
    <div class="days">${days.map(dd=>{const dt=new Date(dd+"T12:00");const cs=pool.filter(c=>c.next.date===dd);const we=dt.getDay()===0||dt.getDay()===6;
      return`<button class="day ${we?"we":""}" data-day="${dd}" aria-pressed="${S.home.day===dd}"><b>${dt.getDate()}</b><small>${JOURS[dt.getDay()]}</small><span class="pips">${cs.slice(0,8).map(c=>`<i style="--c:var(${colorOf(c)})"></i>`).join("")}</span></button>`}).join("")}</div>
    <div class="rail-line"></div>
    ${list.length?`<div class="table-wrap"><table><thead><tr><th>Nom</th><th>Structure</th><th>Type de contact</th><th>Dernier échange</th><th>Prochaine action</th><th>Raison du prochain contact</th></tr></thead><tbody>
      ${list.map(c=>`<tr data-open="${c.id}"><td><span class="nm"><i class="dot" style="--c:var(${colorOf(c)})"></i>${esc(splitName(c).title)}</span></td><td>${esc(c.studio||"—")}</td><td>${esc(CIBLES[c.cible]||"—")}</td>
        <td>${lastContact(c)?ago(lastContact(c))+` <span style="color:var(--muted)">· ${esc(lastContactText(c))}</span>`:"—"}</td><td>${rel(c.next.date)}</td><td class="wrap">${esc(c.next.label||"")}</td></tr>`).join("")}
    </tbody></table></div>`:`<div class="empty">Aucun contact prévu sur cette période${since?" avec ce filtre":""}.</div>`}
  </section>`;
}
function blocNew(){
  const months=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);months.push(iso(d).slice(0,7))}
  const counts=months.map(m=>S.contacts.filter(c=>(c.cree||"").startsWith(m)).length);const mx=Math.max(1,...counts);
  const cur=counts[5],prev=counts[4];
  const list=S.contacts.filter(c=>(c.cree||"").startsWith(months[5])).sort((a,b)=>(b.cree||"").localeCompare(a.cree||""));
  return`<section class="block span-12"><div class="b-h"><div><h2>Nouveaux contacts du mois</h2><p>Pour vérifier que vous alimentez bien le pipe${prev||cur?` · ${cur>=prev?"+":""}${cur-prev} par rapport au mois dernier`:""}</p></div></div>
    <div class="newc"><div class="big">${cur}</div>
      <div class="minibars" aria-label="Nouveaux contacts par mois">${counts.map((n,i)=>`<div><i style="height:${Math.max(3,n/mx*60)}px"></i><small>${MOIS[+months[i].slice(5)-1]}</small></div>`).join("")}</div>
      <div class="chips">${list.slice(0,14).map(c=>`<button data-open="${c.id}"><i class="dot" style="--c:var(${colorOf(c)})"></i>${esc(c.studio||c.nom)}</button>`).join("")}</div></div>
  </section>`;
}

/* ───────── KANBANS ───────── */
function filtered(){
  const f=S.filters,q=f.q.trim().toLowerCase();
  return S.contacts.filter(c=>(!f.univers||c.univers===f.univers)&&(!f.cible||c.cible===f.cible)&&(!f.zone||c.zone===f.zone)&&(!f.temp||temperature(c)===f.temp)
    &&(!q||[c.studio,c.nom,c.email,c.localisation,c.notes,c.besoin].join(" ").toLowerCase().includes(q)));
}
function toolbar(){
  const f=S.filters;
  return`<div class="toolbar">
    <input type="search" id="f-q" placeholder="Rechercher un studio, un nom…" value="${esc(f.q)}">
    <select id="f-univers" aria-label="Univers">${opt(UNIVERS,f.univers,"Tous les univers")}</select>
    <select id="f-cible" aria-label="Type de contact">${opt(CIBLES,f.cible,"Tous les types")}</select>
    <select id="f-zone" aria-label="Zone">${opt(ZONES,f.zone,"Toutes les zones")}</select>
    <select id="f-temp" aria-label="Température">${opt(TEMP_L,f.temp,"Toutes températures")}</select>
  </div>`;
}
function colHead(s,n,extra=""){return`<div class="col-h"><div class="t"><span><i class="dot" style="--c:var(${s.c})"></i>${s.l}</span><em>${n}</em></div><small>${s.d}${extra}</small></div><div class="col-bar" style="--c:var(${s.c})"></div>`}
function vProspect(){
  const list=filtered();
  const cols=PROSPECT.map(s=>{const cs=list.filter(c=>stage(c)===s.k).sort((a,b)=>((a.next&&a.next.date)||"9").localeCompare((b.next&&b.next.date)||"9"));
    return`<div class="col" data-drop="${s.k}">${colHead(s,cs.length)}${cs.map(pcard).join("")}</div>`}).join("");
  const conv=list.filter(c=>board(c)==="pipe").sort((a,b)=>(b.converti||b.maj||"").localeCompare(a.converti||a.maj||""));
  const archive=`<div class="col archive" data-drop="converti">${colHead({l:"Converti en opportunité",c:"--c-conv",d:"A répondu · suit son cours dans le Pipeline. Archivé ici."},conv.length)}
    ${conv.slice(0,30).map(c=>`<div class="arch" data-open="${c.id}"><i class="dot" style="--c:var(${colorOf(c)})"></i><b>${esc(c.studio||c.nom)}</b><small>${esc(stageLabel(c))}</small></div>`).join("")}
    ${conv.length?`<a class="btn sm ghost" href="#pipeline" style="align-self:flex-start">Voir le pipeline</a>`:""}</div>`;
  return head("Prospection <em>&amp; relances</em>","Glissez une carte d'une colonne à l'autre : la prochaine relance se calcule toute seule.",`<button class="btn primary" data-act="new">+ Nouveau contact</button>`)
   +toolbar()+`<div class="board-wrap"><div class="board">${cols}${archive}</div></div>`;
}
function vPipeline(){
  const list=filtered();
  const cols=PIPE.map(s=>{const cs=list.filter(c=>stage(c)===s.k).sort((a,b)=>priorite(b)-priorite(a));
    const sum=cs.reduce((t,c)=>t+(+c.montant||0),0);
    return`<div class="col" data-drop="${s.k}">${colHead(s,cs.length,sum?` · ${eur(sum)}`:"")}${cs.map(pcard).join("")}</div>`}).join("");
  return head("Pipeline","Dès qu'un prospect répond, il arrive ici. Glissez la carte au fil des échanges.",`<button class="btn primary" data-act="new-pipe">+ Nouvelle opportunité</button>`)
   +toolbar()+`<div class="board-wrap"><div class="board">${cols}</div></div>`;
}
/* Carte prospect, d'après la référence : avatar, flèche dans le coin découpé, nom, fonction, canal, intérêt */
function pcard(c){
  const n=splitName(c),p=c.potentiel||0,on=[0,1,3,5][p];
  const lvl=["Intérêt à évaluer","Intérêt faible","Intérêt moyen","Intérêt fort"][p];
  let next="";
  if(stage(c)==="perdu"&&c.raison)next=`<div class="pc-next"><span class="dot" style="--c:var(--c-perdu)"></span>${esc(RAISONS[c.raison]||"")}</div>`;
  else if(c.next&&c.next.date)next=`<div class="pc-next ${isLate(c)?"late":""}"><span class="dot" style="--c:var(${isLate(c)?"--late":colorOf(c)})"></span>${rel(c.next.date)} · ${esc(stage(c)==="relance"||stage(c)==="contacte"?todoKind(c):c.next.label)}</div>`;
  const right=board(c)==="pipe"&&c.montant?`<div class="k">Budget</div><span class="pc-pill">${eur(c.montant)}</span>`:`<div class="k">${lvl}</div><span class="pc-dots">${[1,2,3,4,5].map(i=>`<i class="${i<=on?"on":""}"></i>`).join("")}</span>`;
  return`<div class="pc" draggable="true" data-card="${c.id}" data-open="${c.id}">
    <div class="pc-body">
      ${av(c)}
      <div class="pc-name">${esc(n.title)}</div>
      <div class="pc-sub">${esc(n.sub||" ")}</div>
      ${next}
      <div class="pc-foot"><div><div class="k">Canal</div><span class="pc-pill">${esc(CANAUX[c.canal]||"—")}</span></div><div class="r">${right}</div></div>
    </div>
    <button class="pc-go" data-open="${c.id}" aria-label="Ouvrir la fiche">↗</button>
  </div>`;
}

/* ───────── CONTACTS ───────── */
function vContacts(){
  const list=filtered();const {k,dir}=S.sort;
  const val={prio:priorite,studio:c=>(c.studio||c.nom||"").toLowerCase(),next:c=>c.next&&c.next.date||"9999",last:c=>lastContact(c)||"0000"}[k]||priorite;
  list.sort((a,b)=>{const x=val(a),y=val(b);return(x>y?1:x<y?-1:0)*dir});
  const th=(key,l)=>`<th data-sort="${key}">${l}${k===key?(dir>0?" ↑":" ↓"):""}</th>`;
  return head("Contacts",`${S.contacts.length} fiches · triées par ${k==="prio"?"priorité":"colonne"}`,`<button class="btn primary" data-act="new">+ Nouveau contact</button>`)
   +toolbar()
   +`<div class="table-wrap"><table><thead><tr><th>Nom</th>${th("studio","Entreprise / studio")}<th>Type</th><th>Température</th>${th("last","Dernier contact")}${th("next","Prochain contact")}<th>Raison</th><th>Canal</th><th>Angle / besoin</th><th>Statut</th></tr></thead><tbody>
   ${list.map(c=>`<tr data-open="${c.id}"><td><span class="nm"><i class="dot" style="--c:var(${colorOf(c)})"></i>${esc(splitName(c).title)}</span></td>
     <td><b style="font-weight:500">${esc(c.studio||"—")}</b>${c.exemple?' <span style="color:var(--faint);font-size:11px">exemple</span>':""}</td>
     <td>${esc(CIBLES[c.cible]||"—")}</td><td>${temp(c)}</td><td>${ago(lastContact(c))}</td>
     <td class="${isLate(c)?"late":""}">${c.next&&c.next.date?rel(c.next.date):"—"}</td><td>${esc(c.next&&c.next.label||"—")}</td>
     <td>${esc(CANAUX[c.canal]||"—")}</td><td>${esc(ANGLES[c.angle]||c.besoin||"—")}</td><td>${tag(c)}</td></tr>`).join("")
     ||`<tr><td colspan="10" class="empty" style="padding:24px 14px">Aucun contact ne correspond à ces filtres.</td></tr>`}
   </tbody></table></div>`;
}

/* ───────── PROJETS ───────── */
function vProjets(){
  const col=s=>{const ps=S.projets.filter(p=>p.stage===s.k);const tot=ps.reduce((a,p)=>a+(+p.montant||0),0);
    return`<div class="col" data-pdrop="${s.k}">${colHead({...s,d:eur(tot)},ps.length)}

function parseTable(txt){
  txt=txt.replace(/^﻿/,"");const first=txt.split(/\r?\n/)[0]||"";
  const sep=first.includes("\t")?"\t":(first.split(";").length>first.split(",").length?";":",");
  const rows=[];let cur=[""],q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur[cur.length-1]+='"';i++}else q=false}else cur[cur.length-1]+=ch}
    else if(ch==='"')q=true;else if(ch===sep)cur.push("");else if(ch==="\n"){rows.push(cur);cur=[""]}else if(ch!=="\r")cur[cur.length-1]+=ch}
  rows.push(cur);return rows.filter(r=>r.some(c=>c.trim()));
}
const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
function parseDate(s){s=(s||"").trim();if(!s)return"";let m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if(m){let y=+m[3];if(y<100)y+=2000;return y+"-"+pad(+m[2])+"-"+pad(+m[1])}m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:""}
const EU=["royaume","uk","london","londres","allemagne","germany","berlin","italie","italy","milan","espagne","spain","madrid","barcelon","belgique","belgium","bruxelles","suisse","switzerland","geneve","zurich","pays-bas","netherlands","amsterdam","portugal","lisbonne","danemark","copenhag","suede","stockholm","autriche","vienne","irlande","dublin","europe"];
const FR=["france","paris","lyon","marseille","bordeaux","lille","nantes","toulouse","nice","rennes","strasbourg","montpellier"];
function guessZone(loc){const l=norm(loc);if(!l)return"";if(FR.some(w=>l.includes(w)))return"fr";if(EU.some(w=>l.includes(w)))return"eu";return"intl"}
function guessUnivers(s,def){const l=norm(s);if(/graph/.test(l))return"graphisme";if(/hosp|hotel|restau|experien|event/.test(l))return"hospitalite";if(/\bda\b|direction|artist|campagn/.test(l))return"da";if(/b2c|particulier|direct/.test(l))return"b2c";return def}
function buildImport(txt){
  const rows=parseTable(txt);if(rows.length<2)return null;
  const h=rows[0].map(norm);
  const find=(...keys)=>h.findIndex(x=>keys.some(k=>x.includes(k)));
  const ix={loc:find("locali","ville","pays","lieu"),studio:find("studio","client","nom","agence","entreprise"),dom:find("domaine","activite","secteur"),stat:find("statut","status","etat"),mail:find("mail"),note:find("note","info","reco")};
  const dateCols=h.map((x,i)=>/date|mail \d|relance/.test(x)&&i!==ix.mail?i:-1).filter(i=>i>=0);
  const contactIx=h.findIndex((x,i)=>i!==ix.studio&&/(contact|prenom|personne|interlocut)/.test(x));
  const defU=document.getElementById("i-univers").value,defC=document.getElementById("i-cible").value,defZ=document.getElementById("i-zone").value,defK=document.getElementById("i-canal").value;
  const out=rows.slice(1).map(r=>{
    const g=i=>i>=0?(r[i]||"").trim():"";
    const dates=dateCols.map(i=>parseDate(r[i])).filter(Boolean).sort();
    const st=norm(g(ix.stat));
    const c={id:uid(),studio:g(ix.studio),nom:contactIx>=0?g(contactIx):"",email:g(ix.mail),localisation:g(ix.loc),notes:g(ix.note),canal:defK,
      univers:guessUnivers(g(ix.dom),defU),cible:defC,zone:defZ==="auto"?(guessZone(g(ix.loc))||"fr"):defZ,potentiel:0,angle:"",relances:dates.length,hist:[],cree:today()};
    if(/reco/.test(norm(c.notes)))c.potentiel=2;
    dates.forEach((d,i)=>c.hist.unshift({d,t:i===0?"Premier message envoyé":"Relance "+i+" envoyée"}));
    const last=dates[dates.length-1];
    if(/repon|repondu/.test(st)){c.stage="repondu";c.converti=today();c.next={date:today(),label:"Qualifier : besoin, timing, décideurs"}}
    else if(!dates.length&&!/envoy|relanc/.test(st)){c.stage="a_contacter";c.next={date:today(),label:"Envoyer le premier message"};c.relances=0}
    else{const n=Math.max(1,dates.length);c.relances=n;const r=rythme(c,n,last||today());c.stage=r.stage;c.next=r.next;
      if(/a relancer/.test(st)&&r.stage!=="sommeil"){c.stage="relance";c.next={date:today(),label:"Relance "+n}}}
    return c;
  }).filter(c=>c.studio||c.email);
  return{cols:ix,dateCols:dateCols.length,list:out};
}
const isDupe=c=>S.contacts.some(x=>(c.email&&x.email&&x.email.toLowerCase()===c.email.toLowerCase())||(x.studio&&c.studio&&norm(x.studio)===norm(c.studio)));

    return}
  if(S.openP){const p=S.openP==="new"?S.draftP:S.projets.find(x=>x.id===S.openP);if(!p){S.openP=null;L.innerHTML="";L.dataset.k="";return}
    if(L.dataset.k!=="p"+S.openP){L.innerHTML=drawerProjet(p,S.openP==="new");L.dataset.k="p"+S.openP}return}
  L.innerHTML="";L.dataset.k="";
}
const closeLayer=()=>{S.open=null;S.openP=null;renderLayer()};

/* ───────── Interactions ───────── */
document.addEventListener("click",async e=>{
  const t=e.target;
  if(t.closest("[data-close]")){closeLayer();return}
  const star=t.closest("[data-star]");if(star){const n=+star.dataset.star,cur=document.querySelectorAll("#c-pot .on").length;const v=cur===n?n-1:n;document.querySelectorAll("#c-pot button").forEach((b,i)=>b.classList.toggle("on",i<v));return}
  const svc=t.closest("[data-svc]");if(svc){svc.classList.toggle("primary");return}
  const tp=t.closest("[data-temp]");if(tp){S.home.temp=tp.dataset.temp;render();return}
  const hz=t.closest("[data-horizon]");if(hz){S.home.horizon=+hz.dataset.horizon;S.home.day="";render();return}
  const dy=t.closest("[data-day]");if(dy){S.home.day=S.home.day===dy.dataset.day?"":dy.dataset.day;render();return}
  const gt=t.closest("[data-goto]");if(gt){go(gt.dataset.goto);return}
  const gtt=t.closest("[data-goto-temp]");if(gtt){S.filters.temp=gtt.dataset.gotoTemp;go("contacts");return}
  const ev=t.closest("[data-ev]");if(ev){const c=S.contacts.find(x=>x.id===ev.dataset.id);if(c)await runEvent(c,ev.dataset.ev);return}
  const sn=t.closest("[data-snooze]");if(sn){const c=S.contacts.find(x=>x.id===sn.dataset.snooze);if(c&&c.next){await save("contacts",c.id,{next:{...c.next,date:addDays(c.next.date<today()?today():c.next.date,3)}});toast("Reporté de 3 jours")}return}
  const op=t.closest("[data-open]");if(op&&!t.closest("a,button:not([data-open])")){S.open=op.dataset.open;S.openP=null;renderLayer();return}
  const opp=t.closest("[data-openp]");if(opp){S.openP=opp.dataset.openp;S.open=null;renderLayer();return}
  const so=t.closest("[data-sort]");if(so){const k=so.dataset.sort;S.sort=S.sort.k===k?{k,dir:-S.sort.dir}:{k,dir:k==="studio"||k==="next"?1:-1};render();return}
  const a=t.closest("[data-act]");if(!a)return;
  switch(a.dataset.act){
    case"new":S.draft={univers:"da",cible:"studio",zone:"fr",canal:"email",potentiel:0,stage:"a_contacter"};S.open="new";renderLayer();break;
    case"new-pipe":S.draft={univers:"da",cible:"studio",zone:"fr",canal:"email",potentiel:2,stage:"repondu"};S.open="new";renderLayer();break;
    case"newp":S.draftP={stage:"production",univers:"da",services:[]};S.openP="new";renderLayer();break;
    case"save-c":await saveContact();break;
    case"del-c":if(a.dataset.sure){await del("contacts",S.open);closeLayer();toast("Fiche supprimée")}else{a.dataset.sure=1;a.textContent="Confirmer la suppression"}break;
    case"save-p":await saveProjet();break;
    case"del-p":if(a.dataset.sure){await del("projets",S.openP);closeLayer();toast("Projet supprimé")}else{a.dataset.sure=1;a.textContent="Confirmer la suppression"}break;
    case"do-import":a.disabled=true;await doImport();break;
    case"cancel-import":IMP=null;document.getElementById("i-preview").innerHTML="";document.getElementById("i-paste").value="";break;
    case"clear-ex":if(a.dataset.sure){a.disabled=true;for(const c of S.contacts.filter(x=>x.exemple))await del("contacts",c.id);for(const p of S.projets.filter(x=>x.exemple))await del("projets",p.id);toast("Exemples supprimés")}else{a.dataset.sure=1;a.textContent="Confirmer : supprimer les exemples"}break;
  }
});
async function runEvent(c,ev){
  const opts={};const nd=document.getElementById("c-nextdate");
  if((ev==="reactiver"||ev==="sommeil")&&nd&&nd.value&&nd.value>today())opts.date=nd.value;
  const p=appliquer(c,ev,opts);
  if(ev==="reactiver"){const ar=document.getElementById("c-angleReact");if(ar&&ar.value.trim()){p.angleReact=ar.value.trim();p.next.label="Réactiver · "+p.angleReact}}
  if(await save("contacts",c.id,p)){
    if(ev==="signe"){const id=uid();await save("projets",id,{titre:"Projet "+(c.studio||c.nom||""),client:c.studio||c.nom||"",contactId:c.id,univers:c.univers||"da",montant:+c.montant||0,stage:"production",services:[],cree:today(),exemple:!!c.exemple},true);toast("Bravo ! Le projet est créé dans « Projets ».")}
    else if(ev==="perdu"){S.open=c.id;S.openP=null;document.getElementById("layer").dataset.k="";renderLayer();toast("Notez la raison dans la fiche");setTimeout(()=>{const r=document.getElementById("c-raison");if(r)r.focus()},80)}
    else if(ev==="repondu")toast("Converti : la carte passe dans le Pipeline");
    else toast(p.next?"Prochain contact : "+rel(p.next.date).toLowerCase():"Enregistré");
  }
}
function readContactForm(){
  const v=id=>(document.getElementById(id)||{}).value??"";
  const f={studio:v("c-studio").trim(),nom:v("c-nom").trim(),email:v("c-email").trim(),localisation:v("c-localisation").trim(),univers:v("c-univers"),cible:v("c-cible"),zone:v("c-zone"),angle:v("c-angle"),
    canal:v("c-canal"),besoin:v("c-besoin").trim(),angleReact:v("c-angleReact").trim(),potentiel:document.querySelectorAll("#c-pot .on").length,montant:+v("c-montant")||0,notes:v("c-notes")};
  if(document.getElementById("c-raison")){f.raison=v("c-raison");f.raisonNote=v("c-raisonNote").trim()}
  return f;
}
async function saveContact(){
  const f=readContactForm();
  if(!f.studio&&!f.nom){toast("Indiquez au moins un nom ou une structure.");return}
  if(S.open==="new"){const id=uid(),st=S.draft.stage||"a_contacter";
    const body={...f,stage:st,relances:st==="repondu"?1:0,next:st==="repondu"?{date:addDays(today(),3),label:"Qualifier : besoin, timing, décideurs"}:{date:today(),label:"Envoyer le premier message"},hist:[{d:today(),t:"Fiche créée"}],cree:today(),maj:today()};
    if(st==="repondu")body.converti=today();
    if(await save("contacts",id,body,true)){toast("Contact créé");S.open=id;document.getElementById("layer").dataset.k=""}}
  else{const c=S.contacts.find(x=>x.id===S.open);
    const nd=(document.getElementById("c-reprise")||{}).value||(document.getElementById("c-nextdate")||{}).value;
    const patch={...f,maj:today()};if(nd&&c&&(!c.next||c.next.date!==nd))patch.next={label:(c.next&&c.next.label)||"Relance",date:nd};
    if(await save("contacts",S.open,patch)){toast("Enregistré");closeLayer()}}
}
async function saveProjet(){
  const v=id=>(document.getElementById(id)||{}).value??"";
  const body={titre:v("p-titre").trim(),client:v("p-client").trim(),univers:v("p-univers"),montant:+v("p-montant")||0,stage:v("p-stage"),facture:v("p-facture"),paye:v("p-paye"),notes:v("p-notes"),
    services:[...document.querySelectorAll("#p-services .primary")].map(b=>b.dataset.svc)};
  if(body.stage==="facture"&&!body.facture)body.facture=today();
  if(body.stage==="paye"&&!body.paye)body.paye=today();
  if(!body.titre){toast("Donnez un nom au projet.");return}
  const isNew=S.openP==="new",id=isNew?uid():S.openP;
  if(await save("projets",id,isNew?{...body,cree:today()}:body,isNew)){toast(isNew?"Projet créé":"Enregistré");closeLayer()}
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(S.open||S.openP))closeLayer()});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id&&id.startsWith("f-")){S.filters[id.slice(2)]=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById(id);if(el){el.focus();if(id==="f-q"&&pos!=null)el.setSelectionRange(pos,pos)}}
  if(id==="i-paste"){clearTimeout(window._pt);window._pt=setTimeout(()=>{if(e.target.value.trim())showPreview(e.target.value)},400)}
});
document.addEventListener("change",e=>{
  if(e.target.id==="h-since"){S.home.since=+e.target.value;S.home.day="";render();return}
  if(e.target.id==="i-file"&&e.target.files[0])readFile(e.target.files[0]);
  if(["i-univers","i-cible","i-zone","i-canal"].includes(e.target.id)){const p=document.getElementById("i-paste");if(window._lastTxt||p.value)showPreview(window._lastTxt||p.value)}
});
function readFile(f){const r=new FileReader();r.onload=()=>{window._lastTxt=r.result;showPreview(r.result)};r.readAsText(f)}

let dragId=null,dragP=false;
document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest("[data-card],[data-pcard]");if(!c)return;dragP=!!c.dataset.pcard;dragId=c.dataset.card||c.dataset.pcard;c.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId)}catch(_){}});
document.addEventListener("dragend",()=>{document.querySelectorAll(".dragging,.over").forEach(x=>x.classList.remove("dragging","over"))});
document.addEventListener("dragover",e=>{
  const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.add("over");return}
  const col=e.target.closest&&e.target.closest(dragP?"[data-pdrop]":"[data-drop]");if(!col||!dragId)return;e.preventDefault();document.querySelectorAll(".over").forEach(x=>x!==col&&x.classList.remove("over"));col.classList.add("over")});
document.addEventListener("drop",async e=>{
  const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.remove("over");const f=e.dataTransfer.files[0];if(f)readFile(f);return}
  const col=e.target.closest&&e.target.closest(dragP?"[data-pdrop]":"[data-drop]");if(!col||!dragId)return;e.preventDefault();col.classList.remove("over");
  const id=dragId;dragId=null;
  if(dragP){const p=S.projets.find(x=>x.id===id),k=col.dataset.pdrop;if(!p||p.stage===k)return;const patch={stage:k};if(k==="facture"&&!p.facture)patch.facture=today();if(k==="paye"&&!p.paye)patch.paye=today();await save("projets",p.id,patch);toast((PSTAGES.find(s=>s.k===k)||{}).l)}
  else{const c=S.contacts.find(x=>x.id===id),k=col.dataset.drop;if(!c)return;if(k==="converti"&&board(c)==="pipe")return;if(stage(c)===k&&k!=="relance")return;await runEvent(c,DROP_EVENT[k])}
});

boot();
</script>
