<title>Atelier CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout : rail à gauche ; Dashboard en 3 couches ; 2 kanbans (contacts en prospection, opportunités en pipeline) ;
   Contact ↔ Account ↔ Opportunité ; Revenue forecast. Brun anthracite unique (celui des cartes) partout. */
:root{
  --bg:#E4E3E0; --block:#F6F5F3; --raised:#FFFFFF; --line:#D9D6D1; --line-soft:#E9E7E3;
  --fg:#1C1917; --muted:#77716B; --faint:#A8A29C;
  --brand:#3A3836; --brand-ink:#F3F1EE; --beige:#D6C6AE;
  --c-todo:#CFCCC7; --c-contact:#2F7BF5; --c-relance:#F08A3C; --c-sommeil:#6F6A65; --c-react:#8B6CF0; --c-conv:#18B26B;
  --c-rep:#2F7BF5; --c-qualif:#F2C230; --c-call:#F08A3C; --c-attente:#EC86A6; --c-nego:#E0604E; --c-signe:#18B26B; --c-perdu:#AAA49E;
  --late:#D0583A; --flame:#F08A3C;
  --card:#3A3836; --card-hover:#42403D; --card-fg:#F3F1EE; --card-muted:#ADA79F; --card-pill:#4B4946; --card-off:#56534F; --card-line:#5E5B57;
  --i1:#EE9AA0; --i2:#F1A96B; --i3:#F3D56C; --i4:#C9DD7E; --i5:#7BD08F;
  --shadow:0 18px 40px -24px rgba(28,25,23,.4);
  --f-title:"Instrument Serif",ui-serif,Georgia,"Times New Roman",serif;
  --f-ui:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-block:28px; --r-card:26px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121110; --block:#1C1A19; --raised:#252220; --line:#33302D; --line-soft:#2A2725;
  --fg:#EEEAE5; --muted:#9A938C; --faint:#6B655F;
  --brand:#45423F; --brand-ink:#F3F1EE; --beige:#7E6B55;
  --c-todo:#5E5A56; --c-contact:#4C8DFF; --c-relance:#F2934A; --c-sommeil:#8A847E; --c-react:#9A80F5; --c-conv:#2CC37C;
  --c-rep:#4C8DFF; --c-qualif:#F2C230; --c-call:#F2934A; --c-attente:#EE90AD; --c-nego:#E8705E; --c-signe:#2CC37C; --c-perdu:#77716B;
  --late:#E57858; --flame:#F2934A;
  --card:#2C2A28; --card-hover:#33312E; --card-fg:#F1EEEA; --card-muted:#A39D96; --card-pill:#3B3936; --card-off:#4A4744; --card-line:#4E4B48;
  --shadow:0 18px 40px -20px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121110; --block:#1C1A19; --raised:#252220; --line:#33302D; --line-soft:#2A2725;
  --fg:#EEEAE5; --muted:#9A938C; --faint:#6B655F;
  --brand:#45423F; --brand-ink:#F3F1EE; --beige:#7E6B55;
  --c-todo:#5E5A56; --c-contact:#4C8DFF; --c-relance:#F2934A; --c-sommeil:#8A847E; --c-react:#9A80F5; --c-conv:#2CC37C;
  --c-rep:#4C8DFF; --c-qualif:#F2C230; --c-call:#F2934A; --c-attente:#EE90AD; --c-nego:#E8705E; --c-signe:#2CC37C; --c-perdu:#77716B;
  --late:#E57858; --flame:#F2934A;
  --card:#2C2A28; --card-hover:#33312E; --card-fg:#F1EEEA; --card-muted:#A39D96; --card-pill:#3B3936; --card-off:#4A4744; --card-line:#4E4B48;
  --shadow:0 18px 40px -20px rgba(0,0,0,.7);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
a{color:inherit}
.serif{font-family:var(--f-title);font-weight:400}
.label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.late{color:var(--late)}
.muted{color:var(--muted)}

.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--faint));flex:none;display:inline-block}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 20%,var(--raised));font-size:12px;white-space:nowrap;color:var(--fg)}
.tag .dot{width:7px;height:7px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);font-size:11.5px;color:var(--muted);white-space:nowrap;background:none}
button.pill[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.temp{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}
.temp span{display:inline-flex;gap:3px;padding:3px 5px;border:1px solid var(--line);border-radius:999px}
.temp i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.temp i.on{background:var(--brand)}

.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:30px;padding:28px 14px 22px max(18px,env(safe-area-inset-left,0px))}
.brand{display:flex;flex-direction:column;gap:2px;padding-left:8px}
.brand b{font-family:var(--f-title);font-weight:400;font-size:30px;line-height:1}
.brand span{font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:none;text-align:left;padding:9px 14px;border-radius:999px;color:var(--muted);font-size:13.5px}
.nav button:hover{color:var(--fg);background:var(--block)}
.nav button[aria-current="page"]{color:var(--brand-ink);background:var(--brand)}
.nav .count{font-size:11px;min-width:20px;text-align:center;padding:1px 7px;border-radius:10px;background:var(--late);color:#fff}
.nav .count:empty{display:none}
.rail-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-left:8px}
.jn{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.jn button{border:0;background:none;width:22px;height:22px;border-radius:50%;font-size:10.5px;font-weight:600;color:var(--faint);padding:0}
.jn button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.sync{font-size:10.5px;color:var(--faint);display:flex;align-items:center;gap:5px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.sync.on i{background:var(--c-signe)}

main{min-width:0;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px),clamp(16px,2.4vw,32px));padding-right:max(16px,env(safe-area-inset-right,0px),clamp(16px,3vw,40px))}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{margin:0;font-family:var(--f-title);font-weight:400;font-size:clamp(40px,5vw,62px);letter-spacing:-.015em;line-height:.95}
.head h1 em,.b-h h2 em{font-style:italic}
.head p{margin:10px 0 0;color:var(--muted)}
.hello{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
.quote{max-width:420px;font-family:var(--f-title);font-style:italic;font-size:20px;line-height:1.2;color:var(--muted);padding-left:18px;border-left:1px solid var(--line);margin-bottom:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raised);padding:9px 16px;border-radius:999px;font-size:13px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{background:none}
.btn.sm{padding:5px 11px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:default}
.round{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--raised);font-size:16px;text-decoration:none;flex:none}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.block{background:var(--block);border-radius:var(--r-block);padding:22px 24px;min-width:0;display:flex;flex-direction:column;gap:16px;position:relative}
.b-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.b-h h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:32px;letter-spacing:-.01em;line-height:1}
.b-h p{margin:6px 0 0;color:var(--muted);font-size:12.5px}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}

/* Encoche (carte de référence) */
.notched{position:relative}
.notched>.nt,.notched>.fa,.notched>.fb{position:absolute;pointer-events:none;z-index:1}
.notched>.nt{top:0;right:0;width:66px;height:66px;background:var(--nbg);border-bottom-left-radius:33px}
.notched>.fa{top:0;right:66px;width:20px;height:20px;background:radial-gradient(circle at 0 100%,transparent 19.5px,var(--nbg) 20px)}
.notched>.fb{top:66px;right:0;width:20px;height:20px;background:radial-gradient(circle at 0 100%,transparent 19.5px,var(--nbg) 20px)}
.notched>.go{position:absolute;top:9px;right:9px;width:48px;height:48px;border-radius:50%;border:1px solid color-mix(in srgb,var(--fg) 22%,transparent);background:transparent;color:var(--fg);display:grid;place-items:center;font-size:17px;text-decoration:none;z-index:2}
.notched>.go:hover{background:var(--raised)}

/* Dashboard · couche 1 */
.game{display:grid;grid-template-columns:auto minmax(0,1fr) 250px;gap:28px;align-items:center;background:var(--brand);color:var(--brand-ink);border-radius:var(--r-block);padding:24px 28px;margin-bottom:14px}
.game .label{color:var(--brand-ink);opacity:.7}
.ring{position:relative;width:140px;height:140px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .in b{font-family:var(--f-title);font-weight:400;font-size:44px;line-height:.9;display:block}
.ring .in small{display:block;font-size:10.5px;line-height:1.25;opacity:.75;margin-top:4px}
.goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 26px}
.goal{display:flex;flex-direction:column;gap:7px;min-width:0}
.goal .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.goal .top span{font-size:12.5px;opacity:.85}
.goal .top b{font-family:var(--f-title);font-weight:400;font-size:26px;line-height:1}
.goal .top b small{font-family:var(--f-ui);font-size:12px;opacity:.6}
.chunk{height:14px;border-radius:999px;background:color-mix(in srgb,var(--brand-ink) 16%,transparent);overflow:hidden;position:relative}
.chunk i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),inset 0 3px 0 rgba(255,255,255,.3)}
.goal.done .top b::after{content:" ✓";font-family:var(--f-ui);font-size:14px;color:var(--c-conv)}
.goal input{width:70px;background:transparent;border:1px solid color-mix(in srgb,var(--brand-ink) 40%,transparent);border-radius:999px;padding:2px 8px;color:var(--brand-ink);font-size:12px;text-align:center}
.streak{display:flex;flex-direction:column;gap:12px;padding-left:24px;border-left:1px solid color-mix(in srgb,var(--brand-ink) 18%,transparent)}
.streak .row1{display:flex;align-items:center;gap:10px}
.streak .row1 svg{width:34px;height:34px;flex:none}
.streak .row1 b{font-family:var(--f-title);font-weight:400;font-size:40px;line-height:.9}
.streak .row1 small{display:block;font-size:12px;opacity:.75}
.week{display:flex;gap:6px}
.week span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;background:color-mix(in srgb,var(--brand-ink) 12%,transparent)}
.week span.on{background:var(--flame);color:#fff}
.week span.today{box-shadow:0 0 0 2px var(--brand),0 0 0 3.5px var(--brand-ink)}
.xp{display:flex;align-items:baseline;gap:8px;font-size:12.5px}
.xp b{font-family:var(--f-title);font-weight:400;font-size:24px}
.gbtn{background:none;border:1px solid color-mix(in srgb,var(--brand-ink) 30%,transparent);color:var(--brand-ink);border-radius:999px;padding:4px 11px;font-size:11.5px}

/* Dashboard · couche 2 */
.quests{display:flex;flex-direction:column;gap:8px}
.q{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--raised);border-radius:22px;padding:12px;transition:opacity .3s,transform .3s}
.q.gone{opacity:0;transform:translateX(16px)}
.q .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-size:13px;font-weight:600}
.q .ic.is-late{box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--late)}
.q .who{min-width:0;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.q .who b{font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q .who small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q .ops{display:flex;gap:6px;align-items:center}
.xpb{font-size:11px;font-weight:600;color:var(--fg);background:var(--line-soft);padding:3px 8px;border-radius:999px;white-space:nowrap}
.done-btn{border:0;background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:500;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.done-btn:active{transform:translateY(1px);box-shadow:none}
.qsum{display:flex;gap:8px;flex-wrap:wrap}
.qsum span{display:inline-flex;align-items:center;gap:6px;background:var(--raised);border-radius:999px;padding:5px 12px;font-size:12.5px}
.qsum b{font-weight:600;font-size:13px;line-height:1}
.qprog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.qprog .chunk{flex:1;height:10px;background:var(--line-soft)}
.cheer{display:flex;align-items:center;gap:14px;padding:18px;background:var(--raised);border-radius:22px}
.cheer b{font-family:var(--f-title);font-weight:400;font-size:24px}
.empty{padding:18px 4px;color:var(--muted);font-size:13px}
.empty b{color:var(--fg);font-weight:500}

/* Dashboard · couche 3 */
.stack{display:flex;height:16px;border-radius:999px;overflow:hidden;gap:2px;background:var(--line-soft)}
.stack i{background:var(--c);min-width:4px}
.stack-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.stack-leg span{display:inline-flex;align-items:center;gap:6px}
.stack-leg b{color:var(--fg);font-weight:500}
.boards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bcard{background:var(--raised);border-radius:22px;padding:16px 18px 18px;text-decoration:none;display:flex;flex-direction:column;gap:6px;--nbg:var(--block)}
.bcard:hover{box-shadow:var(--shadow)}
.bcard b{font-family:var(--f-title);font-weight:400;font-size:26px;line-height:1;padding-right:60px}
.bcard small{color:var(--muted);font-size:12.5px}
.bcard .dots{display:flex;gap:4px;margin-top:6px}
.bcard .dots i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.tl-wrap{overflow-x:auto}
.tl{display:grid;gap:3px;min-width:720px;font-size:11.5px}
.tl .hd{color:var(--muted);text-align:center;font-size:10.5px;padding-bottom:4px;line-height:1.2}
.tl .hd b{display:block;font-family:var(--f-title);font-weight:400;font-size:16px;color:var(--fg)}
.tl .hd.we{opacity:.5}.tl .hd.today b{text-decoration:underline;text-underline-offset:4px}
.tl .lb{display:flex;align-items:center;gap:7px;font-size:12.5px;padding-right:8px;white-space:nowrap}
.tl .cell{min-height:34px;background:var(--raised);border-radius:10px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:3px;padding:4px 2px}
.tl .cell.we{background:color-mix(in srgb,var(--raised) 45%,transparent)}
.tl .cell.lt{background:color-mix(in srgb,var(--late) 14%,var(--raised))}
.tl .cell button{width:11px;height:11px;border-radius:50%;border:0;padding:0;background:var(--c)}
.tl .cell button.is-late{box-shadow:0 0 0 2px var(--late)}
.tl .cell em{font-style:normal;font-size:10px;color:var(--muted)}
.warn{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.chipw{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--late);color:var(--fg);background:none;border-radius:999px;padding:5px 12px;font-size:12px}
.seg-f{display:inline-flex;background:var(--raised);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg-f button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:12.5px;color:var(--muted)}
.seg-f button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}

/* Tables & filtres */
.ctl select,.toolbar select,.toolbar input,.field input,.field select,.field textarea{background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12.5px;min-width:0}
.field textarea{border-radius:16px}
.table-wrap{overflow-x:auto;border-radius:20px;background:var(--raised)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-weight:500;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap;user-select:none}
th[data-sort]{cursor:pointer}
td{padding:11px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--block)}
tbody tr:last-child td{border-bottom:0}
td .nm{display:flex;align-items:center;gap:8px;font-weight:500}
.lnk{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);font:inherit;color:inherit;cursor:pointer}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type="search"]{flex:1 1 200px;max-width:320px}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.tags .label{margin-right:4px}

/* Kanban */
.board-wrap{overflow-x:auto;margin-inline:-4px;padding:0 4px 12px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:300px;gap:12px;min-height:460px;align-items:start}
.col{display:flex;flex-direction:column;gap:10px;background:var(--block);border-radius:var(--r-block);padding:14px 10px 12px;min-width:0;min-height:300px}
.col.over{box-shadow:inset 0 0 0 2px var(--brand)}
.col.archive{background:transparent;border:1.5px dashed var(--line)}
.col-h{display:flex;flex-direction:column;gap:4px;padding:2px 8px 6px}
.col-h .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.col-h span{font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:8px}
.col-h em{font-style:normal;font-size:11.5px;color:var(--muted);background:var(--raised);padding:1px 9px;border-radius:999px}
.col-h small{color:var(--muted);font-size:11.5px;line-height:1.35;min-height:2.7em}
.col-bar{height:3px;border-radius:2px;background:var(--c);margin:2px 8px 4px}
.pc{--nbg:var(--block);cursor:grab}
.pc.dragging{opacity:.4}
.pc-body{background:var(--card);color:var(--card-fg);border-radius:var(--r-card);padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px;transition:background .15s}
.pc:hover .pc-body{background:var(--card-hover)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--c,var(--c-todo));color:#fff;font-size:12.5px;font-weight:600;letter-spacing:.02em;flex:none;text-shadow:0 1px 1px rgba(0,0,0,.15)}
.av.is-late{box-shadow:0 0 0 2px var(--raised),0 0 0 4px var(--late)}
.av.sm{width:30px;height:30px;font-size:10.5px}
.pc .av{width:54px;height:54px;font-size:15px}
.pc .av.is-late{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--late)}
.pc-name{font-family:var(--f-title);font-size:30px;line-height:1;margin-top:8px;overflow-wrap:anywhere}
.pc-sub{font-size:13px;color:var(--card-muted);line-height:1.35;margin-top:-6px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.pc-sib{border:1px solid var(--card-line);background:none;color:var(--card-fg);border-radius:999px;padding:1px 8px;font-size:11px}
.pc-val{font-family:var(--f-title);font-size:24px;line-height:1;color:var(--card-fg);margin-top:-4px}
.pc-val small{font-family:var(--f-ui);font-size:12px;color:var(--card-muted)}
.pc-next{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--card-fg);opacity:.9}
.pc-next.late{color:var(--late);opacity:1}
.pc-next .dot{width:6px;height:6px}
.pc-foot{display:grid;grid-template-columns:auto auto;justify-content:space-between;gap:12px;align-items:end;margin-top:2px}
.pc-foot .k{font-size:11.5px;color:var(--card-muted);margin-bottom:6px}
.pc-foot .r{text-align:right}
.pc-pill{display:inline-flex;align-items:center;background:var(--card-pill);color:var(--card-fg);border-radius:999px;padding:6px 14px;font-size:12px}
.pc-dots{display:inline-flex;gap:4px;padding:5px 7px;border:1px solid var(--card-line);border-radius:999px}
.pc-dots i{width:11px;height:11px;border-radius:50%;background:var(--card-off)}
.pc-dots i.on:nth-child(1){background:var(--i1)}.pc-dots i.on:nth-child(2){background:var(--i2)}.pc-dots i.on:nth-child(3){background:var(--i3)}.pc-dots i.on:nth-child(4){background:var(--i4)}.pc-dots i.on:nth-child(5){background:var(--i5)}
.arch{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;background:var(--block);cursor:pointer;font-size:12.5px;min-width:0}
.arch b{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arch small{color:var(--muted);white-space:nowrap}

/* Accounts */
.accts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.acct{background:var(--block);border-radius:var(--r-card);padding:18px;display:flex;flex-direction:column;gap:12px;cursor:pointer;--nbg:var(--bg);min-width:0}
.acct:hover{background:var(--raised)}
.acct h3{margin:0;font-family:var(--f-title);font-weight:400;font-size:28px;line-height:1;padding-right:62px;overflow-wrap:anywhere}
.acct .meta{font-size:12.5px;color:var(--muted);margin-top:-6px}
.acct .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px}
.acct .val{font-family:var(--f-title);font-size:26px;line-height:1}
.avs{display:flex}
.avs .av{margin-left:-8px;box-shadow:0 0 0 2px var(--block)}
.avs .av:first-child{margin-left:0}
.alert{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;background:color-mix(in srgb,var(--c-qualif) 22%,var(--raised));border-radius:16px;padding:10px 12px}
.crow{display:grid;grid-template-columns:auto minmax(0,1.3fr) minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--raised);border-radius:18px;padding:10px 12px;cursor:pointer}
.crow .who b{font-weight:500;display:block}
.crow .who small,.crow .st small{color:var(--muted);font-size:12px;display:block}
.crow .st{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.crow .v{font-family:var(--f-title);font-size:20px;white-space:nowrap}
.star{border:0;background:none;font-size:18px;color:var(--line);padding:4px}
.star.on{color:var(--flame)}
.hint{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hint .lnk{color:var(--fg)}

/* Forecast */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi{background:var(--block);border-radius:var(--r-block);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.kpi .v{font-family:var(--f-title);font-size:46px;line-height:.85}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hero{background:var(--brand);color:var(--brand-ink)}
.kpi.hero .label,.kpi.hero .s{color:var(--brand-ink);opacity:.72}
.gauge{position:relative;height:30px;border-radius:999px;background:var(--line-soft);overflow:visible;display:flex}
.gauge i{height:100%;background:var(--c)}
.gauge i:first-child{border-radius:999px 0 0 999px}
.gauge .target{position:absolute;top:-8px;bottom:-8px;width:2px;background:var(--fg)}
.gauge .target span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;color:var(--fg)}
.gleg{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.gleg span{display:inline-flex;align-items:center;gap:6px}
.gleg b{color:var(--fg);font-weight:500}
.funnel{display:flex;flex-direction:column;gap:12px}
.fstep{display:grid;grid-template-columns:190px minmax(0,1fr) 70px;gap:14px;align-items:center;font-size:12.5px}
.fstep .track{height:12px;border-radius:999px;background:var(--raised);position:relative}
.fstep .track i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--c)}
.fstep .track u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);opacity:.5}
.fstep .n{font-family:var(--f-title);font-size:22px;text-align:right}
.fstep small{display:block;color:var(--muted);font-size:11.5px}
.levers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lever{background:var(--raised);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px}
.lever h3{margin:0;font-family:var(--f-title);font-weight:400;font-size:26px;line-height:1}
.lever p{margin:0;font-size:13px;line-height:1.45}
.lever small{color:var(--muted);font-size:12px}
.lever.top{background:var(--brand);color:var(--brand-ink)}
.lever.top small{color:var(--brand-ink);opacity:.75}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--c);color:#fff;align-self:flex-start}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 90px;gap:12px;align-items:center;font-size:12.5px}
.bar .track{height:12px;background:var(--raised);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;background:var(--c,var(--brand));border-radius:999px}
.bar .n{font-family:var(--f-title);font-size:18px;text-align:right}
.mcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:end;height:250px;position:relative}
.mcols .c{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.mcols .st{width:min(64px,70%);display:flex;flex-direction:column-reverse;border-radius:12px 12px 4px 4px;overflow:hidden;min-height:2px}
.mcols .st i{display:block;background:var(--c)}
.mcols .c span{font-size:12px;color:var(--muted);text-align:center;height:34px;line-height:1.4}
.mcols .c b{font-family:var(--f-title);font-weight:400;font-size:18px}
.mline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--fg);opacity:.45}
.mline span{position:absolute;right:0;top:-18px;font-size:11px}
.data-note{font-size:12px;color:var(--muted);background:var(--raised);border-radius:999px;padding:6px 12px;align-self:flex-start}

/* Projets */
.pcard{background:var(--raised);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:grab;border-left:4px solid var(--c)}
.pcard b{font-family:var(--f-title);font-weight:400;font-size:22px;line-height:1.05}
.pcard small{font-size:11.5px;color:var(--muted)}
.pcard .line{display:flex;justify-content:space-between;align-items:center;gap:6px}

/* Tiroirs */
.scrim{position:fixed;inset:0;background:rgba(18,16,14,.3);backdrop-filter:blur(3px);z-index:40}
.drawer{position:fixed;top:8px;right:8px;bottom:8px;width:min(600px,calc(100% - 16px));background:var(--block);border-radius:var(--r-block);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);margin-top:env(safe-area-inset-top,0px);margin-bottom:env(safe-area-inset-bottom,0px);margin-right:env(safe-area-inset-right,0px);overflow:hidden}
.drawer.mini{width:min(440px,calc(100% - 16px));bottom:auto;max-height:calc(100% - 16px)}
.drawer-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:24px 24px 14px}
.drawer-h h2{margin:0;font-family:var(--f-title);font-weight:400;font-size:40px;line-height:.95}
.drawer-h .sub{margin:10px 0 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:12.5px}
.drawer-b{flex:1;overflow-y:auto;padding:8px 24px 28px;display:flex;flex-direction:column;gap:20px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field textarea{min-height:72px;resize:vertical}
details.more{background:var(--raised);border-radius:22px;padding:14px 18px}
details.more summary{cursor:pointer;font-size:13px;font-weight:500;list-style:none;display:flex;justify-content:space-between}
details.more summary::after{content:"+";color:var(--muted)}
details.more[open] summary::after{content:"–"}
details.more[open] summary{margin-bottom:14px}
details.more .field input,details.more .field select,details.more .field textarea{background:var(--block)}
.next{background:var(--raised);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.next .row{display:flex;gap:8px;flex-wrap:wrap}
.next .row input{flex:1 1 200px;background:var(--block);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12.5px;min-width:0}
.next .row input[type=date]{flex:0 0 auto}
.tip{font-size:12.5px;color:var(--muted);border-left:2px solid var(--beige);padding-left:10px}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.steps .btn .dot{width:7px;height:7px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.facts div{background:var(--raised);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.facts b{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.facts b.big{font-family:var(--f-title);font-weight:400;font-size:24px;line-height:1}
.lost{background:color-mix(in srgb,var(--c-perdu) 18%,var(--raised));border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.sibs{display:flex;flex-direction:column;gap:6px}
.sib{display:flex;align-items:center;gap:10px;background:var(--raised);border-radius:14px;padding:8px 10px;cursor:pointer;font-size:12.5px}
.sib b{font-weight:500}
.sib .grow{flex:1;min-width:0}
.hist{display:flex;flex-direction:column;border-left:1px solid var(--line);margin-left:4px}
.hist div{position:relative;padding:0 0 12px 16px;font-size:12.5px}
.hist div::before{content:"";position:absolute;left:-4px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--block);border:1px solid var(--muted)}
.hist time{font-size:11px;color:var(--muted);margin-right:8px}

.drop{border:1.5px dashed var(--line);border-radius:var(--r-block);padding:28px;text-align:center;color:var(--muted);background:var(--block)}
.drop.over{border-color:var(--brand);color:var(--fg)}
.steps-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:20px}
.steps-list div{background:var(--block);border-radius:22px;padding:16px 18px;font-size:13px;color:var(--muted)}
.steps-list b{display:block;color:var(--fg);font-weight:500;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.xp{background:var(--flame);color:#fff;font-weight:500}
.notice{background:var(--block);border-radius:999px;padding:8px 8px 8px 18px;font-size:12.5px;color:var(--muted);margin-bottom:14px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}

@media (max-width:1200px){.game{grid-template-columns:auto minmax(0,1fr)}.streak{grid-column:1/-1;border-left:0;padding-left:0;flex-direction:row;flex-wrap:wrap;align-items:center;gap:18px}.span-8,.span-7,.span-6,.span-5,.span-4{grid-column:span 12}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.levers{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));overflow-x:auto;background:var(--bg)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  .brand span,.sync{display:none}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap;padding:8px 12px}
  .rail-foot{margin:0 0 0 auto}
  .game{grid-template-columns:minmax(0,1fr);justify-items:start;padding:20px}
  .goals{grid-template-columns:minmax(0,1fr);width:100%}
  .form,.steps-list,.facts,.boards{grid-template-columns:minmax(0,1fr)}
  .q{grid-template-columns:auto minmax(0,1fr)}
  .q .ops{grid-column:1/-1;flex-wrap:wrap}
  .crow{grid-template-columns:auto minmax(0,1fr) auto}.crow .st{display:none}
  .bar{grid-template-columns:96px minmax(0,1fr) 70px}
  .fstep{grid-template-columns:110px minmax(0,1fr) 50px}
  .block{padding:18px}
  .board{grid-auto-columns:minmax(272px,86vw)}
  .kpis{grid-template-columns:minmax(0,1fr)}
  .quote{border-left:0;padding-left:0}
}
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:slide .24s cubic-bezier(.2,.8,.2,1)}
  @keyframes slide{from{transform:translateX(30px);opacity:.5}}
  .chunk i{transition:width .6s cubic-bezier(.2,.8,.2,1)}
}

/* ═════ Couche Soft UI : soft skeuomorphism, verre discret, modules organiques, onglets intégrés ═════ */
:root{--bg:#E3E2DE;--shell:#EEEDEA;--block:#F8F7F5;--raised:#FFFFFF;
  --glass:rgba(250,249,247,.62);--glass-line:rgba(255,255,255,.8);
  --sh:0 1px 0 rgba(255,255,255,.95) inset,0 16px 36px -18px rgba(52,40,30,.24),0 3px 8px -4px rgba(52,40,30,.08);
  --sh-sm:0 1px 0 rgba(255,255,255,.9) inset,0 6px 14px -8px rgba(52,40,30,.28),0 1px 2px rgba(52,40,30,.06);
  --sh-in:inset 0 2px 5px rgba(52,40,30,.10),inset 0 -1px 0 rgba(255,255,255,.9);
  --bg-art:radial-gradient(70vw 60vh at 92% -12%,rgba(214,198,174,.55),transparent 62%),radial-gradient(60vw 60vh at -8% 112%,rgba(58,56,54,.12),transparent 60%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F0E0D;--shell:#171615;--block:#1F1D1B;--raised:#282523;
  --glass:rgba(34,32,30,.6);--glass-line:rgba(255,255,255,.07);
  --sh:0 1px 0 rgba(255,255,255,.05) inset,0 18px 40px -18px rgba(0,0,0,.75);
  --sh-sm:0 1px 0 rgba(255,255,255,.06) inset,0 6px 14px -8px rgba(0,0,0,.7);
  --sh-in:inset 0 2px 6px rgba(0,0,0,.5),inset 0 -1px 0 rgba(255,255,255,.04);
  --bg-art:radial-gradient(70vw 60vh at 92% -12%,rgba(126,107,85,.22),transparent 62%),radial-gradient(60vw 60vh at -8% 112%,rgba(255,255,255,.04),transparent 60%)}}
:root[data-theme="dark"]{--bg:#0F0E0D;--shell:#171615;--block:#1F1D1B;--raised:#282523;
  --glass:rgba(34,32,30,.6);--glass-line:rgba(255,255,255,.07);
  --sh:0 1px 0 rgba(255,255,255,.05) inset,0 18px 40px -18px rgba(0,0,0,.75);
  --sh-sm:0 1px 0 rgba(255,255,255,.06) inset,0 6px 14px -8px rgba(0,0,0,.7);
  --sh-in:inset 0 2px 6px rgba(0,0,0,.5),inset 0 -1px 0 rgba(255,255,255,.04);
  --bg-art:radial-gradient(70vw 60vh at 92% -12%,rgba(126,107,85,.22),transparent 62%),radial-gradient(60vw 60vh at -8% 112%,rgba(255,255,255,.04),transparent 60%)}
body{background:var(--bg-art),var(--bg);background-attachment:fixed}
/* rail en verre flottant */
.rail{top:14px;height:calc(100vh - 28px);margin:14px 0 14px 14px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.25);backdrop-filter:blur(22px) saturate(1.25);border:1px solid var(--glass-line);border-radius:34px 34px 34px 14px;box-shadow:var(--sh)}
.nav button[aria-current="page"]{background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 86%,#fff),var(--brand));box-shadow:var(--sh-sm)}
.jn{border:0;background:var(--shell);box-shadow:var(--sh-in)}
.jn button[aria-pressed="true"]{box-shadow:var(--sh-sm)}
main{padding-top:20px}
/* onglet intégré : le titre de page dépasse du grand conteneur et s'y raccorde par un congé */
.tabrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 16px;flex-wrap:wrap;position:relative;z-index:1}
.tab{position:relative;background:var(--shell);border-radius:40px 40px 0 0;padding:22px 32px 8px 30px;max-width:100%}
.tab::after{content:"";position:absolute;right:-30px;bottom:0;width:30px;height:30px;background:radial-gradient(circle at 100% 0,transparent 29.5px,var(--shell) 30px)}
.tab h1{margin:0;font-family:var(--f-title);font-weight:400;font-size:clamp(40px,5vw,62px);letter-spacing:-.015em;line-height:.95}
.tab h1 em{font-style:italic}
.tab p{margin:8px 0 0;color:var(--muted)}
.tabrow>.actions{padding-bottom:12px}
.shell{background:var(--shell);border-radius:0 44px 44px 44px;padding:22px;box-shadow:0 40px 80px -50px rgba(52,40,30,.35);position:relative;min-height:60vh}
.shell>.grid,.shell>.kpis{margin-bottom:0}
.hello{gap:26px}
.quote{border-left-color:color-mix(in srgb,var(--fg) 14%,transparent)}
/* modules : grands arrondis, ombres douces, bords parfois asymétriques */
.block{background:var(--block);border-radius:36px;box-shadow:var(--sh)}
.grid>.block:nth-child(odd){border-radius:36px 36px 36px 14px}
.grid>.block:nth-child(even){border-radius:14px 36px 36px 36px}
.kpi{background:var(--block);box-shadow:var(--sh);border-radius:32px}
.kpi.hero,.game{background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--brand) 82%,#fff) 0%,var(--brand) 55%);box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 22px 40px -22px rgba(30,20,12,.55)}
.kpi.hero{border-radius:32px 32px 32px 12px}
.game{border-radius:42px 42px 42px 16px;padding-bottom:64px;position:relative}
/* sections qui se chevauchent : les quêtes glissent sur le bloc objectifs */
.game+.grid{margin-top:-46px;position:relative;z-index:2}
.game+.grid>.block:first-child{border-radius:36px 36px 36px 14px;box-shadow:0 -1px 0 rgba(255,255,255,.7) inset,0 -18px 40px -24px rgba(30,20,12,.35),var(--sh)}
.chunk{box-shadow:inset 0 2px 4px rgba(0,0,0,.18)}
.ring svg circle:last-child{filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.q,.opp,.lever,.crow,.sib,.mini .it,.facts div,.next,.bcard,.cheer,details.more{box-shadow:var(--sh-sm)}
.q{border-radius:24px 24px 24px 10px}
.lever{border-radius:28px 28px 28px 12px}.lever.top{background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--brand) 82%,#fff) 0%,var(--brand) 55%)}
/* boutons et commandes en relief doux */
.btn{border:0;background:linear-gradient(180deg,var(--raised),color-mix(in srgb,var(--raised) 93%,var(--fg)));box-shadow:var(--sh-sm)}
.btn:hover{filter:brightness(1.03)}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 84%,#fff),var(--brand))}
.btn.ghost{background:none;box-shadow:none}
.btn:active,.done-btn:active{box-shadow:var(--sh-in)}
.done-btn{background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 84%,#fff),var(--brand));box-shadow:var(--sh-sm)}
.round{border:0;box-shadow:var(--sh-sm)}
.seg-f{background:var(--shell);box-shadow:var(--sh-in)}
.seg-f button[aria-pressed="true"]{background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 84%,#fff),var(--brand));box-shadow:var(--sh-sm)}

<script>
/* ───────── Référentiels ───────── */
const TYPES={studio:"Studio / agence",client_final:"Client final",apporteur:"Apporteur / partenaire",ancien_client:"Ancien client",tiede:"Prospect tiède"};
const SOURCES={outbound:"Outbound",inbound:"Inbound",intro:"Intro",reseau:"Ancien réseau",reco:"Recommandation",evenement:"Événement",social:"Réseaux sociaux"};
const ZONES={fr:"France (CET)",eu:"Europe",us_e:"US côte est (−6 h)",us_w:"US côte ouest (−9 h)",asie:"Asie",autre:"Autre"};
const CHALEURS={froid:"Froid",tiede:"Tiède",chaud:"Chaud",dormant:"Dormant"};
const ACC_TYPES={studio:"Studio",agence:"Agence",marque:"Marque",partenaire:"Partenaire"};
const MISSIONS={da:"Direction artistique",graphisme:"Design graphique",identite:"Identité",rollout:"Rollout",campagne:"Campagne",editorial:"Éditorial",digital:"Digital & web",artbuying:"Art buying",renfort:"Renfort"};
const CATS={quick:"Quick win",core:"Core",big:"Big bet"};
const CONF={basse:"Basse",moyenne:"Moyenne",haute:"Haute"};
const RISQUES={budget:"Budget",timing:"Timing",validation:"Validation interne",flou:"Besoin flou",concurrence:"Concurrence",aucun:"Aucun identifié"};
const RAISONS={budget:"Budget",timing:"Timing · pas maintenant",besoin:"Pas de besoin réel",concurrent:"A choisi quelqu'un d'autre",silence:"Plus de nouvelles",interne:"Fait en interne",autre:"Autre"};
const SERVICES=["Strategy & Concepts","Art Direction","Brand Identity","Graphic Design","Editorial & Publication","Digital & Web Design","Campaigns & Content","Art Buying"];
/* Contacts : board Prospection */
const PROSPECT=[
  {k:"a_contacter",l:"À contacter",c:"--c-todo",d:"Pas encore écrit"},
  {k:"contacte",l:"Contacté",c:"--c-contact",d:"1er message envoyé"},
  {k:"relance",l:"Relance prévue",c:"--c-relance",d:"Relance 1, 2 ou 3 programmée"},
  {k:"sommeil",l:"Sommeil",c:"--c-sommeil",d:"Relances finies sans réponse · pause volontaire"},
  {k:"reactiver",l:"À réactiver",c:"--c-react",d:"À reprendre avec un nouvel angle ou à une date choisie"},
];
const C_STAGE=Object.fromEntries([...PROSPECT,{k:"pipeline",l:"En pipeline",c:"--c-conv"}].map(s=>[s.k,s]));
/* Opportunités : board Pipeline */
const PIPE=[
  {k:"repondu",l:"Répondu",c:"--c-rep",d:"A répondu au message",p:10},
  {k:"qualification",l:"Qualification",c:"--c-qualif",d:"Besoin, timing, type de projet, autonomie, décideurs, sérieux",p:20},
  {k:"r1",l:"R1 · call",c:"--c-call",d:"Call planifié ou tenu",p:35},
  {k:"proposition",l:"Proposition envoyée",c:"--c-call",d:"Devis ou proposition commerciale",p:50},
  {k:"attente",l:"Attente · négociation",c:"--c-attente",d:"Attente de décision ou discussion en cours",p:65},
  {k:"signe",l:"Signé",c:"--c-signe",d:"Devis accepté",p:100},
  {k:"perdu",l:"Perdu · plus tard",c:"--c-perdu",d:"Avec la raison documentée",p:0},
];
const O_STAGE=Object.fromEntries(PIPE.map(s=>[s.k,s]));
const OPEN=["repondu","qualification","r1","proposition","attente"];
const RANK={repondu:1,qualification:2,r1:3,proposition:4,attente:5,signe:6,perdu:0};
const DORMANT_C=["sommeil","reactiver"];
const PSTAGES=[{k:"production",l:"En production",c:"--c-qualif"},{k:"livre",l:"Livré",c:"--c-call"},{k:"facture",l:"Facture envoyée",c:"--c-attente"},{k:"paye",l:"Payé",c:"--c-signe"}];
const TIPS={
  froid:"Message court et personnalisé, 2–3 visuels choisis dans leur univers. Une idée par message.",
  tiede:"Bien qualifier : besoin, timing, type de projet, niveau d'autonomie attendu, décideurs, sérieux.",
  chaud:"Suivre la prochaine étape convenue. Récapituler par écrit après chaque échange.",
  dormant:"Revenir avec une vraie raison : une actu, une disponibilité, un projet proche de leur univers, un nouvel angle.",
  ancien_client:"Prendre des nouvelles, annoncer une disponibilité, montrer un projet récent.",
  apporteur:"Toucher léger : une actu utile, une dispo mise à jour, le portfolio, une intro ou une reco de votre réseau. Créer de la réciprocité."
};
const QUOTES=["Un message envoyé vaut mieux que dix brouillons parfaits.","La régularité bat le talent quand le talent ne relance pas.","Chaque « pas maintenant » est un « plus tard » à noter.","Le pipe se remplit un message à la fois.","Ose la relance : personne ne s'en souviendra comme d'un défaut.","Une bonne idée sans suivi reste une jolie intention.","Aujourd'hui, un pas de plus vers le projet qui compte.","Les belles collaborations commencent souvent par une deuxième relance.","Ce que tu montres attire ce que tu fais ensuite.","Petit geste quotidien, grand portfolio annuel.","Sois aussi exigeante avec ton suivi qu'avec ton kerning.","Le bon client n'attend pas : il ne sait juste pas encore que tu existes.","Trois messages aujourd'hui valent mieux qu'un plan pour demain.","Ton travail parle. Aide-le à être entendu.","La constance est un style, elle aussi."];
const GOALS=[
  {k:"contactes",l:"studios contactés",c:"--c-contact",re:/^Premier message envoyé/,def:20},
  {k:"reponses",l:"réponses",c:"--c-conv",re:/A répondu/,def:6},
  {k:"calls",l:"calls",c:"--c-call",re:/^Call R1/,def:4},
  {k:"propositions",l:"propositions",c:"--c-attente",re:/^Proposition envoyée/,def:2},
];
const XP_RULES=[[/^Premier message/,1],[/^Relance \d+ envoyée/,1],[/^Message de réactivation/,2],[/A répondu/,3],[/^Qualification/,3],[/^Call R1/,5],[/^Proposition envoyée/,8],[/^Suivi/,2],[/^Négociation|^En attente/,2],[/^Signé/,20]];
const xpOf=t=>{for(const[r,n]of XP_RULES)if(r.test(t))return n;return 0};
/* Repères de conversion pour une activité freelance B2B créative (modifiables plus tard) */
const BENCH={rep:.15,call:.5,prop:.6,sign:.35};

/* ───────── Dates ───────── */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=s?new Date(s+"T12:00"):new Date();d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((new Date(a+"T12:00")-new Date(b+"T12:00"))/864e5);
const MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const MOIS_L=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const JOURS=["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
const fmtD=s=>{if(!s)return"—";const d=new Date(s+"T12:00");return d.getDate()+" "+MOIS[d.getMonth()]};
const rel=s=>{if(!s)return"—";const n=diff(s,today());if(n===0)return"Aujourd'hui";if(n===1)return"Demain";if(n===-1)return"Hier";if(n<0)return"Il y a "+(-n)+" j";if(n<7)return"Dans "+n+" j";return fmtD(s)};
const ago=s=>{if(!s)return"—";const n=diff(today(),s);return n===0?"Aujourd'hui":n===1?"Hier":"Il y a "+n+" j"};
const eur=n=>new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n||0);
const keur=n=>n>=1000?(Math.round(n/100)/10).toString().replace(".",",")+" k€":eur(n);
const pct=x=>Math.round(x*100)+" %";
const monday=()=>{const d=new Date();d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)};
const isWE=s=>{const g=new Date(s+"T12:00").getDay();return g===0||g===6};
const monthKey=(off=0)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);return iso(d).slice(0,7)};
const monthName=k=>MOIS_L[+k.slice(5)-1];

/* ───────── Contacts ───────── */
const OLD_PIPE=["repondu","qualification","r1","proposition","attente","signe","perdu","reponse","decouverte","devis","timing"];
function migrate(c){
  const s=c.stage||"a_contacter";
  const map={prospection:(c.relances||1)<=1?"contacte":"relance",veille:"sommeil"};
  if(map[s])c.stage=map[s];
  if(OLD_PIPE.includes(c.stage)){c.legacy=c.stage;c.stage="pipeline"}
  if(!C_STAGE[c.stage])c.stage="a_contacter";
  if(!c.poste&&c.nom&&c.nom.includes(",")){const i=c.nom.indexOf(",");c.poste=c.nom.slice(i+1).trim();c.nom=c.nom.slice(0,i).trim()}
  if(!c.type&&c.cible)c.type=c.cible;
  if(c.zone==="intl")c.zone="us_e";
  return c;
}
const cstage=c=>c.stage||"a_contacter";
const cboard=c=>cstage(c)==="pipeline"?"pipe":"prospect";
const relanceNum=c=>Math.max(1,(c.relances||1));
const ccolor=c=>(C_STAGE[cstage(c)]||C_STAGE.a_contacter).c;
const clabel=c=>{const s=cstage(c);if(s==="relance")return"Relance "+relanceNum(c)+" prévue";return C_STAGE[s].l};
const oppsOf=c=>S.opps.filter(o=>o.contactId===c.id);
function chaleur(c){
  if(c.chaleur)return c.chaleur;
  const s=cstage(c);
  if(DORMANT_C.includes(s))return"dormant";
  if(s==="pipeline"){const os=oppsOf(c).filter(o=>OPEN.includes(ostage(o)));if(os.some(o=>RANK[ostage(o)]>=3))return"chaud";if(os.length)return"tiede";return"dormant"}
  if(c.type==="tiede"||c.type==="ancien_client")return"tiede";
  return"froid";
}
const cLate=c=>!!(c.next&&c.next.date&&c.next.date<today());
function lastOf(hist){const h=(hist||[]).find(x=>!/^Fiche créée/.test(x.t));return h||null}
function lastContact(c){const all=[lastOf(c.hist),...oppsOf(c).map(o=>lastOf(o.hist))].filter(Boolean).sort((a,b)=>b.d.localeCompare(a.d));return all[0]||null}
function tipFor(c){
  if(c.type==="apporteur")return TIPS.apporteur;
  if(c.type==="ancien_client")return TIPS.ancien_client;
  return TIPS[chaleur(c)];
}
function zoneHint(c){
  if(c.zone==="us_e")return"Côte est US : envoyer entre 15h et 18h, heure de Paris.";
  if(c.zone==="us_w")return"Côte ouest US : envoyer entre 18h et 20h, heure de Paris.";
  if(c.zone==="asie")return"Asie : envoyer tôt le matin, heure de Paris.";
  return"";
}
function rythme(c,n,from){
  const t=c.type;
  if(t==="apporteur")return{stage:"relance",next:{date:addDays(from,35),label:"Toucher léger (4–6 semaines)"}};
  if(t==="ancien_client")return{stage:"relance",next:{date:addDays(from,45),label:"Prendre des nouvelles"}};
  if(t==="tiede")return{stage:"relance",next:{date:addDays(from,30),label:"Relance tiède (3–6 semaines)"}};
  if(n===1)return{stage:"contacte",next:{date:addDays(from,8),label:"Relance 1 (J+7/10)"}};
  if(n===2)return{stage:"relance",next:{date:addDays(from,14),label:"Relance 2 (≈J+21)"}};
  if(n===3)return{stage:"relance",next:{date:addDays(from,21),label:"Relance 3 (≈J+45)"}};
  return{stage:"sommeil",next:{date:addDays(from,75),label:"Fin de la pause : réactiver ?"}};
}
function applyC(c,ev,opts={}){
  const t=today(),h=(c.hist||[]).slice(),p={};const log=x=>h.unshift({d:t,t:x});
  switch(ev){
    case"envoye":{const fresh=DORMANT_C.includes(cstage(c))||cstage(c)==="pipeline";const n=fresh?1:(c.relances||0)+1;p.relances=n;
      log(fresh?"Message de réactivation envoyé":n===1?"Premier message envoyé":"Relance "+(n-1)+" envoyée");
      const r=rythme(c,n,t);p.stage=r.stage;p.next=r.next;if(r.stage==="sommeil")log("Pas de réponse après 3 relances · mise en sommeil");break}
    case"sommeil":p.stage="sommeil";p.next={date:opts.date||addDays(t,75),label:"Fin de la pause : réactiver ?"};log("Mis en sommeil");break;
    case"reactiver":p.stage="reactiver";p.next={date:opts.date||addDays(t,30),label:"Réactiver avec un nouvel angle"};log("À réactiver");break;
    case"a_contacter":p.stage="a_contacter";p.next={date:t,label:"Envoyer le premier message"};break;
    case"repondu":p.stage="pipeline";p.next=null;p.converti=t;log("A répondu · opportunité créée");break;
    case"suivi":p.next={date:addDays(t,7),label:(c.next&&c.next.label)||"Suivi"};log("Suivi · "+((c.next&&c.next.label)||"contact"));break;
  }
  p.hist=h.slice(0,60);p.maj=t;return p;
}
const C_DROP={a_contacter:"a_contacter",contacte:"envoye",relance:"envoye",sommeil:"sommeil",reactiver:"reactiver",converti:"repondu"};

/* ───────── Opportunités ───────── */
const ostage=o=>O_STAGE[o.stage]?o.stage:"repondu";
const ocolor=o=>ostage(o)==="attente"&&o.nego?"--c-nego":O_STAGE[ostage(o)].c;
const olabel=o=>ostage(o)==="attente"?(o.nego?"Négociation":"Attente décision"):O_STAGE[ostage(o)].l;
const proba=o=>(o.proba!==undefined&&o.proba!==null&&o.proba!=="")?+o.proba:(ostage(o)==="attente"&&o.nego?75:O_STAGE[ostage(o)].p);
const pondere=o=>(+o.valeur||0)*proba(o)/100;
const oLate=o=>!!(o.next&&o.next.date&&o.next.date<today()&&OPEN.includes(ostage(o)));
const reach=o=>Math.max(o.reach||0,RANK[ostage(o)]||0);
const O_NEXT={repondu:[3,"Qualifier : besoin, timing, décideurs"],qualification:[5,"Planifier le call R1"],r1:[5,"Envoyer la proposition"],proposition:[7,"Relancer la proposition"],attente:[7,"Point sur la décision"]};
function applyO(o,ev){
  const t=today(),h=(o.hist||[]).slice(),p={};const log=x=>h.unshift({d:t,t:x});
  const to=k=>{p.stage=k;p.reach=Math.max(reach(o),RANK[k]||0);if(O_NEXT[k])p.next={date:addDays(t,O_NEXT[k][0]),label:O_NEXT[k][1]}};
  switch(ev){
    case"repondu":to("repondu");break;
    case"qualification":to("qualification");log("Qualification");break;
    case"r1":to("r1");log("Call R1");break;
    case"proposition":to("proposition");log("Proposition envoyée"+(o.valeur?" · "+eur(o.valeur):""));break;
    case"attente":to("attente");p.nego=false;log("En attente de décision");break;
    case"nego":to("attente");p.nego=true;p.next={date:addDays(t,4),label:"Avancer la négociation"};log("Négociation en cours");break;
    case"signe":to("signe");p.next=null;p.signeLe=t;log("Signé"+(o.valeur?" · "+eur(o.valeur):""));break;
    case"perdu":to("perdu");p.next={date:addDays(t,90),label:"Reprendre contact ?"};p.perduLe=t;log("Perdu · plus tard");break;
    case"suivi":p.next={date:addDays(t,(O_NEXT[ostage(o)]||[5])[0]),label:(o.next&&o.next.label)||"Suivi"};log("Suivi · "+((o.next&&o.next.label)||olabel(o)));break;
  }
  p.hist=h.slice(0,60);p.maj=t;return p;
}

/* ───────── Accounts ───────── */
let IDX={byId:{},byName:{},contact:{}};
function buildIndex(){IDX={byId:{},byName:{},contact:{}};S.comptes.forEach(a=>{IDX.byId[a.id]=a;if(a.nom)IDX.byName[norm(a.nom)]=a});S.contacts.forEach(c=>IDX.contact[c.id]=c)}
function compteKey(c){
  if(c.compteId&&IDX.byId[c.compteId])return c.compteId;
  const n=norm(c.studio);if(!n)return null;
  return IDX.byName[n]?IDX.byName[n].id:"v:"+n;
}
const compteName=c=>{const k=compteKey(c);return k&&IDX.byId[k]?IDX.byId[k].nom:(c.studio||"")};
const oCompteName=o=>(IDX.byId[o.compteId]||{}).nom||o.compteNom||"";
const oContact=o=>IDX.contact[o.contactId]||null;
const ACC_STATUS={actif:{l:"Actif",c:"--c-signe"},opportunite:{l:"Opportunité",c:"--c-qualif"},prospection:{l:"Prospection",c:"--c-contact"},dormant:{l:"Dormant",c:"--c-sommeil"}};
function accounts(){
  const map={};
  S.comptes.forEach(a=>{map[a.id]={id:a.id,doc:a,nom:a.nom,contacts:[],opps:[]}});
  S.contacts.forEach(c=>{const k=compteKey(c);if(!k)return;if(!map[k])map[k]={id:k,doc:null,nom:c.studio,virtual:true,contacts:[],opps:[]};map[k].contacts.push(c)});
  S.opps.forEach(o=>{if(map[o.compteId])map[o.compteId].opps.push(o)});
  return Object.values(map).map(a=>{
    const d=a.doc||{},cs=a.contacts,os=a.opps;
    const open=os.filter(o=>OPEN.includes(ostage(o)));
    const signedRecent=os.some(o=>ostage(o)==="signe"&&o.signeLe&&diff(today(),o.signeLe)<180);
    const statut=signedRecent?"actif":open.length?"opportunite":cs.some(c=>["a_contacter","contacte","relance"].includes(cstage(c)))?"prospection":"dormant";
    const moves=[...cs.map(c=>lastOf(c.hist)),...os.map(o=>lastOf(o.hist))].filter(Boolean).sort((x,y)=>y.d.localeCompare(x.d));
    const nexts=[...cs.filter(c=>c.next&&c.next.date&&cboard(c)==="prospect").map(c=>({date:c.next.date,label:c.next.label,who:c.nom||c.studio})),
      ...open.filter(o=>o.next&&o.next.date).map(o=>({date:o.next.date,label:o.next.label,who:o.nom}))].sort((x,y)=>x.date.localeCompare(y.date));
    const next=d.nextDate?{date:d.nextDate,label:d.nextLabel||"Point global",who:"Compte",manual:true}:nexts[0]||null;
    const principal=cs.find(c=>c.id===d.principal)||null;
    const conv=cs.filter(c=>["contacte","relance"].includes(cstage(c))||open.some(o=>o.contactId===c.id));
    return{...a,statut,lastMove:moves[0]||null,next,principal,conv,open,valeur:open.reduce((t,o)=>t+(+o.valeur||0),0),pond:open.reduce((t,o)=>t+pondere(o),0),
      type:d.type||"",pays:d.pays||"",notes:d.notes||""};
  });
}
const siblings=c=>{const k=compteKey(c);return k?S.contacts.filter(x=>x.id!==c.id&&compteKey(x)===k):[]};

/* ───────── État & stockage ───────── */
const S={contacts:[],projets:[],comptes:[],opps:[],obj:{},view:"today",filters:{q:"",type:"",source:"",board:"",chaleur:""},sort:{k:"next",dir:1},
  home:{weeks:2,editGoals:false,showAll:false},fc:{period:"mois",edit:false},ready:false,db:null,L:null};
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const norm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\(exemple\)/g,"").replace(/[^a-z0-9]+/g," ").trim();
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function toast(t,cls=""){const el=document.createElement("div");el.className="toast "+cls;el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
function setSync(on,txt){const s=document.getElementById("sync");s.classList.toggle("on",on);s.querySelector("span").textContent=txt}
async function save(col,id,patch,full){
  if(!S.db){toast("Enregistrement impossible : la base n'est pas joignable.");return false}
  const run=()=>{const ref=S.db.collection(col).doc(id);return full?ref.set(patch):ref.update(patch)};
  try{await run();return true}
  catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*600));try{await run();return true}catch(_){}}
    toast(e&&e.code==="quota_exceeded"?"La base est pleine : supprimez d'anciennes fiches.":"Échec de l'enregistrement. Réessayez dans un instant.");return false}
}
async function del(col,id){if(!S.db)return;try{await S.db.collection(col).doc(id).delete()}catch(e){toast("Suppression impossible pour le moment.")}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const goalTarget=g=>+(S.obj[g.k]||g.def);
const caTarget=()=>+(S.obj.ca||5000);

async function boot(){
  render();
  const db=await claude.use("db").catch(()=>null);
  if(!db){setSync(false,"Hors ligne");S.ready=true;render();return}
  S.db=db;
  let got=0;const timer=setTimeout(()=>{if(got<15)setSync(false,"Lent…")},10000);
  const bit={contacts:1,projets:2,comptes:4,opps:8};
  const sub=name=>db.collection(name).onSnapshot(snap=>{
    S[name]=snap.docs.map(d=>{const o={id:d.id,...d.data()};return name==="contacts"?migrate(o):o});
    if(!snap.metadata.fromCache){got|=bit[name];if(got===15){clearTimeout(timer);setSync(true,"Synchro")}}
    S.ready=true;render();
  },()=>{clearTimeout(timer);setSync(false,"Hors ligne");S.ready=true;render()});
  sub("contacts");sub("projets");sub("comptes");sub("opps");
  db.doc("reglages/objectifs").onSnapshot(s=>{S.obj=s.exists?s.data():{};render()},()=>{});
}

function activity(){const all=[];[...S.contacts,...S.opps].forEach(x=>(x.hist||[]).forEach(h=>{if(!/^Fiche créée/.test(h.t))all.push(h)}));return all}
function vToday(){
  const t=today(),m=t.slice(0,7),acts=activity();
  const counts=Object.fromEntries(GOALS.map(g=>[g.k,acts.filter(h=>h.d.startsWith(m)&&g.re.test(h.t)).length]));
  const pc=Math.round(GOALS.reduce((s,g)=>s+Math.min(1,counts[g.k]/Math.max(1,goalTarget(g))),0)/GOALS.length*100);
  const days=new Set(acts.map(h=>h.d));
  let streak=0,d=days.has(t)?t:addDays(t,-1);for(let i=0;i<400;i++){if(days.has(d))streak++;else if(!isWE(d))break;d=addDays(d,-1)}
  const mon=monday();const week=[0,1,2,3,4,5,6].map(i=>addDays(mon,i));
  const xpMonth=acts.filter(h=>h.d.startsWith(m)).reduce((s,h)=>s+xpOf(h.t),0),xpWeek=acts.filter(h=>h.d>=mon).reduce((s,h)=>s+xpOf(h.t),0);
  const R=60,C=2*Math.PI*R;

      <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--flame)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*pc/100} ${C}"/></svg>
      <div class="in"><div><b>${pc}%</b><small>objectif<br>de ${MOIS_L[new Date().getMonth()]}</small></div></div></div>
    <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><span class="label">Objectifs du mois</span>

      <div class="goals">${GOALS.map(g=>{const v=counts[g.k],tg=goalTarget(g);return`<div class="goal ${v>=tg?"done":""}" style="--c:var(${g.c})">
        <div class="top"><span>${g.l}</span>${S.home.editGoals?`<input type="number" min="1" id="goal-${g.k}" value="${tg}" aria-label="Objectif ${g.l}">`:`<b>${v}<small> / ${tg}</small></b>`}</div>
        <div class="chunk"><i style="width:${Math.min(100,v/Math.max(1,tg)*100)}%"></i></div></div>`}).join("")}</div>
    </div>

      <div class="row1">${FLAME}<div><b>${streak}</b><small>jour${streak>1?"s":""} de suite</small></div></div>
      <div class="week">${week.map((w,i)=>`<span class="${days.has(w)?"on":""} ${w===t?"today":""}">${"LMMJVSD"[i]}</span>`).join("")}</div>
      <div class="xp"><b>${xpMonth}</b><span>points ce mois · +${xpWeek} cette semaine</span></div>
    </div>

  const h=`<div class="tabrow"><div class="tab"><div class="hello"><div><h1>Bonjour</h1><p>${jour}</p></div><div class="quote">« ${QUOTES[doy%QUOTES.length]} »</div></div></div>

/* Quêtes : contacts en prospection + opportunités ouvertes dont l'action est due */
function questItems(){
  const t=today();
  const cs=S.contacts.filter(c=>cboard(c)==="prospect"&&c.next&&c.next.date&&c.next.date<=t).map(c=>({k:"c",x:c,late:cLate(c),prio:({froid:2,tiede:4,chaud:6,dormant:1}[chaleur(c)]||2)+(cLate(c)?2:0)}));
  const os=S.opps.filter(o=>OPEN.includes(ostage(o))&&o.next&&o.next.date&&o.next.date<=t).map(o=>({k:"o",x:o,late:oLate(o),prio:6+RANK[ostage(o)]+(oLate(o)?2:0)}));
  return[...os,...cs].sort((a,b)=>b.prio-a.prio);
}
function quest(it){
  const x=it.x;
  if(it.k==="c"){const s=cstage(x),who=x.nom&&compteName(x)?x.nom+" · "+compteName(x):cname(x);
    if(s==="a_contacter")return{ev:"envoye",t:"Écrire à "+who,cat:"message",xp:1};
    if(DORMANT_C.includes(s))return{ev:"envoye",t:"Réactiver "+who,cat:"réactivation",xp:2};
    return{ev:"envoye",t:"Relancer "+who,cat:"relance",xp:1};}
  const s=ostage(x),who=x.nom;
  if(s==="repondu")return{ev:"qualification",t:"Qualifier · "+who,cat:"qualification",xp:3};
  if(s==="qualification")return{ev:"r1",t:"Caler le call · "+who,cat:"call",xp:5};
  if(s==="r1")return{ev:"proposition",t:"Envoyer la proposition · "+who,cat:"proposition",xp:8};
  if(s==="proposition")return{ev:"suivi",t:"Suivre la proposition · "+who,cat:"suivi de proposition",xp:2};
  return{ev:"suivi",t:(x.nego?"Faire avancer la négo · ":"Débloquer la décision · ")+who,cat:"suivi de proposition",xp:2};
}
function blocQuests(acts){
  const t=today(),list=questItems();
  const doneToday=acts.filter(h=>h.d===t&&xpOf(h.t)>0).length;
  const cats={};list.forEach(it=>{const q=quest(it);cats[q.cat]=(cats[q.cat]||0)+1});
  const total=doneToday+list.length,shown=S.home.showAll?list:list.slice(0,5);
  return`<section class="block span-12">
    <div class="b-h"><div><h2>Quêtes <em>du jour</em></h2>
      <p>${list.length?`${plural(list.length,"move")} pour faire avancer le pipe`:"Le pipe avance tout seul aujourd'hui"}</p></div></div>
    ${list.length?`<div class="qsum">${Object.entries(cats).map(([k,n])=>`<span><b>${n}</b>${n>1?k.replace(/^(\S+)/,w=>/[sx]$/.test(w)?w:w+"s"):k}</span>`).join("")}</div>`:""}
    <div class="qprog"><span>${doneToday} / ${total} joué${doneToday>1?"s":""} aujourd'hui</span><div class="chunk" style="--c:var(--c-conv)"><i style="width:${total?doneToday/total*100:0}%"></i></div></div>
    <div class="quests">${list.length?shown.map(questRow).join(""):`<div class="cheer">${FLAME.replace("<svg",'<svg width="36" height="36"')}<div><b>Toutes les quêtes sont jouées.</b><div class="muted">Revenez demain, ou avancez une carte du pipeline.</div></div></div>`}</div>
    ${list.length>5?`<button class="btn sm ghost" data-act="toggle-all" style="align-self:flex-start">${S.home.showAll?"Réduire":"Voir les "+(list.length-5)+" autres quêtes"}</button>`:""}
  </section>`;
}

function blocPipe(){
  const parts=[...PROSPECT.map(s=>({s,n:S.contacts.filter(c=>cstage(c)===s.k).length})),...PIPE.map(s=>({s,n:S.opps.filter(o=>ostage(o)===s.k).length}))].filter(x=>x.n);
  const pros=S.contacts.filter(c=>cboard(c)==="prospect"),open=S.opps.filter(o=>OPEN.includes(ostage(o)));
  const brut=open.reduce((t,o)=>t+(+o.valeur||0),0),pond=open.reduce((t,o)=>t+pondere(o),0);
  const proDue=pros.filter(c=>c.next&&c.next.date<=today()).length;
  return`<section class="block span-12"><div class="b-h"><div><h2>Le pipe</h2><p>${pros.length} prospects · ${open.length} opportunités ouvertes${brut?` · ${keur(brut)} brut · ${keur(pond)} pondéré`:""}</p></div></div>
    <div class="stack" role="img" aria-label="Répartition par étape">${parts.map(x=>`<i style="--c:var(${x.s.c});flex:${x.n}" title="${x.s.l} : ${x.n}"></i>`).join("")}</div>
    <div class="stack-leg">${parts.map(x=>`<span><i class="dot" style="--c:var(${x.s.c})"></i>${x.s.l} <b>${x.n}</b></span>`).join("")}</div>

        <div class="dots">${PROSPECT.map(s=>`<i style="--c:var(${s.c})"></i>`).join("")}</div></a>
      <a class="bcard notched" href="#pipeline">${NOTCH_STATIC}<b>Pipeline</b><small>${open.length} opportunités${brut?" · "+keur(brut):""} · ${S.opps.filter(o=>ostage(o)==="signe").length} signée(s)</small>
        <div class="dots">${PIPE.map(s=>`<i style="--c:var(${s.c})"></i>`).join("")}</div></a>
    </div>
  </section>`;

function blocTimeline(){
  const t=today(),N=S.home.weeks*7;const days=[];for(let i=0;i<N;i++)days.push(addDays(t,i));const end=days[days.length-1];
  const C=S.contacts.filter(c=>cboard(c)==="prospect"&&c.next&&c.next.date&&c.next.date<=end).map(c=>({id:c.id,k:"c",date:c.next.date,label:c.next.label,who:cname(c),col:ccolor(c),late:cLate(c),row:DORMANT_C.includes(cstage(c))?"react":"relances"}));
  const O=S.opps.filter(o=>(OPEN.includes(ostage(o))||ostage(o)==="perdu")&&o.next&&o.next.date&&o.next.date<=end).map(o=>({id:o.id,k:"o",date:o.next.date,label:o.next.label,who:o.nom,col:ocolor(o),late:oLate(o),row:ostage(o)==="perdu"?"react":["repondu","qualification"].includes(ostage(o))?"calls":"props"}));
  const items=[...C,...O];
  const rows=[{k:"relances",l:"Relances",c:"--c-relance"},{k:"calls",l:"Calls",c:"--c-qualif"},{k:"props",l:"Propositions",c:"--c-attente"},{k:"react",l:"Réactivations",c:"--c-react"}];
  const cell=(list,cls)=>`<div class="cell ${cls}">${list.slice(0,4).map(i=>`<button ${i.k==="c"?`data-open="${i.id}"`:`data-openo="${i.id}"`} class="${i.late?"is-late":""}" style="--c:var(${i.col})" title="${esc(i.who+" · "+(i.label||""))}" aria-label="${esc(i.who)}"></button>`).join("")}${list.length>4?`<em>+${list.length-4}</em>`:""}</div>`;
  let html=`<div class="tl" style="grid-template-columns:130px 52px repeat(${N},minmax(22px,1fr))"><div></div><div class="hd"><b class="late">!</b>retard</div>`+days.map(d=>{const dt=new Date(d+"T12:00");return`<div class="hd ${isWE(d)?"we":""} ${d===t?"today":""}"><b>${dt.getDate()}</b>${JOURS[dt.getDay()].slice(0,1)}</div>`}).join("");
  rows.forEach(r=>{const pool=items.filter(i=>i.row===r.k);html+=`<div class="lb"><i class="dot" style="--c:var(${r.c})"></i>${r.l}</div>`+cell(pool.filter(i=>i.date<t),"lt")+days.map(d=>cell(pool.filter(i=>i.date===d),isWE(d)?"we":"")).join("")});
  html+="</div>";
  const noNext=S.opps.filter(o=>OPEN.includes(ostage(o))&&!(o.next&&o.next.date));
  const lateN=items.filter(i=>i.late).length;
  return`<section class="block span-12"><div class="b-h"><div><h2>Rythme <em>commercial</em></h2><p>Relances, calls, propositions et réactivations des ${S.home.weeks} prochaines semaines</p></div>

/* ───────── REVENUE FORECAST ───────── */
function periodRange(){
  const d=new Date(),y=d.getFullYear(),m=d.getMonth();
  if(S.fc.period==="trimestre"){const q0=Math.floor(m/3)*3;return{start:iso(new Date(y,q0,1)),end:iso(new Date(y,q0+3,0)),label:"T"+(q0/3+1)+" "+y,mult:3}}
  return{start:iso(new Date(y,m,1)),end:iso(new Date(y,m+1,0)),label:MOIS_L[m]+" "+y,mult:1};
}
function vForecast(){
  const r=periodRange(),target=caTarget()*r.mult,inR=d=>d&&d>=r.start&&d<=r.end;
  const signed=S.opps.filter(o=>ostage(o)==="signe"&&inR(o.signeLe));
  const signe=signed.reduce((t,o)=>t+(+o.valeur||0),0);
  const open=S.opps.filter(o=>OPEN.includes(ostage(o)));
  const inP=open.filter(o=>!o.dateSignature||o.dateSignature<=r.end);
  const noDate=inP.filter(o=>!o.dateSignature).length;
  const pond=inP.reduce((t,o)=>t+pondere(o),0),brut=inP.reduce((t,o)=>t+(+o.valeur||0),0);
  const gap=Math.max(0,target-signe),gapAfter=Math.max(0,target-signe-pond);
  const scale=Math.max(target,signe+brut,1);
  const paid=S.projets.filter(p=>p.stage==="paye"&&inR(p.paye)).reduce((t,p)=>t+(+p.montant||0),0);
  const pend=S.projets.filter(p=>p.stage==="facture").reduce((t,p)=>t+(+p.montant||0),0);

  /* conversions */
  const contacted=S.contacts.filter(c=>(c.relances||0)>0||cstage(c)!=="a_contacter").length;
  const replied=Math.max(S.contacts.filter(c=>cboard(c)==="pipe").length,new Set(S.opps.map(o=>o.contactId).filter(Boolean)).size);
  const nOpp=S.opps.length,calls=S.opps.filter(o=>reach(o)>=3).length,props=S.opps.filter(o=>reach(o)>=4).length,signs=S.opps.filter(o=>ostage(o)==="signe").length;
  const st=[{k:"rep",l:"Contacté → réponse",a:replied,b:contacted,tip:"Messages plus courts et plus personnalisés ; testez un autre canal ou un autre angle."},
    {k:"call",l:"Réponse → call",a:calls,b:Math.max(replied,nOpp),tip:"Proposez un créneau précis dès la première réponse."},
    {k:"prop",l:"Call → proposition",a:props,b:calls,tip:"Qualifiez mieux pendant le call : budget, timing, décideur, avant d'écrire."},
    {k:"sign",l:"Proposition → signature",a:signs,b:props,tip:"Relancez sous 5 jours et proposez 2–3 options de prix."}]
    .map(s=>({...s,rate:s.b?s.a/s.b:0,ok:s.b>=3,eff:s.b>=3?s.a/s.b:BENCH[s.k]}));
  const e2e=st.reduce((t,s)=>t*Math.max(.01,s.eff),1);
  const vals=S.opps.filter(o=>ostage(o)==="signe"&&+o.valeur).map(o=>+o.valeur);const all=S.opps.filter(o=>+o.valeur).map(o=>+o.valeur);
  const avg=(vals.length?vals:all).reduce((t,v)=>t+v,0)/Math.max(1,(vals.length?vals:all).length)||0;
  const needDeals=avg?Math.ceil(gapAfter/avg):0,needContacts=needDeals?Math.ceil(needDeals/e2e):0;
  const newThisMonth=S.contacts.filter(c=>(c.cree||"").startsWith(today().slice(0,7))).length;
  const weakest=st.filter(s=>s.ok).sort((a,b)=>a.rate/BENCH[a.k]-b.rate/BENCH[b.k])[0];
  const dealsPerMonth=avg?caTarget()/avg:0;
  const L={leads:gapAfter>0?Math.min(3,gapAfter/Math.max(1,target)*3+(newThisMonth<goalTarget(GOALS[0])/2?1:0)):0,
    conv:weakest?Math.max(0,(1-weakest.rate/BENCH[weakest.k])*3):0,
    valeur:dealsPerMonth>3?Math.min(3,(dealsPerMonth-2)/2):0};
  const top=Object.entries(L).sort((a,b)=>b[1]-a[1])[0];const topK=top[1]>.3?top[0]:null;
  const lvl=v=>v>1.5?{l:"Priorité",c:"--late"}:v>.6?{l:"À surveiller",c:"--c-relance"}:{l:"OK",c:"--c-signe"};
  const lever=(k,title,body,foot)=>{const lv=lvl(L[k]);return`<div class="lever ${topK===k?"top":""}"><span class="lvl" style="--c:var(${lv.c})">${topK===k?"Levier n°1 · ":""}${lv.l}</span><h3>${title}</h3><p>${body}</p><small>${foot}</small></div>`};

  /* mix et calendrier */
  const mix=Object.entries(CATS).map(([k,l])=>{const os=open.filter(o=>o.categorie===k);return{l,n:os.length,v:os.reduce((t,o)=>t+(+o.valeur||0),0),p:os.reduce((t,o)=>t+pondere(o),0)}});
  const noCat=open.filter(o=>!o.categorie).length;const mixMax=Math.max(1,...mix.map(m=>m.v));
  const months=[0,1,2].map(i=>monthKey(i));
  const mdata=months.map(mk=>({mk,s:S.opps.filter(o=>ostage(o)==="signe"&&(o.signeLe||"").startsWith(mk)).reduce((t,o)=>t+(+o.valeur||0),0),
    p:open.filter(o=>(o.dateSignature||(mk===months[0]?today():"")).startsWith(mk)).reduce((t,o)=>t+pondere(o),0),
    d:[...S.opps.filter(o=>(o.dateDemarrage||"").startsWith(mk)&&(OPEN.includes(ostage(o))||ostage(o)==="signe"))]}));
  const mmax=Math.max(caTarget(),...mdata.map(x=>x.s+x.p),1);
  const risks=Object.entries(RISQUES).filter(([k])=>k!=="aucun").map(([k,l])=>{const os=open.filter(o=>o.risque===k);return{l,n:os.length,v:os.reduce((t,o)=>t+(+o.valeur||0),0)}}).filter(x=>x.n);

  return head("Revenue <em>forecast</em>",`Piloté automatiquement à partir de vos opportunités, contacts et projets · ${r.label}`,
     `<div class="seg-f" role="group" aria-label="Période">${["mois","trimestre"].map(p=>`<button data-period="${p}" aria-pressed="${S.fc.period===p}">${cap(p)}</button>`).join("")}</div>`)
   +legacyNotice()
   +`<div class="kpis">
    <div class="kpi hero"><span class="label">Revenu signé</span><span class="v">${keur(signe)}</span><span class="s">${plural(signed.length,"opportunité")} signée${signed.length>1?"s":""} sur la période</span></div>
    <div class="kpi"><span class="label">Forecast pondéré</span><span class="v">${keur(pond)}</span><span class="s">Valeur × probabilité${noDate?` · ${noDate} sans date de signature`:""}</span></div>
    <div class="kpi"><span class="label">Potentiel brut</span><span class="v">${keur(brut)}</span><span class="s">${plural(inP.length,"opportunité")} ouverte${inP.length>1?"s":""}</span></div>
    <div class="kpi"><span class="label">Gap à l'objectif</span><span class="v ${gapAfter?"late":""}">${keur(gapAfter)}</span><span class="s">${gapAfter?`À trouver après le pondéré · ${keur(gap)} hors pondéré`:"Objectif couvert si le pondéré signe"}</span></div>
  </div>
  <div class="grid">
    <section class="block span-12"><div class="b-h"><div><h2>Vers l'objectif</h2><p>Objectif ${S.fc.period==="mois"?"mensuel":"trimestriel"} : ${S.fc.edit?`<input type="number" id="fc-ca" min="0" step="500" value="${caTarget()}" style="width:110px;background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:3px 10px"> € / mois <button class="btn sm primary" data-act="save-ca">OK</button>`:`<b>${eur(target)}</b> <button class="lnk" data-act="edit-ca">modifier</button>`}</p></div></div>
      <div class="gauge" role="img" aria-label="Signé, pondéré et brut par rapport à l'objectif">

function parseTable(txt){
  txt=txt.replace(/^﻿/,"");const first=txt.split(/\r?\n/)[0]||"";
  const sep=first.includes("\t")?"\t":(first.split(";").length>first.split(",").length?";":",");
  const rows=[];let cur=[""],q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur[cur.length-1]+='"';i++}else q=false}else cur[cur.length-1]+=ch}
    else if(ch==='"')q=true;else if(ch===sep)cur.push("");else if(ch==="\n"){rows.push(cur);cur=[""]}else if(ch!=="\r")cur[cur.length-1]+=ch}
  rows.push(cur);return rows.filter(r=>r.some(c=>c.trim()));
}
const nrm=s=>(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
function parseDate(s){s=(s||"").trim();if(!s)return"";let m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if(m){let y=+m[3];if(y<100)y+=2000;return y+"-"+pad(+m[2])+"-"+pad(+m[1])}m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:""}
function guessZone(loc){const l=nrm(loc);if(!l)return"fr";if(/france|paris|lyon|marseille|bordeaux|lille|nantes|toulouse|nice|rennes/.test(l))return"fr";
  if(/new york|ny|boston|miami|toronto|montreal/.test(l))return"us_e";if(/los angeles|la|san francisco|seattle|vancouver/.test(l))return"us_w";
  if(/usa|us|etats|united states/.test(l))return"us_e";if(/tokyo|seoul|shanghai|hong|singap|japon|chine|coree/.test(l))return"asie";return"eu"}
function buildImport(txt){
  const rows=parseTable(txt);if(rows.length<2)return null;
  const h=rows[0].map(nrm);
  const find=(...keys)=>h.findIndex(x=>keys.some(k=>x.includes(k)));
  const ix={loc:find("locali","ville","pays","lieu"),studio:find("studio","client","nom","agence","entreprise"),stat:find("statut","status","etat"),mail:find("mail"),note:find("note","info","reco")};
  const dateCols=h.map((x,i)=>/date|mail \d|relance/.test(x)&&i!==ix.mail?i:-1).filter(i=>i>=0);
  const contactIx=h.findIndex((x,i)=>i!==ix.studio&&/(contact|prenom|personne|interlocut)/.test(x));
  const posteIx=h.findIndex(x=>/(poste|fonction|titre)/.test(x)),liIx=h.findIndex(x=>/linkedin/.test(x));
  const defT=document.getElementById("i-type").value,defS=document.getElementById("i-source").value;
  const out=rows.slice(1).map(r=>{
    const g=i=>i>=0?(r[i]||"").trim():"";
    const dates=dateCols.map(i=>parseDate(r[i])).filter(Boolean).sort();
    const st=nrm(g(ix.stat));
    const c={id:uid(),studio:g(ix.studio),nom:contactIx>=0?g(contactIx):"",poste:posteIx>=0?g(posteIx):"",email:g(ix.mail),linkedin:g(liIx),pays:g(ix.loc),zone:guessZone(g(ix.loc)),note:g(ix.note),
      type:defT,source:/reco/.test(nrm(g(ix.note)))?"reco":defS,relances:dates.length,hist:[],cree:today()};
    dates.forEach((d,i)=>c.hist.unshift({d,t:i===0?"Premier message envoyé":"Relance "+i+" envoyée"}));
    const last=dates[dates.length-1];
    if(/repon|repondu/.test(st)){c.stage="pipeline";c.converti=today();c._opp=true}
    else if(!dates.length&&!/envoy|relanc/.test(st)){c.stage="a_contacter";c.next={date:today(),label:"Envoyer le premier message"};c.relances=0}
    else{const n=Math.max(1,dates.length);c.relances=n;const rr=rythme(c,n,last||today());c.stage=rr.stage;c.next=rr.next;
      if(/a relancer/.test(st)&&rr.stage!=="sommeil"){c.stage="relance";c.next={date:today(),label:"Relance "+n}}}
    return c;
  }).filter(c=>c.studio||c.email);
  return{cols:ix,dateCols:dateCols.length,list:out};
}

async function ensureCompte(name,extra={},cache){
