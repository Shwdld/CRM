/* ───────── Rendu ───────── */
function render(){
  buildIndex();renderNav();
  const V={today:vToday,prospect:vProspect,pipeline:vPipeline,comptes:vComptes,contacts:vContacts,projets:vProjets,forecast:vForecast,import:vImport}[S.view]||vToday;
  const keep=S.view==="import"&&document.getElementById("i-paste");
  if(!keep){const html=V(),i=html.indexOf("<!--/head-->");document.getElementById("main").innerHTML=i<0?`<div class="shell">${html}</div>`:html.slice(0,i)+`<div class="shell">${html.slice(i+12)}</div>`}
  renderLayer();
}
function renderLayer(){
  const L=document.getElementById("layer"),st=S.L;
  if(!st){L.innerHTML="";L.dataset.k="";return}
  let html="",key="";
  if(st.t==="quick"){key="q"+st.kind;if(L.dataset.k===key)return;html=drawerQuick(st.kind,st.d||{})}
  else if(st.t==="contact"){const c=S.contacts.find(x=>x.id===st.id);if(!c){S.L=null;return renderLayer()}key="c"+c.id+(c.maj||"")+(c.hist||[]).length+c.stage+(c.compteId||"")+oppsOf(c).map(o=>o.stage+o.maj).join();if(L.dataset.k===key)return;html=drawerContact(c)}
  else if(st.t==="compte"){const a=accounts().find(x=>x.id===st.id);if(!a){S.L=null;return renderLayer()}key="a"+a.id+JSON.stringify(a.doc||{}).length+a.contacts.map(c=>c.id+c.stage+(c.maj||"")).join()+a.opps.map(o=>o.id+o.stage+(o.maj||"")).join();if(L.dataset.k===key)return;html=drawerCompte(a)}
  else if(st.t==="opp"){const o=S.opps.find(x=>x.id===st.id);if(!o){S.L=null;return renderLayer()}key="o"+o.id+(o.maj||"")+(o.hist||[]).length+o.stage+(o.nego?1:0)+JSON.stringify(o).length;if(L.dataset.k===key)return;html=drawerOpp(o)}
  else if(st.t==="projet"){const p=st.id==="new"?st.d:S.projets.find(x=>x.id===st.id);if(!p){S.L=null;return renderLayer()}key="p"+st.id;if(L.dataset.k===key)return;html=drawerProjet(p,st.id==="new")}
  L.innerHTML=html;L.dataset.k=key;
}
const open=(t,id,extra={})=>{S.L={t,id,...extra};document.getElementById("layer").dataset.k="";renderLayer()};
const closeLayer=()=>{S.L=null;renderLayer()};

/* ───────── Interactions ───────── */
document.addEventListener("click",async e=>{
  const t=e.target;
  if(t.closest("[data-close]")){closeLayer();return}
  const svc=t.closest("[data-svc]");if(svc){svc.classList.toggle("primary");return}
  const pk=t.closest("[data-pick]");if(pk){const i=document.getElementById("c-studio")||document.getElementById("q-studio");i.value=pk.dataset.pick;i.dispatchEvent(new Event("input",{bubbles:true}));return}
  const vt=t.closest("[data-vt]");if(vt){go(vt.dataset.vt);return}
  const fl=t.closest("[data-filter]");if(fl){const[k,v]=fl.dataset.filter.split(":");S.filters[k]=S.filters[k]===v?"":v;render();return}
  const wk=t.closest("[data-weeks]");if(wk){S.home.weeks=+wk.dataset.weeks;render();return}
  const pe=t.closest("[data-period]");if(pe){S.fc.period=pe.dataset.period;render();return}
  const gt=t.closest("[data-goto]");if(gt){go(gt.dataset.goto);return}
  const qd=t.closest("[data-quest]");if(qd){const[k,id]=qd.dataset.quest.split(":");const x=(k==="c"?S.contacts:S.opps).find(y=>y.id===id);if(!x)return;
    const q=quest({k,x});const row=qd.closest(".q");if(row)row.classList.add("gone");
    setTimeout(async()=>{const ok=k==="c"?await runC(x,q.ev,true):await runO(x,q.ev,true);if(ok)toast("+"+q.xp+" pt"+(q.xp>1?"s":"")+" · "+q.t,"xp")},220);return}
  const pr=t.closest("[data-principal]");if(pr){await setPrincipal(S.L.id,pr.dataset.principal);return}
  const cev=t.closest("[data-cev]");if(cev){const c=S.contacts.find(x=>x.id===cev.dataset.id);if(c)await runC(c,cev.dataset.cev);return}
  const oev=t.closest("[data-oev]");if(oev){const o=S.opps.find(x=>x.id===oev.dataset.id);if(o)await runO(o,oev.dataset.oev);return}
  const sn=t.closest("[data-snooze]");if(sn){const[k,id]=sn.dataset.snooze.split(":");const x=(k==="c"?S.contacts:S.opps).find(y=>y.id===id);
    if(x&&x.next){await save(k==="c"?"contacts":"opps",x.id,{next:{...x.next,date:addDays(x.next.date<today()?today():x.next.date,3)}});toast("Reporté de 3 jours")}return}
  const oc=t.closest("[data-openc]");if(oc){e.preventDefault();open("compte",oc.dataset.openc);return}
  const oo=t.closest("[data-openo]");if(oo){open("opp",oo.dataset.openo);return}
  const op=t.closest("[data-open]");if(op){open("contact",op.dataset.open);return}
  const opp=t.closest("[data-openp]");if(opp){open("projet",opp.dataset.openp);return}
  const so=t.closest("[data-sort]");if(so){const k=so.dataset.sort;S.sort=S.sort.k===k?{k,dir:-S.sort.dir}:{k,dir:k==="last"?-1:1};render();return}
  const a=t.closest("[data-act]");if(!a)return;
  switch(a.dataset.act){
    case"new-contact":open("quick",null,{kind:"contact",d:{}});break;
    case"new-compte":open("quick",null,{kind:"compte",d:{}});break;
    case"new-opp":{let d={};if(a.dataset.contact){const c=S.contacts.find(x=>x.id===a.dataset.contact);d={contactId:c.id,compteId:compteKey(c)}}if(a.dataset.compte)d={compteId:a.dataset.compte};open("quick",null,{kind:"opp",d});break}
    case"add-to-compte":{const ac=accounts().find(x=>x.id===S.L.id);open("quick",null,{kind:"contact",d:{studio:ac?ac.nom:""}});break}
    case"quick-save":await quickSave(a.dataset.kind);break;
    case"newp":open("projet","new",{d:{stage:"production",services:[]}});break;
    case"save-c":await saveContact();break;
    case"del-c":if(a.dataset.sure){await del("contacts",S.L.id);closeLayer();toast("Fiche supprimée")}else{a.dataset.sure=1;a.textContent="Confirmer la suppression"}break;
    case"save-a":await saveCompte();break;
    case"del-a":if(a.dataset.sure){const ac=accounts().find(x=>x.id===S.L.id);if(ac&&ac.doc)await del("comptes",ac.doc.id);closeLayer();toast("Account supprimé · les contacts restent")}else{a.dataset.sure=1;a.textContent="Confirmer la suppression"}break;
    case"save-o":await saveOpp();break;
    case"del-o":if(a.dataset.sure){await del("opps",S.L.id);closeLayer();toast("Opportunité supprimée")}else{a.dataset.sure=1;a.textContent="Confirmer la suppression"}break;
    case"save-p":await saveProjet();break;
    case"del-p":if(a.dataset.sure){await del("projets",S.L.id);closeLayer();toast("Projet supprimé")}else{a.dataset.sure=1;a.textContent="Confirmer la suppression"}break;
    case"edit-goals":S.home.editGoals=true;render();break;
    case"save-goals":{const o={...S.obj};GOALS.forEach(g=>{const v=+(document.getElementById("goal-"+g.k)||{}).value;o[g.k]=v>0?v:g.def});S.home.editGoals=false;await saveObj(o,"Objectifs enregistrés");break}
    case"edit-ca":S.fc.edit=true;render();break;
    case"save-ca":{const v=+(document.getElementById("fc-ca")||{}).value;S.fc.edit=false;await saveObj({...S.obj,ca:v>0?v:5000},"Objectif de revenu enregistré");break}
    case"toggle-all":S.home.showAll=!S.home.showAll;render();break;
    case"migrate":a.disabled=true;await migrateLegacy();break;
    case"do-import":a.disabled=true;await doImport();break;
    case"cancel-import":IMP=null;document.getElementById("i-preview").innerHTML="";document.getElementById("i-paste").value="";break;
    case"clear-ex":if(a.dataset.sure){a.disabled=true;for(const k of["contacts","projets","comptes","opps"])for(const x of S[k].filter(y=>y.exemple))await del(k,x.id);toast("Exemples supprimés")}else{a.dataset.sure=1;a.textContent="Confirmer : supprimer les exemples"}break;
  }
});
async function saveObj(o,msg){S.obj=o;render();if(S.db){try{await S.db.doc("reglages/objectifs").set(o);toast(msg)}catch(_){toast("Non enregistré. Réessayez.")}}}
async function runC(c,ev,quiet){
  const opts={};const nd=document.getElementById("c-nextdate");
  if((ev==="reactiver"||ev==="sommeil")&&nd&&nd.value&&nd.value>today())opts.date=nd.value;
  const p=applyC(c,ev,opts);
  if(!(await save("contacts",c.id,p)))return false;
  if(ev==="repondu"){let cid=compteKey(c);if(cid&&cid.startsWith("v:"))cid=await ensureCompte(c.studio);if(cid&&cid!==c.compteId)await save("contacts",c.id,{compteId:cid});
    const oid=await newOppFor({...c,compteId:cid},cid);if(oid){toast("Opportunité créée : donnez-lui un nom","xp");open("opp",oid)}return true}
  if(!quiet)toast(p.next?"Prochaine action : "+rel(p.next.date).toLowerCase():"Enregistré");
  return true;
}
async function runO(o,ev,quiet){
  const p=applyO(o,ev);
  if(!(await save("opps",o.id,p)))return false;
  if(ev==="signe"){const pid=uid();await save("projets",pid,{titre:o.nom,client:oCompteName(o),oppId:o.id,montant:+o.valeur||0,stage:"production",demarrage:o.dateDemarrage||"",services:[],cree:today(),exemple:!!o.exemple},true);toast("Signé ! Le projet est créé dans « Projets ».","xp")}
  else if(ev==="perdu"){open("opp",o.id);toast("Notez la raison dans la fiche");setTimeout(()=>{const r=document.getElementById("o-raison");if(r)r.focus()},80)}
  else if(!quiet)toast(p.next?"Prochaine étape : "+rel(p.next.date).toLowerCase():"Enregistré");
  return true;
}
const val=id=>(document.getElementById(id)||{}).value??"";
async function quickSave(kind){
  if(kind==="contact"){
    const f={nom:val("q-nom").trim(),studio:val("q-studio").trim(),poste:val("q-poste").trim(),type:val("q-type"),source:val("q-source")};
    if(!f.nom&&!f.studio){toast("Indiquez au moins un nom.");return}
    f.compteId=f.studio?await ensureCompte(f.studio):"";
    const id=uid();if(await save("contacts",id,{...f,stage:"a_contacter",relances:0,zone:"fr",next:{date:today(),label:"Envoyer le premier message"},hist:[{d:today(),t:"Fiche créée"}],cree:today(),maj:today()},true)){toast("Contact créé · complétez quand vous voulez");open("contact",id)}
  }
  if(kind==="compte"){
    const nom=val("q-nom").trim();if(!nom){toast("Donnez un nom à l'entreprise.");return}
    if(IDX.byName[norm(nom)]){toast("Cet account existe déjà");open("compte",IDX.byName[norm(nom)].id);return}
    const id=uid();if(await save("comptes",id,{nom,type:val("q-atype"),pays:val("q-pays").trim(),cree:today()},true)){toast("Account créé");open("compte",id)}
  }
  if(kind==="opp"){
    const nom=val("q-nom").trim();if(!nom){toast("Donnez un nom à l'opportunité.");return}
    let cid=val("q-compte");if(cid.startsWith("v:")){const a=accounts().find(x=>x.id===cid);cid=await materialize(a)}
    const id=uid();const contactId=val("q-contact");
    if(await save("opps",id,{nom,compteId:cid,contactId,mission:val("q-mission"),valeur:+val("q-valeur")||0,stage:"repondu",reach:1,next:{date:addDays(today(),3),label:O_NEXT.repondu[1]},hist:[{d:today(),t:"Opportunité ouverte"}],cree:today(),maj:today()},true)){
      const c=S.contacts.find(x=>x.id===contactId);if(c&&cboard(c)==="prospect")await save("contacts",c.id,{stage:"pipeline",converti:today(),next:null});
      toast("Opportunité créée");open("opp",id)}
  }
}
async function saveContact(){
  const c=S.contacts.find(x=>x.id===S.L.id);if(!c)return;
  const f={nom:val("c-nom").trim(),poste:val("c-poste").trim(),studio:val("c-studio").trim(),type:val("c-type"),source:val("c-source"),email:val("c-email").trim(),linkedin:val("c-linkedin").trim(),tel:val("c-tel").trim(),
    chaleur:val("c-chaleur"),pays:val("c-pays").trim(),zone:val("c-zone"),note:val("c-note"),maj:today()};
  if(f.email&&S.contacts.some(x=>x.id!==c.id&&x.email&&x.email.toLowerCase()===f.email.toLowerCase())){toast("Un contact avec ce mail existe déjà.");return}
  f.compteId=f.studio?await ensureCompte(f.studio):"";
  const nl=val("c-nextlabel").trim(),nd=val("c-nextdate");
  if(nd||nl)f.next={label:nl||"Relance",date:nd||today()};
  if(await save("contacts",c.id,f)){toast("Enregistré");closeLayer()}
}
async function materialize(a){
  if(!a)return"";if(a.doc)return a.doc.id;
  const id=await ensureCompte(a.nom);
  for(const c of a.contacts)if(c.compteId!==id)await save("contacts",c.id,{compteId:id});
  return id;
}
async function saveCompte(){
  const a=accounts().find(x=>x.id===S.L.id);if(!a)return;
  const body={nom:val("a-nom").trim(),type:val("a-type"),pays:val("a-pays").trim(),notes:val("a-notes"),nextLabel:val("a-nextlabel").trim(),nextDate:val("a-nextdate")};
  if(!body.nom){toast("Donnez un nom à l'entreprise.");return}
  const id=await materialize(a);if(!id)return;
  if(await save("comptes",id,body)){if(norm(body.nom)!==norm(a.nom))for(const c of a.contacts)await save("contacts",c.id,{studio:body.nom,compteId:id});toast("Account enregistré");closeLayer()}
}
async function setPrincipal(key,cid){
  const a=accounts().find(x=>x.id===key);if(!a)return;
  const id=await materialize(a);if(!id)return;
  const cur=a.doc&&a.doc.principal;
  if(await save("comptes",id,{principal:cur===cid?"":cid})){toast(cur===cid?"Contact principal retiré":"Contact principal défini");if(key!==id)open("compte",id)}
}
async function saveOpp(){
  const o=S.opps.find(x=>x.id===S.L.id);if(!o)return;
  const pr=val("o-proba");
  const body={nom:val("o-nom").trim()||o.nom,contactId:val("o-contact"),mission:val("o-mission"),valeur:+val("o-valeur")||0,proba:pr===""?null:Math.max(0,Math.min(100,+pr)),categorie:val("o-cat"),confiance:val("o-conf"),
    dateSignature:val("o-dsign"),dateDemarrage:val("o-dstart"),risque:val("o-risque"),notes:val("o-notes"),maj:today()};
  const nl=val("o-nextlabel").trim(),nd=val("o-nextdate");body.next=nd||nl?{label:nl||"Suivi",date:nd||today()}:null;
  if(document.getElementById("o-raison")){body.raison=val("o-raison");body.raisonNote=val("o-raisonNote").trim()}
  if(await save("opps",o.id,body)){toast("Enregistré");closeLayer()}
}
async function saveProjet(){
  const body={titre:val("p-titre").trim(),client:val("p-client").trim(),montant:+val("p-montant")||0,stage:val("p-stage"),demarrage:val("p-demarrage"),facture:val("p-facture"),paye:val("p-paye"),notes:val("p-notes"),
    services:[...document.querySelectorAll("#p-services .primary")].map(b=>b.dataset.svc)};
  if(body.stage==="facture"&&!body.facture)body.facture=today();
  if(body.stage==="paye"&&!body.paye)body.paye=today();
  if(!body.titre){toast("Donnez un nom au projet.");return}
  const isNew=S.L.id==="new",id=isNew?uid():S.L.id;
  if(await save("projets",id,isNew?{...body,cree:today()}:body,isNew)){toast(isNew?"Projet créé":"Enregistré");closeLayer()}
}
/* Anciennes fiches dont l'étape de pipeline était portée par le contact → opportunités */
async function migrateLegacy(){
  const map={reponse:"repondu",decouverte:"qualification",devis:"proposition",timing:"perdu"};
  let n=0;for(const c of S.contacts.filter(x=>x.legacy&&!S.opps.some(o=>o.contactId===x.id))){
    let cid=compteKey(c);if(cid&&cid.startsWith("v:"))cid=await ensureCompte(c.studio);
    const st=map[c.legacy]||c.legacy;
    const id=await newOppFor({...c,compteId:cid},cid,{stage:st,reach:RANK[st]||1,valeur:+c.montant||0,nego:!!c.nego,raison:c.raison||"",next:c.next||null,exemple:!!c.exemple,hist:(c.hist||[]).filter(h=>!/^Premier|^Relance|^Fiche/.test(h.t))});
    if(id){await save("contacts",c.id,{stage:"pipeline",compteId:cid||"",next:null});n++}}
  toast(n+" opportunité(s) créée(s)");
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.L)closeLayer()});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id&&id.startsWith("f-")){S.filters[id.slice(2)]=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById(id);if(el){el.focus();if(id==="f-q"&&pos!=null)el.setSelectionRange(pos,pos)}}
  if(id==="c-studio"||id==="q-studio"){const h=document.getElementById(id+"-hint");if(h)h.innerHTML=studioHint(e.target.value,S.L&&S.L.id)}
  if(id==="i-paste"){clearTimeout(window._pt);window._pt=setTimeout(()=>{if(e.target.value.trim())showPreview(e.target.value)},400)}
});
document.addEventListener("change",e=>{
  if(e.target.id==="q-compte"){const a=accounts().find(x=>x.id===e.target.value);document.getElementById("q-contact").innerHTML=contactOptions(a,"")}
  if(e.target.id==="i-file"&&e.target.files[0])readFile(e.target.files[0]);
  if(["i-type","i-source"].includes(e.target.id)){const p=document.getElementById("i-paste");if(window._lastTxt||p.value)showPreview(window._lastTxt||p.value)}
});
function readFile(f){const r=new FileReader();r.onload=()=>{window._lastTxt=r.result;showPreview(r.result)};r.readAsText(f)}

let drag=null;
document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest("[data-card]");if(!c)return;drag=c.dataset.card;c.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",drag)}catch(_){}});
document.addEventListener("dragend",()=>{document.querySelectorAll(".dragging,.over").forEach(x=>x.classList.remove("dragging","over"))});
document.addEventListener("dragover",e=>{
  const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.add("over");return}
  if(!drag)return;const sel=drag.startsWith("p:")?"[data-pdrop]":"[data-drop]";const col=e.target.closest&&e.target.closest(sel);if(!col)return;
  e.preventDefault();document.querySelectorAll(".over").forEach(x=>x!==col&&x.classList.remove("over"));col.classList.add("over")});
document.addEventListener("drop",async e=>{
  const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.remove("over");const f=e.dataTransfer.files[0];if(f)readFile(f);return}
  if(!drag)return;const[k,id]=drag.split(":");drag=null;
  if(k==="p"){const col=e.target.closest("[data-pdrop]");if(!col)return;e.preventDefault();const p=S.projets.find(x=>x.id===id),s=col.dataset.pdrop;if(!p||p.stage===s)return;const patch={stage:s};if(s==="facture"&&!p.facture)patch.facture=today();if(s==="paye"&&!p.paye)patch.paye=today();await save("projets",p.id,patch);toast((PSTAGES.find(x=>x.k===s)||{}).l);return}
  const col=e.target.closest("[data-drop]");if(!col)return;e.preventDefault();col.classList.remove("over");const s=col.dataset.drop;
  if(k==="c"){const c=S.contacts.find(x=>x.id===id);if(!c||!C_DROP[s])return;if(cstage(c)===s&&s!=="relance")return;if(s==="converti"&&cboard(c)==="pipe")return;await runC(c,C_DROP[s])}
  if(k==="o"){const o=S.opps.find(x=>x.id===id);if(!o||!O_STAGE[s]||ostage(o)===s)return;await runO(o,s)}
});

boot();
</script>
