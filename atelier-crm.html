<title>Atelier CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout : rail de navigation fixe à gauche, plan de travail clair à droite, fiche contact en tiroir latéral. */
:root{
  --bg:#E9E8E5; --surface:#F4F3F1; --raised:#FBFAF9; --line:#D6D3CE; --line-soft:#E2DFDA;
  --fg:#1E1A17; --muted:#77706A; --faint:#A59E96;
  --brown:#4B2D1F; --brown-ink:#FBFAF9; --beige:#CBB79C; --beige-soft:#E6DCCD;
  --u-da:#4B2D1F; --u-graph:#8A8178; --u-hosp:#4F5D47; --u-b2c:#B0905F;
  --hot:#8E3B22; --warm:#B0905F; --cold:#9AA0A3; --ok:#4F6B4A; --late:#9A3A22;
  --shadow:0 1px 0 rgba(30,26,23,.04),0 12px 40px -18px rgba(30,26,23,.25);
  --f-ui:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121110; --surface:#1A1817; --raised:#211F1D; --line:#2F2B28; --line-soft:#272421;
  --fg:#ECE8E3; --muted:#958D85; --faint:#6A635D;
  --brown:#C9A27E; --brown-ink:#1A1310; --beige:#8C775E; --beige-soft:#2C2620;
  --u-da:#C9A27E; --u-graph:#A39A90; --u-hosp:#8FA283; --u-b2c:#C7A777;
  --hot:#D9805F; --warm:#C7A777; --cold:#7E8589; --ok:#8FA283; --late:#E0866A;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 16px 40px -16px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121110; --surface:#1A1817; --raised:#211F1D; --line:#2F2B28; --line-soft:#272421;
  --fg:#ECE8E3; --muted:#958D85; --faint:#6A635D;
  --brown:#C9A27E; --brown-ink:#1A1310; --beige:#8C775E; --beige-soft:#2C2620;
  --u-da:#C9A27E; --u-graph:#A39A90; --u-hosp:#8FA283; --u-b2c:#C7A777;
  --hot:#D9805F; --warm:#C7A777; --cold:#7E8589; --ok:#8FA283; --late:#E0866A;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 16px 40px -16px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1.5px solid var(--brown);outline-offset:2px}
a{color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:28px;padding:28px 20px 22px max(20px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;flex-direction:column;gap:4px}
.brand b{font-weight:500;font-size:15px;letter-spacing:.32em;text-transform:uppercase}
.brand span{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.08em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:var(--r);color:var(--muted);font-size:13.5px}
.nav button:hover{color:var(--fg);background:var(--line-soft)}
.nav button[aria-current="page"]{color:var(--fg);background:var(--raised);box-shadow:inset 0 0 0 1px var(--line)}
.nav .count{font-family:var(--f-mono);font-size:11px;min-width:20px;text-align:center;padding:1px 6px;border-radius:10px;background:var(--brown);color:var(--brown-ink)}
.nav .count:empty{display:none}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--bg)}
.seg button{border:0;background:none;padding:4px 10px;border-radius:999px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.sync{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);display:flex;align-items:center;gap:6px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.sync.on i{background:var(--ok)}

main{min-width:0;padding-block:32px 80px;padding-left:max(16px,clamp(20px,4vw,48px));padding-right:max(16px,env(safe-area-inset-right,0px),clamp(20px,4vw,48px))}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.head h1{margin:0;font-weight:300;font-size:clamp(28px,3.4vw,40px);letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
.head p{margin:6px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raised);padding:8px 14px;border-radius:999px;font-size:13px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brown);border-color:var(--brown);color:var(--brown-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:default}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--faint));flex:none}
.pill{display:inline-flex;align-items:center;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.froid{color:var(--cold)} .pill.tiede{color:var(--warm)} .pill.chaud{color:var(--hot)} .pill.client{color:var(--ok)}
.stars{font-family:var(--f-mono);letter-spacing:.05em;color:var(--brown);font-size:12px}
.stars .off{color:var(--line)}
.late{color:var(--late)}

/* Aujourd'hui */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:36px}
.kpi{background:var(--surface);padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kpi .v{font-weight:300;font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.kpi .s{font-size:12px;color:var(--muted)}
.section{margin-bottom:36px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px}
.section-h h2{margin:0;font-size:13px;font-weight:500;letter-spacing:.02em}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:92px minmax(0,1.4fr) minmax(0,1.6fr) auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.row:hover{background:linear-gradient(90deg,transparent,var(--line-soft) 12%,var(--line-soft) 88%,transparent)}
.row .when{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.row .who{min-width:0;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.row .who b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row .todo{min-width:0;display:flex;flex-direction:column;gap:3px}
.row .todo b{font-weight:400}
.row .todo small{color:var(--muted);font-size:12px}
.row .ops{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:28px 0;color:var(--muted);font-size:13px}
.empty b{color:var(--fg);font-weight:500}

/* Pipeline */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.toolbar select,.toolbar input,.field input,.field select,.field textarea{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;font-size:13px;min-width:0}
.toolbar input[type="search"]{flex:1 1 200px;max-width:320px}
.board-wrap{overflow-x:auto;margin-inline:-4px;padding:0 4px 12px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:236px;gap:12px;min-height:420px}
.col{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:12px 10px;min-width:0}
.col.pause{background:transparent;border-style:dashed}
.col.over{border-color:var(--brown);box-shadow:inset 0 0 0 1px var(--brown)}
.col-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 6px}
.col-h span{font-size:12.5px;font-weight:500}
.col-h em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.card{background:var(--raised);border:1px solid var(--line-soft);border-radius:var(--r);padding:10px 11px;display:flex;flex-direction:column;gap:7px;cursor:grab;position:relative}
.card::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--c,var(--faint))}
.card:hover{border-color:var(--line);box-shadow:var(--shadow)}
.card b{font-weight:500;font-size:13px;line-height:1.3}
.card small{font-size:11.5px;color:var(--muted)}
.card .line{display:flex;justify-content:space-between;align-items:center;gap:6px}
.card.dragging{opacity:.4}

/* Contacts table */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--f-mono);font-weight:400;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
td{padding:10px 12px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--raised)}
tbody tr:last-child td{border-bottom:0}

/* Projets */
.pcard .amount{font-family:var(--f-mono);font-size:13px}

/* Dashboard */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:18px 20px;min-width:0}
.panel h3{margin:0 0 16px;font-size:13px;font-weight:500}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;gap:12px;align-items:center;font-size:12.5px}
.bar .track{height:8px;background:var(--line-soft);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--c,var(--brown));border-radius:4px}
.bar .n{font-family:var(--f-mono);font-size:12px;text-align:right;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;height:170px;padding-top:18px;border-bottom:1px solid var(--line)}
.cols .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.cols .c div{width:min(36px,70%);background:var(--brown);border-radius:3px 3px 0 0;min-height:1px}
.cols .c span{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.cols-x{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:8px}
.cols-x span{text-align:center;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(18,16,14,.28);backdrop-filter:blur(2px);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:22px 24px 16px;border-bottom:1px solid var(--line)}
.drawer-h h2{margin:0;font-weight:300;font-size:24px;letter-spacing:-.01em}
.drawer-h p{margin:4px 0 0;color:var(--muted);font-size:13px}
.drawer-b{flex:1;overflow-y:auto;padding:20px 24px 32px;display:flex;flex-direction:column;gap:24px}
.x{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);padding:4px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field textarea{min-height:72px;resize:vertical}
.starpick{display:flex;gap:2px}
.starpick button{border:0;background:none;font-size:18px;color:var(--line);padding:0 2px}
.starpick button.on{color:var(--brown)}
.next{border:1px solid var(--line);border-radius:var(--r);background:var(--raised);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.next .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.next .top b{font-weight:500}
.tip{font-size:12.5px;color:var(--muted);border-left:2px solid var(--beige);padding-left:10px}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.hist{display:flex;flex-direction:column;gap:0;border-left:1px solid var(--line);margin-left:4px}
.hist div{position:relative;padding:0 0 12px 16px;font-size:12.5px}
.hist div::before{content:"";position:absolute;left:-4px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--surface);border:1px solid var(--muted)}
.hist time{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-right:8px}

/* Import */
.drop{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);background:var(--surface)}
.drop.over{border-color:var(--brown);color:var(--fg)}
.steps-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:24px}
.steps-list div{border-top:1px solid var(--line);padding-top:12px;font-size:13px;color:var(--muted)}
.steps-list b{display:block;color:var(--fg);font-weight:500;margin-bottom:4px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.notice{border:1px solid var(--line);background:var(--raised);border-radius:var(--r);padding:12px 14px;font-size:13px;color:var(--muted);margin-bottom:20px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}

@media (max-width:980px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .row{grid-template-columns:72px minmax(0,1fr);row-gap:8px}
  .row .todo,.row .ops{grid-column:2}
  .row .ops{justify-content:flex-start}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:20;flex-direction:row;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .brand span,.rail-foot .sync{display:none}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap;padding:7px 9px}
  .rail-foot{margin:0 0 0 auto}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .form{grid-template-columns:minmax(0,1fr)}
  .steps-list{grid-template-columns:minmax(0,1fr)}
  .bar{grid-template-columns:96px minmax(0,1fr) 48px}
}
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:slide .22s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:.6}}
}
</style>

<div class="app">
  <aside class="rail">
    <div class="brand"><b>Atelier</b><span>Direction artistique · Design</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <div class="seg" id="theme" role="group" aria-label="Thème">
        <button data-t="light">Jour</button><button data-t="dark">Nuit</button><button data-t="auto">Auto</button>
      </div>
      <div class="sync" id="sync"><i></i><span>Connexion…</span></div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="layer"></div>

<script>
/* ───────── Référentiels ───────── */
const UNIVERS={da:{l:"Direction artistique",c:"--u-da"},graphisme:{l:"Design graphique",c:"--u-graph"},hospitalite:{l:"Expérientiel & hospitalité",c:"--u-hosp"},b2c:{l:"Clients directs",c:"--u-b2c"}};
const CIBLES={studio:"Studio / agence",client_final:"Client final",apporteur:"Apporteur / partenaire",ancien_client:"Ancien client",tiede:"Prospect tiède"};
const ZONES={fr:"France",eu:"Europe",intl:"US / international"};
const ANGLES={renfort:"Renfort DA / design graphique",p360:"Projet 360 · stratégie, identité, campagne",courte:"Mission courte",long:"Mission long terme"};
const SERVICES=["Strategy & Concepts","Art Direction","Brand Identity","Graphic Design","Editorial & Publication","Digital & Web Design","Campaigns & Content","Art Buying"];
const STAGES=[
  {k:"a_contacter",l:"À contacter",rel:"Jamais contacté"},
  {k:"prospection",l:"Prospection",rel:"Contacté sans réponse"},
  {k:"reponse",l:"Réponse reçue",rel:"Réponse reçue"},
  {k:"decouverte",l:"Appel découverte",rel:"Call fait"},
  {k:"r1",l:"Appel R1 · proposition",rel:"Call fait"},
  {k:"devis",l:"Devis envoyé",rel:"Call fait"},
  {k:"signe",l:"Signé",rel:"Client"},
  {k:"timing",l:"En attente d'un timing",rel:"En attente d'un timing",pause:1},
  {k:"veille",l:"En pause · sans réponse",rel:"À réactiver",pause:1},
  {k:"perdu",l:"Perdu · à réactiver",rel:"Close lost",pause:1}
];
const STAGE=Object.fromEntries(STAGES.map(s=>[s.k,s]));
const PSTAGES=[{k:"production",l:"En production"},{k:"livre",l:"Livré"},{k:"facture",l:"Facture envoyée"},{k:"paye",l:"Payé"}];

/* Conseils d'effort selon le type de contact */
const TIPS={
  froid:"Message court et personnalisé, 2–3 visuels choisis dans leur univers. Une idée par message.",
  tiede:"Partager un projet récent qui leur parle, proposer un café ou un appel de 20 min.",
  chaud:"Suivre la prochaine étape convenue. Récapituler par écrit après chaque appel.",
  ancien_client:"Prendre des nouvelles, annoncer une disponibilité, montrer un projet récent.",
  apporteur:"Toucher léger : une actu utile, une disponibilité mise à jour, le portfolio, une intro ou une recommandation de votre réseau. Créer de la réciprocité : « si tu entends parler de besoins en renfort DA/design côté luxe… »"
};

/* ───────── Dates ───────── */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=s?new Date(s+"T12:00"):new Date();d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((new Date(a+"T12:00")-new Date(b+"T12:00"))/864e5);
const MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const fmtD=s=>{if(!s)return"—";const d=new Date(s+"T12:00");return d.getDate()+" "+MOIS[d.getMonth()]};
const rel=s=>{if(!s)return"—";const n=diff(s,today());if(n===0)return"Aujourd'hui";if(n===1)return"Demain";if(n===-1)return"Hier";if(n<0)return"Il y a "+(-n)+" j";if(n<7)return"Dans "+n+" j";return fmtD(s)};
const eur=n=>new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n||0);

/* ───────── Logique métier ───────── */
function maturite(c){
  if(c.stage==="signe")return"client";
  if(["decouverte","r1","devis"].includes(c.stage))return"chaud";
  if(["reponse","timing"].includes(c.stage)||c.cible==="tiede"||c.cible==="ancien_client")return"tiede";
  return"froid";
}
const MAT_L={froid:"Froid",tiede:"Tiède",chaud:"Chaud",client:"Client"};
function priorite(c){
  const m={froid:1,tiede:2,chaud:3,client:0}[maturite(c)];
  let s=m*2+(c.potentiel||0)*1.5;
  if(c.next&&c.next.date){const d=diff(c.next.date,today());if(d<0)s+=Math.min(3,-d/3)+1;}
  return s;
}
function tipFor(c){
  if(c.cible==="apporteur")return TIPS.apporteur;
  if(c.cible==="ancien_client")return TIPS.ancien_client;
  return TIPS[maturite(c)==="client"?"chaud":maturite(c)];
}
function zoneHint(c){
  if(c.zone==="intl")return"Fuseau US : envoyer entre 15h et 18h, heure de Paris.";
  if(c.zone==="eu")return"Europe : même créneau qu'en France, éviter le lundi matin.";
  return"";
}
/* Rythme de relance pour une prospection restée sans réponse */
function prochaineRelance(c,n,from){
  const t=c.cible;
  if(t==="apporteur")return{date:addDays(from,35),label:"Toucher léger (4–6 semaines)"};
  if(t==="ancien_client")return{date:addDays(from,45),label:"Prendre des nouvelles (1×/mois à 1×/2 mois)"};
  if(t==="tiede")return{date:addDays(from,30),label:"Relance tiède (3–6 semaines)"};
  if(n===1)return{date:addDays(from,8),label:"Relance 2 (J+7/10)"};
  if(n===2)return{date:addDays(from,16),label:"Relance 3 (J+21/30)"};
  return null;
}
/* Événements : renvoie le patch à écrire sur la fiche */
function appliquer(c,ev,opts={}){
  const t=today(),h=(c.hist||[]).slice();
  const p={};const log=txt=>h.unshift({d:t,t:txt});
  switch(ev){
    case"envoye":{
      const n=(c.relances||0)+1;p.relances=n;log(n===1?"Premier message envoyé":"Relance "+n+" envoyée");
      const nx=prochaineRelance(c,n,t);
      if(nx){p.stage="prospection";p.next=nx;}
      else{p.stage="veille";p.next={date:addDays(t,75),label:"Réactiver après la pause (2–3 mois)"};log("Pas de réponse après 3 messages · mise en pause");}
      break}
    case"reponse":p.stage="reponse";p.next={date:addDays(t,5),label:"Proposer un appel découverte"};log("Réponse reçue");break;
    case"decouverte":p.stage="decouverte";p.next={date:opts.date||addDays(t,7),label:"Caler l'appel R1 · proposition"};log("Appel découverte");break;
    case"r1":p.stage="r1";p.next={date:opts.date||addDays(t,5),label:"Envoyer le devis"};log("Appel R1 · proposition commerciale");break;
    case"devis":p.stage="devis";p.next={date:addDays(t,7),label:"Relancer le devis"};log("Devis envoyé"+(c.montant?" · "+eur(c.montant):""));break;
    case"signe":p.stage="signe";p.next=null;log("Devis accepté · projet signé");break;
    case"timing":p.stage="timing";p.next={date:addDays(t,42),label:"Reprendre contact (timing annoncé)"};log("En attente d'un timing");break;
    case"perdu":p.stage="perdu";p.next={date:addDays(t,90),label:"Réactiver ?"};log("Perdu · à réactiver plus tard");break;
    case"veille":p.stage="veille";p.next={date:addDays(t,75),label:"Réactiver après la pause"};log("Mis en pause");break;
    case"a_contacter":p.stage="a_contacter";p.next={date:t,label:"Envoyer le premier message"};break;
  }
  p.hist=h.slice(0,60);p.maj=t;
  return p;
}
const STAGE_EVENT={a_contacter:"a_contacter",prospection:"envoye",reponse:"reponse",decouverte:"decouverte",r1:"r1",devis:"devis",signe:"signe",timing:"timing",veille:"veille",perdu:"perdu"};

/* Action principale proposée selon l'étape */
function actionPrincipale(c){
  if(c.stage==="a_contacter")return{ev:"envoye",l:"Message envoyé"};
  if(["prospection","veille","perdu","timing"].includes(c.stage)||c.cible==="apporteur"||c.cible==="ancien_client")return{ev:"envoye",l:"Relance faite"};
  return null;
}
function gcal(c){
  if(!c.next||!c.next.date)return"";
  const d=c.next.date.replace(/-/g,""),e=addDays(c.next.date,1).replace(/-/g,"");
  const txt=(c.next.label||"Relance")+" · "+(c.studio||c.nom||"");
  const det=[c.nom,c.email,tipFor(c),zoneHint(c)].filter(Boolean).join("\n");
  return"https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(txt)+"&dates="+d+"/"+e+"&details="+encodeURIComponent(det);
}

async function save(col,id,patch,full){
  if(!S.db){toast("Enregistrement impossible : la base n'est pas joignable.");return false}
  try{const ref=S.db.collection(col).doc(id);full?await ref.set(patch):await ref.update(patch);return true}
  catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*600));try{const ref=S.db.collection(col).doc(id);full?await ref.set(patch):await ref.update(patch);return true}catch(_){}}
    toast(e&&e.code==="quota_exceeded"?"La base est pleine : supprimez d'anciennes fiches.":"Échec de l'enregistrement. Réessayez dans un instant.");return false}
}

async function boot(){
  render();
  const db=await claude.use("db").catch(()=>null);
  if(!db){setSync(false,"Hors ligne");S.ready=true;S.offline=true;render();return}
  S.db=db;
  let got=0;const timer=setTimeout(()=>{if(got<2){setSync(false,"Lent à répondre…")}},10000);
  const sub=(name)=>db.collection(name).onSnapshot(snap=>{
    S[name]=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!snap.metadata.fromCache){got|=name==="contacts"?1:2;if(got===3){clearTimeout(timer);setSync(true,"Synchronisé")}}
    S.ready=true;render();
  },err=>{clearTimeout(timer);setSync(false,"Connexion perdue");S.ready=true;render()});
  sub("contacts");sub("projets");
}

  return head("Tableau de bord","Vos chiffres, calculés à partir des projets et des fiches.")
  +`<div class="kpis">

  </div>
  <div class="grid2">
    <div class="panel"><h3>Encaissé · 6 derniers mois</h3>
      <div class="cols">${mv.map(v=>`<div class="c"><span>${v?Math.round(v/100)/10+"k":""}</span><div style="height:${(v/mx)*100}%"></div></div>`).join("")}</div>

function parseTable(txt){
  txt=txt.replace(/^﻿/,"");const first=txt.split(/\r?\n/)[0]||"";
  const sep=first.includes("\t")?"\t":(first.split(";").length>first.split(",").length?";":",");
  const rows=[];let cur=[""],q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur[cur.length-1]+='"';i++}else q=false}else cur[cur.length-1]+=ch}
    else if(ch==='"')q=true;else if(ch===sep)cur.push("");else if(ch==="\n"){rows.push(cur);cur=[""]}else if(ch!=="\r")cur[cur.length-1]+=ch}
  rows.push(cur);return rows.filter(r=>r.some(c=>c.trim()));
}
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();
function parseDate(s){s=(s||"").trim();if(!s)return"";let m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if(m){let y=+m[3];if(y<100)y+=2000;return y+"-"+pad(+m[2])+"-"+pad(+m[1])}m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:""}
const EU=["royaume","uk","london","londres","allemagne","germany","berlin","italie","italy","milan","espagne","spain","madrid","barcelon","belgique","belgium","bruxelles","suisse","switzerland","geneve","zurich","pays-bas","netherlands","amsterdam","portugal","lisbonne","danemark","copenhag","suede","stockholm","autriche","vienne","irlande","dublin","europe"];
const FR=["france","paris","lyon","marseille","bordeaux","lille","nantes","toulouse","nice","rennes","strasbourg","montpellier"];
function guessZone(loc){const l=norm(loc||"");if(!l)return"";if(FR.some(w=>l.includes(w)))return"fr";if(EU.some(w=>l.includes(w)))return"eu";return"intl"}
function guessUnivers(s,def){const l=norm(s||"");if(/graph/.test(l))return"graphisme";if(/hosp|hotel|restau|experien|event/.test(l))return"hospitalite";if(/\bda\b|direction|artist|campagn/.test(l))return"da";if(/b2c|particulier|direct/.test(l))return"b2c";return def}
function buildImport(txt){
  const rows=parseTable(txt);if(rows.length<2)return null;
  const h=rows[0].map(norm);
  const find=(...keys)=>h.findIndex(x=>keys.some(k=>x.includes(k)));
  const ix={loc:find("locali","ville","pays","lieu"),studio:find("studio","client","nom","agence","entreprise"),dom:find("domaine","activite","secteur"),stat:find("statut","status","etat"),mail:find("mail"),note:find("note","info","reco")};
  const dateCols=h.map((x,i)=>/date|mail \d|relance/.test(x)&&i!==ix.mail?i:-1).filter(i=>i>=0);
  const contactIx=h.findIndex((x,i)=>i!==ix.studio&&/(contact|prenom|personne|interlocut)/.test(x));
  const defU=document.getElementById("i-univers").value,defC=document.getElementById("i-cible").value,defZ=document.getElementById("i-zone").value;
  const out=rows.slice(1).map(r=>{
    const g=i=>i>=0?(r[i]||"").trim():"";
    const dates=dateCols.map(i=>parseDate(r[i])).filter(Boolean).sort();
    const st=norm(g(ix.stat));
    const c={id:uid(),studio:g(ix.studio),nom:contactIx>=0?g(contactIx):"",email:g(ix.mail),localisation:g(ix.loc),notes:g(ix.note),
      univers:guessUnivers(g(ix.dom),defU),cible:defC,zone:defZ==="auto"?(guessZone(g(ix.loc))||"fr"):defZ,potentiel:0,angle:"",relances:dates.length,hist:[],cree:today()};
    if(/reco/.test(norm(c.notes)))c.potentiel=2;
    dates.forEach((d,i)=>c.hist.unshift({d,t:i===0?"Premier message envoyé":"Relance "+(i+1)+" envoyée"}));
    const last=dates[dates.length-1];
    if(/repon|repondu/.test(st)){c.stage="reponse";c.next={date:today(),label:"Proposer un appel découverte"}}
    else if(!dates.length&&!/envoy|relanc/.test(st)){c.stage="a_contacter";c.next={date:today(),label:"Envoyer le premier message"};c.relances=0}
    else{const n=Math.max(1,dates.length);c.relances=n;const nx=prochaineRelance(c,n,last||today());
      if(/a relancer/.test(st)){c.stage="prospection";c.next={date:today(),label:"Relance "+(n+1)}}
      else if(nx){c.stage="prospection";c.next=nx}else{c.stage="veille";c.next={date:addDays(last||today(),75),label:"Réactiver après la pause (2–3 mois)"}}}
    return c;
  }).filter(c=>c.studio||c.email);
  return{cols:ix,dateCols:dateCols.length,list:out,header:rows[0]};
}
function showPreview(txt){
  const box=document.getElementById("i-preview");IMP=buildImport(txt);
  if(!IMP||!IMP.list.length){box.innerHTML=`<div class="notice">Je n'ai trouvé aucune ligne exploitable. Vérifiez que la première ligne contient bien les titres de colonnes (Nom du studio, Mail…).</div>`;return}

   <div class="table-wrap" style="max-height:340px;overflow:auto"><table><thead><tr><th>Studio</th><th>Univers</th><th>Zone</th><th>Statut</th><th>Prochaine action</th></tr></thead><tbody>

   </tbody></table></div>
   <div class="actions" style="margin-top:16px"><button class="btn primary" data-act="do-import" ${S.db?"":"disabled"}>Importer ${IMP.list.length-dupes} contacts</button><button class="btn ghost" data-act="cancel-import">Annuler</button></div>`;
}

function renderLayer(){

  if(S.openP){const p=S.openP==="new"?S.draftP:S.projets.find(x=>x.id===S.openP);if(!p){S.openP=null;L.innerHTML="";return}
    if(L.dataset.k!=="p"+S.openP){L.innerHTML=drawerProjet(p,S.openP==="new");L.dataset.k="p"+S.openP}return}

/* ───────── Interactions ───────── */
document.addEventListener("click",async e=>{
  const t=e.target;
  if(t.closest("[data-close]")){closeLayer();return}
  const star=t.closest("[data-star]");if(star){const n=+star.dataset.star,cur=document.querySelectorAll("#c-pot .on").length;const v=cur===n?n-1:n;document.querySelectorAll("#c-pot button").forEach((b,i)=>b.classList.toggle("on",i<v));return}
  const svc=t.closest("[data-svc]");if(svc){svc.classList.toggle("primary");return}
  const ev=t.closest("[data-ev]");if(ev){const c=S.contacts.find(x=>x.id===ev.dataset.id);if(!c)return;await runEvent(c,ev.dataset.ev);return}
  const sn=t.closest("[data-snooze]");if(sn){const c=S.contacts.find(x=>x.id===sn.dataset.snooze);if(c&&c.next){await save("contacts",c.id,{next:{...c.next,date:addDays(c.next.date<today()?today():c.next.date,3)}});toast("Reporté de 3 jours")}return}
  const op=t.closest("[data-open]");if(op&&!t.closest("a,button:not([data-open])")){S.open=op.dataset.open;S.openP=null;renderLayer();return}
  const opp=t.closest("[data-openp]");if(opp){S.openP=opp.dataset.openp;S.open=null;renderLayer();return}
  const so=t.closest("[data-sort]");if(so){const k=so.dataset.sort;S.sort=S.sort.k===k?{k,dir:-S.sort.dir}:{k,dir:k==="studio"||k==="next"?1:-1};render();return}
  const a=t.closest("[data-act]");if(!a)return;
  switch(a.dataset.act){
    case"new":S.draft={univers:"da",cible:"studio",zone:"fr",potentiel:0};S.open="new";renderLayer();break;
    case"newp":S.draftP={stage:"production",univers:"da",services:[]};S.openP="new";renderLayer();break;
    case"save-c":await saveContact();break;
    case"del-c":if(a.dataset.sure){await del("contacts",S.open);closeLayer();toast("Fiche supprimée")}else{a.dataset.sure=1;a.textContent="Confirmer la suppression"}break;
    case"save-p":await saveProjet();break;
    case"del-p":if(a.dataset.sure){await del("projets",S.openP);closeLayer();toast("Projet supprimé")}else{a.dataset.sure=1;a.textContent="Confirmer la suppression"}break;
    case"do-import":a.disabled=true;await doImport();break;
    case"cancel-import":IMP=null;document.getElementById("i-preview").innerHTML="";document.getElementById("i-paste").value="";break;
    case"clear-ex":if(a.dataset.sure){a.disabled=true;for(const c of S.contacts.filter(x=>x.exemple))await del("contacts",c.id);for(const p of S.projets.filter(x=>x.exemple))await del("projets",p.id);toast("Exemples supprimés")}else{a.dataset.sure=1;a.textContent="Confirmer : supprimer les exemples"}break;
  }
});

  const v=id=>(document.getElementById(id)||{}).value??"";
  const body={titre:v("p-titre").trim(),client:v("p-client").trim(),univers:v("p-univers"),montant:+v("p-montant")||0,stage:v("p-stage"),facture:v("p-facture"),paye:v("p-paye"),notes:v("p-notes"),
    services:[...document.querySelectorAll("#p-services .primary")].map(b=>b.dataset.svc)};
  if(body.stage==="facture"&&!body.facture)body.facture=today();
  if(body.stage==="paye"&&!body.paye)body.paye=today();
  if(!body.titre){toast("Donnez un nom au projet.");return}
  const isNew=S.openP==="new",id=isNew?uid():S.openP;
  if(await save("projets",id,isNew?{...body,cree:today()}:body,isNew)){toast(isNew?"Projet créé":"Enregistré");closeLayer()}
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(S.open||S.openP))closeLayer()});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id&&id.startsWith("f-")){S.filters[id.slice(2)]=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById(id);if(el){el.focus();if(id==="f-q"&&pos!=null)el.setSelectionRange(pos,pos)}}
  if(id==="i-paste"){clearTimeout(window._pt);window._pt=setTimeout(()=>{if(e.target.value.trim())showPreview(e.target.value)},400)}
});
document.addEventListener("change",e=>{
  if(e.target.id==="i-file"&&e.target.files[0])readFile(e.target.files[0]);
  if(["i-univers","i-cible","i-zone"].includes(e.target.id)){const p=document.getElementById("i-paste");if(window._lastTxt||p.value)showPreview(window._lastTxt||p.value)}
});
function readFile(f){const r=new FileReader();r.onload=()=>{window._lastTxt=r.result;showPreview(r.result)};r.readAsText(f)}

/* Glisser-déposer */
let dragId=null,dragP=false;
document.addEventListener("dragstart",e=>{const c=e.target.closest("[data-card],[data-pcard]");if(!c)return;dragP=!!c.dataset.pcard;dragId=c.dataset.card||c.dataset.pcard;c.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId)}catch(_){}});
document.addEventListener("dragend",e=>{document.querySelectorAll(".dragging,.over").forEach(x=>x.classList.remove("dragging","over"))});
document.addEventListener("dragover",e=>{const col=e.target.closest(dragP?"[data-pdrop]":"[data-drop]");if(!col)return;e.preventDefault();document.querySelectorAll(".over").forEach(x=>x!==col&&x.classList.remove("over"));col.classList.add("over")});
document.addEventListener("drop",async e=>{
  const col=e.target.closest(dragP?"[data-pdrop]":"[data-drop]");if(!col||!dragId)return;e.preventDefault();col.classList.remove("over");
  if(dragP){const p=S.projets.find(x=>x.id===dragId),k=col.dataset.pdrop;if(!p||p.stage===k)return;const patch={stage:k};if(k==="facture"&&!p.facture)patch.facture=today();if(k==="paye"&&!p.paye)patch.paye=today();await save("projets",p.id,patch);toast((PSTAGES.find(s=>s.k===k)||{}).l)}
  else{const c=S.contacts.find(x=>x.id===dragId),k=col.dataset.drop;if(!c||c.stage===k)return;await runEvent(c,STAGE_EVENT[k])}
  dragId=null;
});
document.addEventListener("dragover",e=>{const d=e.target.closest("#drop");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("drop",e=>{const d=e.target.closest("#drop");if(d){e.preventDefault();d.classList.remove("over");const f=e.dataTransfer.files[0];if(f)readFile(f)}});

boot();
</script>
